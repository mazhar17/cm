"checkbox\" ${co.tla.includes(t)?\"checked\":\"\"} onchange=\"toggleTLA('${co.id}','${esc(t)}',this.checked)\">${t}<\u002Flabel>`).join(\"\")}<\u002Fdiv>\n      <input class=\"in\" style=\"margin-top:6px\" placeholder=\"Other activity (optional, comma separated)\" value=\"${esc(co.tlaOther||\"\")}\" onchange=\"setCLO('${co.id}','tlaOther',this.value)\"><\u002Fdiv>`).join(\"\") : `<div class=\"empty\">Add CLOs first.<\u002Fdiv>`}\n  <\u002Fdiv>\n  <div class=\"card\"><h2>Notional Hours (Student Learning Time) per CLO <span class=\"crit\">Criterion 5.2<\u002Fspan><\u002Fh2>\n    <p class=\"hint\">Hours an average student spends to attain each CLO. Course total ${tot? `<b>${tot}<\u002Fb>`:\"—\"}${credit? ` against a guide of about <b>${notional}<\u002Fb> notional hours for ${credit} credit(s)`:\"\"}. ${credit&&tot? (Math.abs(tot-notional)/notional>0.15? `<span class=\"badge amber\">differs from the guide by more than 15%<\u002Fspan>`:`<span class=\"badge green\">within 15% of the guide<\u002Fspan>`):\"\"}<\u002Fp>\n    ${c.clos.length? `<div class=\"tbl-wrap\"><table class=\"tbl\"><thead><tr><th>CLO<\u002Fth><th>Lecture / contact<\u002Fth><th>Tutorial<\u002Fth><th>Lab / practical<\u002Fth><th>Independent study<\u002Fth><th>Assessment & preparation<\u002Fth><th>Total<\u002Fth><\u002Ftr><\u002Fthead><tbody>\n      ${c.clos.map((co,i)=>`<tr><td><b>CLO${i+1}<\u002Fb><\u002Ftd>${[\"lec\",\"tut\",\"prac\",\"self\",\"asm\"].map(k=>`<td><input type=\"number\" min=\"0\" step=\"0.5\" value=\"${esc(co.slt[k])}\" onchange=\"setSLT('${co.id}','${k}',this.value)\"><\u002Ftd>`).join(\"\")}<td><b>${sltOf(co)||\"—\"}<\u002Fb><\u002Ftd><\u002Ftr>`).join(\"\")}\n      <tr><td><b>Total<\u002Fb><\u002Ftd>${[\"lec\",\"tut\",\"prac\",\"self\",\"asm\"].map(k=>`<td><b>${c.clos.reduce((t,co)=>t+(parseFloat(co.slt[k])||0),0)||\"—\"}<\u002Fb><\u002Ftd>`).join(\"\")}<td><b>${tot||\"—\"}<\u002Fb><\u002Ftd><\u002Ftr><\u002Ftbody><\u002Ftable><\u002Fdiv>`:\"\"}\n  <\u002Fdiv>\n  <div class=\"card\"><h2>Weekly Plan <span class=\"crit\">Criteria 5.2 · 5.4<\u002Fspan><\u002Fh2>\n    <p class=\"hint\">Topics, the CLOs they serve, the activity and contact hours per week. Printed in the Course Plan so students know what is coming (Criterion 5.4).<\u002Fp>\n    <div class=\"tbl-wrap\"><table class=\"tbl\"><thead><tr><th style=\"width:56px\">Week<\u002Fth><th>Topic(s)<\u002Fth><th style=\"width:${Math.max(120,c.clos.length*48)}px\">CLOs<\u002Fth><th style=\"width:200px\">Activity / method<\u002Fth><th style=\"width:70px\">Hours<\u002Fth><\u002Ftr><\u002Fthead><tbody>\n      ${c.weeks.map((w,i)=>`<tr><td><b>${i+1}<\u002Fb><\u002Ftd><td><input value=\"${esc(w.topic)}\" onchange=\"setWeek(${i},'topic',this.value)\"><\u002Ftd>\n        <td style=\"white-space:nowrap\">${c.clos.map((co,k)=>`<label style=\"font-size:11.5px;margin-right:6px\"><input type=\"checkbox\" ${w.clos.includes(co.id)?\"checked\":\"\"} onchange=\"toggleWeekCLO(${i},'${co.id}',this.checked)\"> ${k+1}<\u002Flabel>`).join(\"\")||\"—\"}<\u002Ftd>\n        <td><input value=\"${esc(w.tla)}\" list=\"tlaList\" onchange=\"setWeek(${i},'tla',this.value)\"><\u002Ftd><td><input type=\"number\" min=\"0\" step=\"0.5\" value=\"${esc(w.hrs)}\" onchange=\"setWeek(${i},'hrs',this.value)\"><\u002Ftd><\u002Ftr>`).join(\"\")}\n      <tr><td colspan=\"2\"><b>Contact hours planned<\u002Fb><\u002Ftd><td colspan=\"2\">${c.clos.map((co,k)=>{const n=c.weeks.filter(w=>w.clos.includes(co.id)).length;return `<span class=\"badge ${n?\"ink\":\"red\"}\" style=\"margin-right:4px\">CLO${k+1}: ${n} wk<\u002Fspan>`;}).join(\"\")}<\u002Ftd><td><b>${c.weeks.reduce((t,w)=>t+(parseFloat(w.hrs)||0),0)||\"—\"}<\u002Fb><\u002Ftd><\u002Ftr>\n    <\u002Ftbody><\u002Ftable><\u002Fdiv><datalist id=\"tlaList\">${TLA_POOL.map(t=>`<option value=\"${esc(t)}\">`).join(\"\")}<\u002Fdatalist>\n  <\u002Fdiv>`;\n}\nfunction toggleTLA(id,t,on){ const co=activeCourse().clos.find(x=>x.id===id); co.tla=on? co.tla.concat(co.tla.includes(t)?[]:[t]) : co.tla.filter(x=>x!==t); save(); toast(\"Saved\"); }\nfunction setSLT(id,k,v){ const co=activeCourse().clos.find(x=>x.id===id); co.slt[k]=v; save(); renderTLA(); }\nfunction setWeek(i,k,v){ activeCourse().weeks[i][k]=String(v).trim(); save(); if(k===\"hrs\") renderTLA(); else toast(\"Saved\"); }\nfunction toggleWeekCLO(i,id,on){ const w=activeCourse().weeks[i]; w.clos=on? w.clos.concat(w.clos.includes(id)?[]:[id]) : w.clos.filter(x=>x!==id); save(); renderTLA(); }\n\n/* ============ Assessments ============ */\nfunction allItems(c){ return c.assessments.flatMap(a=>a.items.map(it=>({...it,aName:a.name||a.type,aId:a.id,aType:a.type}))); }\nfunction renderAssess(){\n  const el=document.getElementById(\"tab-assess\"); const c=activeCourse(); if(!c) return noCourse(el);\n  const totW=c.assessments.reduce((s,a)=>s+(parseFloat(a.weightPct)||0),0);\n  const untagged=allItems(c).filter(it=>!c.clos.some(co=>co.id===it.cloId)).length;\n  const cloMarks=c.clos.map(co=>allItems(c).filter(it=>it.cloId===co.id).reduce((s,it)=>s+(parseFloat(it.max)||0),0));\n  el.innerHTML=`\n  ${cqiInputsCard(c,\"assess\")}\n  ${guide(`<b>BAC Criterion 5.1<\u002Fb> — assessments should be practical, promote critical thinking and higher-order skills; keep copies of question papers, tools and answer scripts. <b>5.4<\u002Fb> — students must know the criteria and rubrics in advance. <b>5.5<\u002Fb> — results of every continuous assessment must be fed back in time (record the dates here or in Attendance). <b>5.6<\u002Fb> — final examination papers are moderated by a committee with an external member (note in Course File → Moderation).`,\"assess\")}\n  <div class=\"card\"><h2>Assessment Plan <span class=\"crit\">Criteria 5.1 · 5.4 · 5.5<\u002Fspan><\u002Fh2>\n    <p class=\"hint\">Every item is tagged with the CLO it measures and its maximum marks. Weights should total 100% ${totW? (Math.abs(totW-100)<0.01? '<span class=\"badge green\">100%<\u002Fspan>':`<span class=\"badge amber\">now ${totW}%<\u002Fspan>`):\"\"}. ${untagged? `<span class=\"badge red\">${untagged} item(s) without a valid CLO<\u002Fspan>`:\"\"}<\u002Fp>\n    ${c.assessments.map(a=>`<div style=\"border:1px solid var(--border);padding:12px;margin-bottom:12px\">\n      <div class=\"grid\" style=\"grid-template-columns:150px 1fr 90px 130px 130px 36px;align-items:end\">\n        <label class=\"fld\">Type<select onchange=\"setA('${a.id}','type',this.value)\">${ASSESS_TYPES.map(t=>`<option ${a.type===t?\"selected\":\"\"}>${t}<\u002Foption>`).join(\"\")}<\u002Fselect><\u002Flabel>\n        <label class=\"fld\">Name<input value=\"${esc(a.name)}\" placeholder=\"e.g., Quiz 1\" onchange=\"setA('${a.id}','name',this.value)\"><\u002Flabel>\n        <label class=\"fld\">Weight %<input type=\"number\" min=\"0\" max=\"100\" value=\"${esc(a.weightPct)}\" onchange=\"setA('${a.id}','weightPct',this.value)\"><\u002Flabel>\n        <label class=\"fld\">Date held<input type=\"date\" value=\"${esc(a.date)}\" onchange=\"setA('${a.id}','date',this.value)\"><\u002Flabel>\n        <label class=\"fld\" title=\"Criterion 5.5\">Feedback given on<input type=\"date\" value=\"${esc(a.fbDate)}\" onchange=\"setA('${a.id}','fbDate',this.value)\"><\u002Flabel>\n        <button class=\"icon-btn\" onclick=\"delA('${a.id}')\" title=\"Delete assessment\">✕<\u002Fbutton>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:16px;flex-wrap:wrap;margin-top:8px;align-items:center\">\n        <label class=\"chk\"><input type=\"checkbox\" ${a.rubric?\"checked\":\"\"} onchange=\"setA('${a.id}','rubric',this.checked)\">Rubric / marking scheme shared with students in advance<\u002Flabel>\n        <label class=\"fld\" style=\"flex:1;min-width:200px\">Feedback mode<input value=\"${esc(a.fbMode)}\" placeholder=\"e.g., scripts returned in class; marks posted on LMS\" onchange=\"setA('${a.id}','fbMode',this.value)\"><\u002Flabel>\n        ${a.date&&a.fbDate? (fbDays(a)>14? `<span class=\"badge amber\">${fbDays(a)} days to feedback<\u002Fspan>`:`<span class=\"badge green\">${fbDays(a)} days to feedback<\u002Fspan>`):\"\"}\n      <\u002Fdiv>\n      <table class=\"tbl\" style=\"margin-top:10px\"><thead><tr><th style=\"width:36%\">Item / question<\u002Fth><th style=\"width:130px\">CLO<\u002Fth><th style=\"width:130px\">Bloom level<\u002Fth><th style=\"width:90px\">Max marks<\u002Fth><th style=\"width:36px\"><\u002Fth><\u002Ftr><\u002Fthead><tbody>\n        ${a.items.map(it=>`<tr><td><input value=\"${esc(it.label)}\" placeholder=\"e.g., Q1\" onchange=\"setItem('${a.id}','${it.id}','label',this.value)\"><\u002Ftd>\n          <td><select onchange=\"setItem('${a.id}','${it.id}','cloId',this.value)\"><option value=\"\">—<\u002Foption>${c.clos.map((co,k)=>`<option value=\"${co.id}\" ${it.cloId===co.id?\"selected\":\"\"}>CLO${k+1}<\u002Foption>`).join(\"\")}<\u002Fselect><\u002Ftd>\n          <td><select onchange=\"setItem('${a.id}','${it.id}','level',this.value)\"><option value=\"\"><\u002Foption>${BLOOMS.map(b=>`<option ${it.level===b?\"selected\":\"\"}>${b}<\u002Foption>`).join(\"\")}<\u002Fselect><\u002Ftd>\n          <td><input type=\"number\" min=\"0\" step=\"0.5\" value=\"${esc(it.max)}\" onchange=\"setItem('${a.id}','${it.id}','max',this.value)\"><\u002Ftd>\n          <td><button class=\"icon-btn\" onclick=\"delItem('${a.id}','${it.id}')\">✕<\u002Fbutton><\u002Ftd><\u002Ftr>`).join(\"\")}\n        <tr><td colspan=\"3\" style=\"text-align:right;color:var(--muted)\">Total<\u002Ftd><td><b>${a.items.reduce((s,it)=>s+(parseFloat(it.max)||0),0)}<\u002Fb><\u002Ftd><td><\u002Ftd><\u002Ftr><\u002Ftbody><\u002Ftable>\n      <div class=\"btn-row\" style=\"margin-top:8px\"><button class=\"btn secondary small\" onclick=\"addItem('${a.id}')\">+ Item<\u002Fbutton><\u002Fdiv>\n    <\u002Fdiv>`).join(\"\")}\n    <div class=\"btn-row\"><button class=\"btn\" onclick=\"addA()\">+ Add Assessment<\u002Fbutton><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"card\"><h2>Marks distribution across CLOs<\u002Fh2>\n    ${c.clos.length? c.clos.map((co,i)=>{const tot=cloMarks.reduce((a,b)=>a+b,0);const p=tot? cloMarks[i]/tot*100:0;return `<div style=\"display:grid;grid-template-columns:60px 1fr 90px;gap:10px;align-items:center;margin:4px 0\"><b>CLO${i+1}<\u002Fb><div class=\"bar\"><i class=\"${cloMarks[i]?\"\":\"low\"}\" style=\"width:${p}%\"><\u002Fi><\u002Fdiv><span style=\"font-size:13px\">${cloMarks[i]} marks ${cloMarks[i]?\"\":'<span class=\"badge red\">none<\u002Fspan>'}<\u002Fspan><\u002Fdiv>`;}).join(\"\")\n      +`<p class=\"hint\" style=\"margin-top:8px\">Every CLO needs at least one assessment item — Criterion 5.2(v) asks the teacher to certify that all CLOs were assessed.<\u002Fp>` : `<div class=\"empty\">Add CLOs first.<\u002Fdiv>`}\n    ${bloomCheck(c)}\n  <\u002Fdiv>`;\n}\nfunction fbDays(a){ return Math.round((new Date(a.fbDate)-new Date(a.date))/86400000); }\nfunction bloomCheck(c){\n  const hi=allItems(c).filter(it=>[\"Analyze\",\"Evaluate\",\"Create\"].includes(it.level)).reduce((s,it)=>s+(parseFloat(it.max)||0),0);\n  const tot=allItems(c).reduce((s,it)=>s+(parseFloat(it.max)||0),0);\n  if(!tot) return \"\";\n  return `<p class=\"hint\" style=\"margin-top:8px\">Higher-order thinking (Analyze/Evaluate/Create) carries <b>${pct(hi,tot)}%<\u002Fb> of the marks — Criterion 5.1 looks for a visible share of HOTS. Items without a level are not counted.<\u002Fp>`;\n}\nfunction addA(){ activeCourse().assessments.push({id:uid(),type:\"Quiz\",name:\"\",weightPct:\"\",items:[],rubric:false,date:\"\",fbDate:\"\",fbMode:\"\"}); save(); renderAssess(); }\nfunction setA(id,k,v){ const a=activeCourse().assessments.find(x=>x.id===id); a[k]=(typeof v===\"string\")?v.trim():v; save(); if([\"date\",\"fbDate\",\"weightPct\",\"rubric\"].includes(k)) renderAssess(); else toast(\"Saved\"); }\nfunction delA(id){ const c=activeCourse(); if(!confirm(\"Delete this assessment and its marks?\")) return; const a=c.assessments.find(x=>x.id===id); Object.values(c.marks).forEach(m=>a.items.forEach(it=>delete m[it.id])); c.assessments=c.assessments.filter(x=>x.id!==id); save(); renderAssess(); }\nfunction addItem(aid){ const c=activeCourse(); const a=c.assessments.find(x=>x.id===aid); a.items.push({id:uid(),label:\"Q\"+(a.items.length+1),cloId:c.clos[0]?c.clos[0].id:\"\",level:\"\",max:\"\"}); save(); renderAssess(); }\nfunction setItem(aid,iid,k,v){ const it=activeCourse().assessments.find(x=>x.id===aid).items.find(x=>x.id===iid); it[k]=String(v).trim(); save(); if(k===\"max\"||k===\"cloId\"||k===\"level\") renderAssess(); else toast(\"Saved\"); }\nfunction delItem(aid,iid){ const c=activeCourse(); const a=c.assessments.find(x=>x.id===aid); a.items=a.items.filter(x=>x.id!==iid); Object.values(c.marks).forEach(m=>delete m[iid]); save(); renderAssess(); }\n\n/* ============ Students & Marks ============ */\nfunction renderMarks(){\n  const el=document.getElementById(\"tab-marks\"); const c=activeCourse(); if(!c) return noCourse(el);\n  const items=allItems(c);\n  el.innerHTML=`\n  ${guide(`Marks are the direct evidence of CLO attainment (Criterion 4.8 iv). Enter them per item; the grid saves as you type. Students can be pasted from a spreadsheet (ID and Name columns), and marks exchanged as CSV.`,\"marks\")}\n  <div class=\"card\"><h2>Students<\u002Fh2>\n    <div class=\"grid c2\" style=\"align-items:end\"><label class=\"fld\">Paste from spreadsheet — one student per line: <i>ID [tab or comma] Name<\u002Fi><textarea id=\"stuPaste\" placeholder=\"2021-1-60-001\tAyesha Siddiqua\"><\u002Ftextarea><\u002Flabel>\n      <div class=\"btn-row\" style=\"margin:0\"><button class=\"btn\" onclick=\"pasteStudents()\">Add pasted students<\u002Fbutton><button class=\"btn secondary\" onclick=\"addStudent()\">+ One student<\u002Fbutton>${c.students.length? `<button class=\"btn danger\" onclick=\"clearStudents()\">Remove all students<\u002Fbutton>`:\"\"}<\u002Fdiv><\u002Fdiv>\n    <p class=\"hint\" style=\"margin-top:8px\">${c.students.length} student(s) enrolled.<\u002Fp>\n  <\u002Fdiv>\n  <div class=\"card\"><h2>Marks Entry<\u002Fh2>\n    <div class=\"btn-row\" style=\"margin:0 0 12px\"><button class=\"btn secondary small\" onclick=\"exportMarksCSV(true)\">Empty CSV template<\u002Fbutton><button class=\"btn secondary small\" onclick=\"exportMarksCSV(false)\">Export marks CSV<\u002Fbutton><label class=\"btn secondary small\" style=\"cursor:pointer\">Import CSV<input type=\"file\" accept=\".csv,text/csv\" style=\"display:none\" onchange=\"importMarksCSV(this)\"><\u002Flabel><\u002Fdiv>\n    ${c.students.length&&items.length? `<div class=\"marks-wrap\"><table class=\"tbl\"><thead>\n      <tr><th class=\"stick1\" rowspan=\"2\">#<\u002Fth><th class=\"stick2\" rowspan=\"2\">ID<\u002Fth><th class=\"stick3\" rowspan=\"2\">Name<\u002Fth>${c.assessments.filter(a=>a.items.length).map(a=>`<th colspan=\"${a.items.length}\" style=\"text-align:center\">${esc(a.name||a.type)}<\u002Fth>`).join(\"\")}<th rowspan=\"2\">Total<\u002Fth><\u002Ftr>\n      <tr>${items.map(it=>`<th style=\"text-align:center;font-weight:600;text-transform:none;letter-spacing:0\">${esc(it.label)}<div style=\"font-size:10px;color:var(--muted)\">${cloLabel(c,it.cloId)} · /${esc(it.max)}<\u002Fdiv><\u002Fth>`).join(\"\")}<\u002Ftr><\u002Fthead>\n      <tbody>${c.students.map((s,i)=>{const m=c.marks[s.id]||{};const tot=items.reduce((t,it)=>t+(parseFloat(m[it.id])||0),0);return `<tr><td class=\"stick1\">${i+1}<\u002Ftd><td class=\"stick2\"><input class=\"marks-input\" style=\"width:110px;text-align:left\" value=\"${esc(s.sid)}\" onchange=\"setStu('${s.id}','sid',this.value)\"><\u002Ftd><td class=\"stick3\" style=\"white-space:nowrap\"><input class=\"marks-input\" style=\"width:150px;text-align:left\" value=\"${esc(s.name)}\" onchange=\"setStu('${s.id}','name',this.value)\"> <button class=\"icon-btn\" onclick=\"delStu('${s.id}')\" title=\"Remove\">✕<\u002Fbutton><\u002Ftd>\n        ${items.map(it=>`<td style=\"text-align:center\"><input class=\"marks-input\" type=\"number\" min=\"0\" max=\"${esc(it.max)}\" step=\"0.5\" value=\"${m[it.id]??\"\"}\" onchange=\"setMark('${s.id}','${it.id}',this.value,this)\"><\u002Ftd>`).join(\"\")}<td style=\"text-align:center\"><b>${Math.round(tot*100)/100}<\u002Fb><\u002Ftd><\u002Ftr>`;}).join(\"\")}<\u002Ftbody><\u002Ftable><\u002Fdiv>`\n      : `<div class=\"empty\">${c.students.length? \"Add assessment items first.\":\"Add students first.\"}<\u002Fdiv>`}\n  <\u002Fdiv>`;\n}\nfunction addStudent(){ activeCourse().students.push({id:uid(),sid:\"\",name:\"\"}); save(); renderMarks(); }\nfunction pasteStudents(){\n  const c=activeCourse(); const t=(document.getElementById(\"stuPaste\").value||\"\").trim(); if(!t){ toast(\"Paste the list first\"); return; }\n  let n=0; t.split(/\\r?\\n/).forEach(l=>{ const p=l.split(/\\t|,|;/).map(x=>x.trim()).filter(Boolean); if(!p.length) return; if(c.students.some(s=>s.sid===p[0])) return; c.students.push({id:uid(),sid:p[0],name:p.slice(1).join(\" \")}); n++; });\n  save(); renderMarks(); toast(n+\" student(s) added\");\n}\nfunction setStu(id,k,v){ const s=activeCourse().students.find(x=>x.id===id); s[k]=String(v).trim(); save(); toast(\"Saved\"); }\nfunction delStu(id){ const c=activeCourse(); c.students=c.students.filter(x=>x.id!==id); delete c.marks[id]; save(); renderMarks(); }\nfunction clearStudents(){ const c=activeCourse(); if(!confirm(\"Remove ALL students and their marks?\")) return; c.students=[]; c.marks={}; save(); renderMarks(); }\nfunction setMark(sid,iid,v,el){\n  const c=activeCourse(); c.marks[sid]=c.marks[sid]||{};\n  if(v===\"\"){ delete c.marks[sid][iid]; } else { const it=allItems(c).find(x=>x.id===iid); let n=parseFloat(v); if(isNaN(n)) n=0; const mx=parseFloat(it&&it.max); if(!isNaN(mx)&&n>mx){ n=mx; el.value=n; toast(\"Capped at the maximum marks\"); } c.marks[sid][iid]=n; }\n  save(); const row=el.closest(\"tr\"); const items=allItems(c); const m=c.marks[sid]; row.lastElementChild.innerHTML=\"<b>\"+Math.round(items.reduce((t,x)=>t+(parseFloat(m[x.id])||0),0)*100)/100+\"<\u002Fb>\";\n}\nfunction csvCell(s){ s=String(s??\"\"); return /[\",\\n]/.test(s)? '\"'+s.replace(/\"/g,'\"\"')+'\"' : s; }\nfunction exportMarksCSV(empty){\n  const c=activeCourse(); const items=allItems(c);\n  const rows=[[\"ID\",\"Name\",...items.map(it=>`${it.aName} | ${it.label} | ${cloLabel(c,it.cloId)} | max ${it.max}`)]];\n  c.students.forEach(s=>{ const m=c.marks[s.id]||{}; rows.push([s.sid,s.name,...items.map(it=>empty?\"\":(m[it.id]??\"\"))]); });\n  if(!c.students.length) rows.push([\"<student id>\",\"<name>\",...items.map(()=>\"\")]);\n  download((c.code||\"course\")+\"-marks\"+(empty?\"-template\":\"\")+\".csv\", rows.map(r=>r.map(csvCell).join(\",\")).join(\"\\n\"), \"text/csv\");\n}\nfunction importMarksCSV(input){\n  const f=input.files&&input.files[0]; if(!f) return; const c=activeCourse(); const items=allItems(c);\n  const rd=new FileReader(); rd.onload=e=>{\n    const lines=parseCSV(String(e.target.result)); if(lines.length<2){ toast(\"No data rows\"); return; }\n    let added=0, cells=0;\n    lines.slice(1).forEach(r=>{ const sid=(r[0]||\"\").trim(); if(!sid||/^<\u002F.test(sid)) return; let s=c.students.find(x=>x.sid===sid); if(!s){ s={id:uid(),sid,name:(r[1]||\"\").trim()}; c.students.push(s); added++; }\n      c.marks[s.id]=c.marks[s.id]||{}; items.forEach((it,k)=>{ const v=(r[k+2]||\"\").trim(); if(v!==\"\"&&!isNaN(parseFloat(v))){ c.marks[s.id][it.id]=Math.min(parseFloat(v),parseFloat(it.max)||Infinity); cells++; } }); });\n    save(); renderMarks(); toast(`${cells} mark(s) imported, ${added} new student(s)`); };\n  rd.readAsText(f); input.value=\"\";\n}\nfunction parseCSV(t){ const out=[]; let row=[],cur=\"\",q=false; for(let i=0;i<t.length;i++){ const ch=t[i]; if(q){ if(ch==='\"'){ if(t[i+1]==='\"'){cur+='\"';i++;} else q=false; } else cur+=ch; } else if(ch==='\"') q=true; else if(ch===\",\"){ row.push(cur); cur=\"\"; } else if(ch===\"\\n\"||ch===\"\\r\"){ if(ch===\"\\r\"&&t[i+1]===\"\\n\") i++; row.push(cur); out.push(row); row=[]; cur=\"\"; } else cur+=ch; } if(cur!==\"\"||row.length){ row.push(cur); out.push(row); } return out.filter(r=>r.some(x=>x!==\"\")); }\nfunction download(name,content,mime){ const b=new Blob([content],{type:mime||\"text/plain\"}); const a=document.createElement(\"a\"); a.href=URL.createObjectURL(b); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },500); }\n\n/* ============ Attendance & class records ============ */\nfunction renderAttend(){\n  const el=document.getElementById(\"tab-attend\"); const c=activeCourse(); if(!c) return noCourse(el);\n  const held=c.sessions.filter(s=>!s.cancelled).length, makeups=c.sessions.filter(s=>s.makeup).length, missed=c.sessions.filter(s=>s.cancelled).length;\n  const n=c.students.length; const avg=held&&n? Math.round(c.sessions.filter(s=>!s.cancelled).reduce((t,s)=>t+(parseFloat(s.present)||0),0)/held/n*100):null;\n  el.innerHTML=`\n  ${guide(`<b>BAC Criterion 5.3<\u002Fb> — teachers must keep the class schedule, records of attendance, records of missed classes and make-up classes. <b>5.9<\u002Fb> — provision of tutorial classes. Log each session here; the signed attendance summary and the make-up notice list print from Course File. Head-count per session is enough for the summary — keep the signed sheet itself in the physical file.`,\"attend\")}\n  <div class=\"stat-cards\"><div class=\"stat\"><div class=\"num\">${held}<\u002Fdiv><div class=\"lbl\">Sessions held<\u002Fdiv><\u002Fdiv><div class=\"stat\"><div class=\"num\">${missed}<\u002Fdiv><div class=\"lbl\">Missed / cancelled<\u002Fdiv><\u002Fdiv><div class=\"stat\"><div class=\"num\">${makeups}<\u002Fdiv><div class=\"lbl\">Make-up classes<\u002Fdiv><\u002Fdiv><div class=\"stat\"><div class=\"num\">${avg===null?\"—\":avg+\"%\"}<\u002Fdiv><div class=\"lbl\">Average attendance<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n  <div class=\"card\"><h2>Session Log <span class=\"crit\">Criteria 5.3 · 5.9<\u002Fspan><\u002Fh2>\n    <label class=\"fld\" style=\"max-width:420px\">Approved class routine reference (signed by ${esc(role(\"hod\"))})<input value=\"${esc(c.routineRef)}\" placeholder=\"e.g., Routine Spring 2026, Room 402, Sun/Tue 10:00–11:30\" onchange=\"cSet('routineRef',this.value)\"><\u002Flabel>\n    <div class=\"tbl-wrap\" style=\"margin-top:12px\"><table class=\"tbl\"><thead><tr><th style=\"width:130px\">Date<\u002Fth><th style=\"width:110px\">Kind<\u002Fth><th>Topic / CLO(s)<\u002Fth><th style=\"width:90px\">Present<\u002Fth><th style=\"width:80px\">Cancelled<\u002Fth><th style=\"width:80px\">Make-up<\u002Fth><th>Note (reason, make-up date, notice)<\u002Fth><th style=\"width:36px\"><\u002Fth><\u002Ftr><\u002Fthead><tbody>\n      ${c.sessions.map((s,i)=>`<tr><td><input type=\"date\" value=\"${esc(s.date)}\" onchange=\"setSess(${i},'date',this.value)\"><\u002Ftd>\n        <td><select onchange=\"setSess(${i},'kind',this.value)\">${[\"Lecture\",\"Tutorial\",\"Lab/Practical\",\"Other\"].map(k=>`<option ${s.kind===k?\"selected\":\"\"}>${k}<\u002Foption>`).join(\"\")}<\u002Fselect><\u002Ftd>\n        <td><input value=\"${esc(s.topic)}\" onchange=\"setSess(${i},'topic',this.value)\"><\u002Ftd>\n        <td><input type=\"number\" min=\"0\" max=\"${n||999}\" value=\"${esc(s.present)}\" ${s.cancelled?\"disabled\":\"\"} onchange=\"setSess(${i},'present',this.value)\"><\u002Ftd>\n        <td style=\"text-align:center\"><input type=\"checkbox\" ${s.cancelled?\"checked\":\"\"} onchange=\"setSess(${i},'cancelled',this.checked)\"><\u002Ftd>\n        <td style=\"text-align:center\"><input type=\"checkbox\" ${s.makeup?\"checked\":\"\"} onchange=\"setSess(${i},'makeup',this.checked)\"><\u002Ftd>\n        <td><input value=\"${esc(s.note)}\" onchange=\"setSess(${i},'note',this.value)\"><\u002Ftd><td><button class=\"icon-btn\" onclick=\"delSess(${i})\">✕<\u002Fbutton><\u002Ftd><\u002Ftr>`).join(\"\")}\n    <\u002Ftbody><\u002Ftable><\u002Fdiv>\n    <div class=\"btn-row\"><button class=\"btn\" onclick=\"addSess()\">+ Session<\u002Fbutton><button class=\"btn secondary\" onclick=\"addSess(true)\">+ Tutorial<\u002Fbutton><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"card\"><h2>Timely Feedback Record <span class=\"crit\">Criterion 5.5<\u002Fspan><\u002Fh2>\n    <p class=\"hint\">Dates come from the Assessment Plan (date held → feedback given). Anything beyond two weeks is flagged.<\u002Fp>\n    ${c.assessments.length? `<table class=\"tbl\"><thead><tr><th>Assessment<\u002Fth><th>Held<\u002Fth><th>Feedback given<\u002Fth><th>Days<\u002Fth><th>Mode<\u002Fth><\u002Ftr><\u002Fthead><tbody>${c.assessments.map(a=>`<tr><td>${esc(a.name||a.type)}<\u002Ftd><td>${esc(a.date)||\"—\"}<\u002Ftd><td>${esc(a.fbDate)||\"—\"}<\u002Ftd><td>${a.date&&a.fbDate? `<span class=\"badge ${fbDays(a)>14?\"amber\":\"green\"}\">${fbDays(a)}<\u002Fspan>`:'<span class=\"badge grey\">—<\u002Fspan>'}<\u002Ftd><td>${esc(a.fbMode)||\"—\"}<\u002Ftd><\u002Ftr>`).join(\"\")}<\u002Ftbody><\u002Ftable>`:`<div class=\"empty\">No assessments yet.<\u002Fdiv>`}\n  <\u002Fdiv>`;\n}\nfunction addSess(tut){ activeCourse().sessions.push({date:\"\",kind:tut?\"Tutorial\":\"Lecture\",topic:\"\",present:\"\",cancelled:false,makeup:false,note:\"\"}); save(); renderAttend(); }\nfunction setSess(i,k,v){ const s=activeCourse().sessions[i]; s[k]=(typeof v===\"string\")?v.trim():v; save(); if(k===\"cancelled\"||k===\"present\"||k===\"makeup\") renderAttend(); else toast(\"Saved\"); }\nfunction delSess(i){ activeCourse().sessions.splice(i,1); save(); renderAttend(); }\n\n\n/* ============ Attainment ============ */\nfunction computeAttainment(c){\n  const items=allItems(c); const P=plos();\n  const clos=c.clos.map((co,i)=>{\n    const its=items.filter(it=>it.cloId===co.id); const max=its.reduce((s,it)=>s+(parseFloat(it.max)||0),0);\n    let nAtt=0, nWith=0, sumPct=0;\n    c.students.forEach(s=>{ const m=c.marks[s.id]||{}; if(!its.some(it=>m[it.id]!==undefined)) return; nWith++; const got=its.reduce((t,it)=>t+(parseFloat(m[it.id])||0),0); const p=max? got/max*100:0; sumPct+=p; if(p>=c.cfg.passMarks) nAtt++; });\n    const pctStu=nWith? nAtt/nWith*100:0;\n    const t=c.survey.tally[co.id]||[0,0,0,0,0]; const nS=t.reduce((a,b)=>a+(parseFloat(b)||0),0); const nOk=t.reduce((a,b,k)=>a+((k+1)>=c.cfg.likertPass?(parseFloat(b)||0):0),0);\n    const ind=nS? nOk/nS*100:null;\n    const comb=(ind===null)? pctStu : (c.cfg.wDirect*pctStu+c.cfg.wIndirect*ind)/100;\n    return {id:co.id,label:\"CLO\"+(i+1),max,nWith,nAtt,pctStu:Math.round(pctStu*10)/10,avgPct:nWith?Math.round(sumPct/nWith*10)/10:0,attained:nWith>0&&pctStu>=c.cfg.kpiTarget,ind:ind===null?null:Math.round(ind*10)/10,nS,comb:Math.round(comb*10)/10,combAtt:nWith>0&&comb>=c.cfg.kpiTarget};\n  });\n  const plosOut=P.map(p=>{ let w=0,sum=0,sumC=0; c.clos.forEach((co,i)=>{ const v=co.plo[p.code]||0; if(v&&clos[i].nWith){ w+=v; sum+=v*clos[i].pctStu; sumC+=v*clos[i].comb; } }); return {code:p.code,text:p.text,domain:p.domain,mapped:w>0,pctStu:w?Math.round(sum/w*10)/10:0,comb:w?Math.round(sumC/w*10)/10:0,attained:w>0&&sum/w>=c.cfg.kpiTarget}; });\n  return {clos,plos:plosOut};\n}\nfunction barChart(rows,target,valKey){\n  const W=880,rowH=30,H=rows.length*rowH+30,L=90,R=60,inner=W-L-R;\n  return `<svg class=\"svgchart\" viewBox=\"0 0 ${W} ${H}\" role=\"img\">${rows.map((r,i)=>{const v=Math.max(0,Math.min(100,r[valKey]||0)); const y=i*rowH+8; return `<text x=\"${L-8}\" y=\"${y+15}\" text-anchor=\"end\" font-size=\"12\" font-weight=\"700\" font-family=\"Archivo,sans-serif\">${esc(r.label||r.code)}<\u002Ftext><rect x=\"${L}\" y=\"${y}\" width=\"${inner}\" height=\"18\" fill=\"#eae7e7\"/><rect x=\"${L}\" y=\"${y}\" width=\"${inner*v/100}\" height=\"18\" fill=\"${v>=target?\"#201e1d\":\"#ec3013\"}\"/><text x=\"${L+inner+6}\" y=\"${y+14}\" font-size=\"12\" font-family=\"Archivo,sans-serif\">${v}%<\u002Ftext>`;}).join(\"\")}\n    <line x1=\"${L+inner*target/100}\" x2=\"${L+inner*target/100}\" y1=\"0\" y2=\"${H-20}\" stroke=\"#605d5d\" stroke-dasharray=\"4 3\"/><text x=\"${L+inner*target/100}\" y=\"${H-6}\" font-size=\"11\" text-anchor=\"middle\" fill=\"#605d5d\" font-family=\"Archivo,sans-serif\">target ${target}%<\u002Ftext><\u002Fsvg>`;\n}\nfunction renderAttain(){\n  const el=document.getElementById(\"tab-attain\"); const c=activeCourse(); if(!c) return noCourse(el);\n  const att=computeAttainment(c); const sub=subSect(\"attain\"); let body=\"\";\n  if(sub===\"clo\"){\n    body=`<div class=\"card\"><h2>Direct CLO Attainment <span class=\"crit\">Criterion 4.8 (iv)<\u002Fspan><\u002Fh2><p class=\"hint\">Percentage of students who scored at least ${c.cfg.passMarks}% of the marks allocated to each CLO. Target: ${c.cfg.kpiTarget}% of students.<\u002Fp>\n      ${att.clos.length? barChart(att.clos,c.cfg.kpiTarget,\"pctStu\")+`<table class=\"tbl\" style=\"margin-top:14px\"><thead><tr><th>CLO<\u002Fth><th>Marks allocated<\u002Fth><th>Students with marks<\u002Fth><th>Students attaining<\u002Fth><th>% attaining<\u002Fth><th>Class average %<\u002Fth><th>Status<\u002Fth><\u002Ftr><\u002Fthead><tbody>${att.clos.map(r=>`<tr><td><b>${r.label}<\u002Fb><\u002Ftd><td>${r.max}<\u002Ftd><td>${r.nWith}<\u002Ftd><td>${r.nAtt}<\u002Ftd><td>${r.pctStu}%<\u002Ftd><td>${r.avgPct}%<\u002Ftd><td>${r.nWith? (r.attained?'<span class=\"badge green\">attained<\u002Fspan>':'<span class=\"badge red\">not attained<\u002Fspan>'):'<span class=\"badge grey\">no marks<\u002Fspan>'}<\u002Ftd><\u002Ftr>`).join(\"\")}<\u002Ftbody><\u002Ftable>`:`<div class=\"empty\">Add CLOs, items and marks.<\u002Fdiv>`}<\u002Fdiv>`;\n  } else if(sub===\"plo\"){\n    body=`<div class=\"card\"><h2>Contribution to PLOs<\u002Fh2><p class=\"hint\">Each PLO's value is the mapping-weighted average of the direct attainment of the CLOs mapped to it. A single course only <i>contributes<\u002Fi> to a PLO; programme-level PLO attainment aggregates many courses.<\u002Fp>\n      ${att.plos.some(p=>p.mapped)? barChart(att.plos.filter(p=>p.mapped),c.cfg.kpiTarget,\"pctStu\")+`<table class=\"tbl\" style=\"margin-top:14px\"><thead><tr><th>PLO<\u002Fth><th>Statement<\u002Fth><th>Domain<\u002Fth><th>Contribution (direct)<\u002Fth><th>Status<\u002Fth><\u002Ftr><\u002Fthead><tbody>${att.plos.map(p=>`<tr><td><b>${esc(p.code)}<\u002Fb><\u002Ftd><td style=\"font-size:12.5px\">${esc(p.text)}<\u002Ftd><td>${esc(p.domain)}<\u002Ftd><td>${p.mapped? p.pctStu+\"%\":\"—\"}<\u002Ftd><td>${p.mapped? (p.attained?'<span class=\"badge green\">attained<\u002Fspan>':'<span class=\"badge red\">below target<\u002Fspan>'):'<span class=\"badge grey\">not mapped<\u002Fspan>'}<\u002Ftd><\u002Ftr>`).join(\"\")}<\u002Ftbody><\u002Ftable>`:`<div class=\"empty\">Map CLOs to PLOs and enter marks.<\u002Fdiv>`}<\u002Fdiv>`;\n  } else if(sub===\"survey\"){\n    body=`<div class=\"card\"><h2>Student Course Evaluation Survey <span class=\"crit\">Criterion 10.2<\u002Fspan><\u002Fh2><p class=\"hint\">Indirect measure. Block A asks students to rate how well they attained each CLO (1 = strongly disagree … 5 = strongly agree); enter the count of responses per rating. Block B is general course feedback. The blank form prints from Course File.<\u002Fp>\n      <label class=\"fld\" style=\"max-width:240px\">Number of respondents<input type=\"number\" min=\"0\" value=\"${esc(c.survey.n)}\" onchange=\"cSet('survey.n',this.value)\"><\u002Flabel>\n      <h3>Block A — CLO attainment (self-rated)<\u002Fh3>\n      <table class=\"tbl\"><thead><tr><th>CLO<\u002Fth><th>Statement<\u002Fth>${[1,2,3,4,5].map(k=>`<th style=\"width:64px;text-align:center\">${k}<\u002Fth>`).join(\"\")}<th style=\"width:110px\">% ≥ ${c.cfg.likertPass}<\u002Fth><\u002Ftr><\u002Fthead><tbody>\n      ${c.clos.map((co,i)=>{const t=c.survey.tally[co.id]||[\"\",\"\",\"\",\"\",\"\"];const r=att.clos[i];return `<tr><td><b>CLO${i+1}<\u002Fb><\u002Ftd><td style=\"font-size:12.5px\">${esc(co.text)}<\u002Ftd>${[0,1,2,3,4].map(k=>`<td><input type=\"number\" min=\"0\" style=\"text-align:center\" value=\"${esc(t[k])}\" onchange=\"setTally('${co.id}',${k},this.value)\"><\u002Ftd>`).join(\"\")}<td>${r.ind===null?\"—\":r.ind+\"%\"}<\u002Ftd><\u002Ftr>`;}).join(\"\")}<\u002Ftbody><\u002Ftable>\n      <h3>Block B — course feedback<\u002Fh3>\n      <table class=\"tbl\"><thead><tr><th>Item<\u002Fth>${[1,2,3,4,5].map(k=>`<th style=\"width:64px;text-align:center\">${k}<\u002Fth>`).join(\"\")}<th style=\"width:110px\">Mean<\u002Fth><\u002Ftr><\u002Fthead><tbody>\n      ${FB_ITEMS.map(([k,q])=>{const t=c.survey.fbTally[k]||[\"\",\"\",\"\",\"\",\"\"];const n=t.reduce((a,b)=>a+(parseFloat(b)||0),0);const mean=n? (t.reduce((a,b,j)=>a+(j+1)*(parseFloat(b)||0),0)/n).toFixed(2):\"—\";return `<tr><td style=\"font-size:12.5px\">${q}<\u002Ftd>${[0,1,2,3,4].map(j=>`<td><input type=\"number\" min=\"0\" style=\"text-align:center\" value=\"${esc(t[j])}\" onchange=\"setFB('${k}',${j},this.value)\"><\u002Ftd>`).join(\"\")}<td>${mean}<\u002Ftd><\u002Ftr>`;}).join(\"\")}<\u002Ftbody><\u002Ftable>\n      <h3>Block C — open-ended (summarise the responses)<\u002Fh3>\n      ${c.survey.openQ.map((q,i)=>`<div class=\"grid c2\" style=\"margin-bottom:8px\"><label class=\"fld\">Question<input value=\"${esc(q.q)}\" onchange=\"cSet('survey.openQ.${i}.q',this.value)\"><\u002Flabel><label class=\"fld\">Summary of responses<textarea onchange=\"cSet('survey.openQ.${i}.sum',this.value)\">${esc(q.sum)}<\u002Ftextarea><\u002Flabel><\u002Fdiv>`).join(\"\")}\n    <\u002Fdiv>`;\n  } else {\n    body=`<div class=\"card\"><h2>Combined CLO Attainment<\u002Fh2><p class=\"hint\">Direct ${c.cfg.wDirect}% + survey ${c.cfg.wIndirect}%. A CLO with no survey data shows its direct value.<\u002Fp>\n      ${att.clos.length? barChart(att.clos,c.cfg.kpiTarget,\"comb\")+`<table class=\"tbl\" style=\"margin-top:14px\"><thead><tr><th>CLO<\u002Fth><th>Direct<\u002Fth><th>Survey<\u002Fth><th>Combined<\u002Fth><th>Status<\u002Fth><\u002Ftr><\u002Fthead><tbody>${att.clos.map(r=>`<tr><td><b>${r.label}<\u002Fb><\u002Ftd><td>${r.pctStu}%<\u002Ftd><td>${r.ind===null?\"—\":r.ind+\"%\"}<\u002Ftd><td><b>${r.comb}%<\u002Fb><\u002Ftd><td>${r.nWith? (r.combAtt?'<span class=\"badge green\">attained<\u002Fspan>':'<span class=\"badge red\">not attained<\u002Fspan>'):'<span class=\"badge grey\">no marks<\u002Fspan>'}<\u002Ftd><\u002Ftr>`).join(\"\")}<\u002Ftbody><\u002Ftable>`:`<div class=\"empty\">Add CLOs, items and marks.<\u002Fdiv>`}<\u002Fdiv>`;\n  }\n  el.innerHTML=guide(`<b>BAC Criterion 4.8 (iv)<\u002Fb> asks for a course evaluation report showing the level of attainment of CLOs and their contribution to the PLOs. Direct measurement uses marks; the student survey is the indirect measure (Criterion 10.2). Both print as the <b>CLO Attainment Report<\u002Fb>.`,\"attain\")+subBar(\"attain\")+body;\n}\nfunction setTally(id,k,v){ const c=activeCourse(); c.survey.tally[id]=c.survey.tally[id]||[\"\",\"\",\"\",\"\",\"\"]; c.survey.tally[id][k]=v; save(); renderAttain(); }\nfunction setFB(k,j,v){ const c=activeCourse(); c.survey.fbTally[k]=c.survey.fbTally[k]||[\"\",\"\",\"\",\"\",\"\"]; c.survey.fbTally[k][j]=v; save(); renderAttain(); }\n\n/* ============ Course Evaluation & CQI (Course Specifications 6.1 ⇄ Course Report 6.1) ============ */\nconst CQI_LOOPS=[[\"A. CQI Loop for CLOs\",\"Direct Measurement\"],[\"A. CQI Loop for CLOs\",\"Indirect Measurement from Survey\"],[\"B. CQI Loop for PLOs\",\"Direct Measurement\"],[\"B. CQI Loop for PLOs\",\"Indirect Measurement from Survey\"]];\nfunction dta(path,val,rows,ph){ return `<textarea class=\"di\" rows=\"${rows||3}\" placeholder=\"${esc(ph||\"\")}\" onchange=\"cSet('${path}',this.value)\">${esc(val||\"\")}<\u002Ftextarea>`; }\nfunction cqiLoopStrip(){\n  const step=(t,s)=>`<div style=\"flex:1 1 150px;min-width:150px;border:1px solid var(--border);border-top:2px solid var(--text);padding:8px 10px\"><b style=\"font-size:12.5px\">${t}<\u002Fb><div style=\"font-size:11.5px;color:var(--muted)\">${s}<\u002Fdiv><\u002Fdiv>`;\n  const arr=`<div style=\"align-self:center;font-size:16px;color:var(--muted)\">→<\u002Fdiv>`;\n  return `<div style=\"display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 14px\">${step(\"Course Specifications 6.1\",\"recommendations received from the previous Course Report, and how this offering reflects them\")}${arr}${step(\"Teach · assess · measure\",\"marks, survey, attainment\")}${arr}${step(\"Course Report 6.1\",\"suggested action plans for the next offering\")}${arr}${step(\"Duplicate for next offering\",\"Report 6.1 becomes the new Specifications 6.1\")}<\u002Fdiv>`;\n}\nfunction renderCQI(){\n  const el=document.getElementById(\"tab-cqi\"); const c=activeCourse(); if(!c) return noCourse(el);\n  const att=computeAttainment(c); const low=att.clos.filter(r=>r.nWith&&!r.attained), lowI=att.clos.filter(r=>r.ind!==null&&r.ind<c.cfg.kpiTarget), lowP=att.plos.filter(p=>p.mapped&&!p.attained);\n  const ta=(k,l,ph)=>`<label class=\"fld\">${l}<textarea placeholder=\"${ph||\"\"}\" onchange=\"cSet('evalT.${k}',this.value)\">${esc(c.evalT[k])}<\u002Ftextarea><\u002Flabel>`;\n  el.innerHTML=`\n  ${guide(`<b>BAC Criteria 10.2 · 10.3<\u002Fb> — the course teacher's evaluation and the students' feedback are collected formally and used to improve the next offering. The loop runs through two linked tables: <b>Course Specifications 6.1<\u002Fb> (what the previous Course Report recommended, and what this offering does about it) and <b>Course Report 6.1<\u002Fb> (what the next offering should do). Both are editable here and in the documents themselves; <i>Duplicate for next offering<\u002Fi> carries Report 6.1 into the new Specifications 6.1.`,\"cqi\")}\n  ${cqiLoopStrip()}\n  <div class=\"card\"><h2>1 · Recommendations from the Previous Course Report <span class=\"crit\">Specifications 6.1<\u002Fspan> <span class=\"badge grey\">⛓ linked<\u002Fspan><\u002Fh2>\n    <p class=\"hint\">Filled automatically when the course is duplicated from the previous offering; edit freely. The right column records the actions actually reflected in this offering's plan.<\u002Fp>\n    <table class=\"tbl\"><thead><tr><th style=\"width:150px\">Loop<\u002Fth><th style=\"width:170px\">Assessment type<\u002Fth><th>Recommended actions for quality improvement<\u002Fth><th>Actions reflected in the current Course Specifications<\u002Fth><\u002Ftr><\u002Fthead><tbody>\n    ${CQI_LOOPS.map((L,i)=>`<tr><td>${L[0]}<\u002Ftd><td>${L[1]}<\u002Ftd><td>${dta('spec.cqiPrev.'+i+'.rec',c.spec.cqiPrev[i].rec,4)}<\u002Ftd><td>${dta('spec.cqiPrev.'+i+'.ref',c.spec.cqiPrev[i].ref,4)}<\u002Ftd><\u002Ftr>`).join(\"\")}<\u002Ftbody><\u002Ftable>\n    <label class=\"fld\" style=\"margin-top:10px\">6.2 Any other modification<textarea onchange=\"cSet('spec.other',this.value)\">${esc(c.spec.other)}<\u002Ftextarea><\u002Flabel>\n    <div class=\"btn-row\"><button class=\"btn secondary\" onclick=\"pullCQI()\" title=\"Copy this course's own Course Report 6.1 cells into the empty recommendation cells above — for when you write the report before duplicating\">↑ Pull from this course's Course Report 6.1<\u002Fbutton><button class=\"btn secondary\" onclick=\"showTab('tla')\">Where these are acted on: T&amp;L<\u002Fbutton><button class=\"btn secondary\" onclick=\"showTab('assess')\">… and Assessments<\u002Fbutton><\u002Fdiv>\n    ${(()=>{const r=specRecList(c);const u=r.filter(x=>!x.ref).length;return r.length? `<p class=\"hint\" style=\"margin-top:10px\">${u? `<span class=\"badge red\">${u} of ${r.length} recommendation(s) have no recorded response<\u002Fspan> — open the <b>CQI Inputs<\u002Fb> card at the top of T&amp;L or Assessments and say what this offering does about them.`:`<span class=\"badge green\">All ${r.length} recommendation(s) have a recorded response<\u002Fspan> — Criterion 10.3 is evidenced.`}<\u002Fp>`:\"\";})()}\n  <\u002Fdiv>\n  <div class=\"card\"><h2>2 · What the evidence says<\u002Fh2>\n    ${att.clos.length? `<div class=\"grid c4\">\n      <div><div style=\"font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em\">CLOs attained (direct)<\u002Fdiv><div style=\"font-size:26px;font-weight:800\">${att.clos.filter(r=>r.attained).length}/${att.clos.length}<\u002Fdiv><\u002Fdiv>\n      <div><div style=\"font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em\">CLOs below target — direct<\u002Fdiv><div>${low.length? low.map(r=>`<span class=\"badge red\" style=\"margin:2px\">${r.label} · ${r.pctStu}%<\u002Fspan>`).join(\"\"):'<span class=\"badge green\">none<\u002Fspan>'}<\u002Fdiv><\u002Fdiv>\n      <div><div style=\"font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em\">CLOs below target — survey<\u002Fdiv><div>${lowI.length? lowI.map(r=>`<span class=\"badge amber\" style=\"margin:2px\">${r.label} · ${r.ind}%<\u002Fspan>`).join(\"\"):(att.clos.some(r=>r.ind!==null)?'<span class=\"badge green\">none<\u002Fspan>':'<span class=\"badge grey\">no survey<\u002Fspan>')}<\u002Fdiv><\u002Fdiv>\n      <div><div style=\"font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em\">PLOs below target<\u002Fdiv><div>${lowP.length? lowP.map(p=>`<span class=\"badge red\" style=\"margin:2px\">${esc(p.code)} · ${p.pctStu}%<\u002Fspan>`).join(\"\"):'<span class=\"badge green\">none<\u002Fspan>'}<\u002Fdiv><\u002Fdiv><\u002Fdiv>`:`<div class=\"empty\">No CLOs yet.<\u002Fdiv>`}\n  <\u002Fdiv>\n  <div class=\"card\"><h2>3 · Course Evaluation by the Teacher <span class=\"crit\">Criterion 10.2 · Report §3<\u002Fspan><\u002Fh2>\n    <div class=\"grid c2\">${ta(\"wentWell\",\"What went well\",\"Activities, materials or assessments that worked\")}${ta(\"difficulties\",\"Difficulties faced\",\"Content, pace, attendance, facilities, student preparedness…\")}<\u002Fdiv>\n    <h3>Comments printed in the Course Report<\u002Fh3>\n    <div class=\"grid c2\">\n      <label class=\"fld\">4.2 Comments on CLO attainment<textarea onchange=\"cSet('report.coComment',this.value)\">${esc(c.report.coComment)}<\u002Ftextarea><\u002Flabel>\n      <label class=\"fld\">4.3 Comments on PLO contribution<textarea onchange=\"cSet('report.ploComment',this.value)\">${esc(c.report.ploComment)}<\u002Ftextarea><\u002Flabel>\n      <label class=\"fld\">5.1 Comments on student feedback<textarea onchange=\"cSet('report.feedback',this.value)\">${esc(c.report.feedback)}<\u002Ftextarea><\u002Flabel>\n      <label class=\"fld\">5.2 Other surveys / meeting minutes / reports related to the course<textarea onchange=\"cSet('report.surveys',this.value)\">${esc(c.report.surveys)}<\u002Ftextarea><\u002Flabel>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"card\"><h2>4 · Suggested Action Plans for the Next Offering <span class=\"crit\">Course Report 6.1<\u002Fspan> <span class=\"badge grey\">⛓ linked<\u002Fspan><\u002Fh2>\n    <p class=\"hint\">One cell per loop. Name every CLO/PLO below target and say what changes — teaching, assessment design or student preparation. These cells travel to the next offering's Specifications 6.1.<\u002Fp>\n    <table class=\"tbl\"><thead><tr><th style=\"width:150px\">Loop<\u002Fth><th style=\"width:190px\">Assessment type<\u002Fth><th>Recommended actions for quality improvement<\u002Fth><\u002Ftr><\u002Fthead><tbody>\n    ${CQI_LOOPS.map((L,i)=>`<tr><td>${L[0]}<\u002Ftd><td>${L[1]}<\u002Ftd><td>${dta('report.cqi.'+i,c.report.cqi[i],5)}<\u002Ftd><\u002Ftr>`).join(\"\")}<\u002Ftbody><\u002Ftable>\n    <div class=\"btn-row\">${low.length||lowI.length||lowP.length? `<button class=\"btn secondary\" onclick=\"draftCQI()\">Draft from the evidence<\u002Fbutton>`:\"\"}<button class=\"btn secondary\" onclick=\"duplicateForNewSemester()\">⟳ Duplicate for next offering<\u002Fbutton><\u002Fdiv>\n  <\u002Fdiv>`;\n}\nfunction pullCQI(){\n  const c=activeCourse(); if(!c) return; let n=0;\n  c.report.cqi.forEach((txt,i)=>{ if(String(txt||\"\").trim()&&!String(c.spec.cqiPrev[i].rec||\"\").trim()){ c.spec.cqiPrev[i].rec=txt; n++; } });\n  save(); renderCQI(); toast(n? n+\" recommendation(s) pulled from Course Report 6.1\":\"Nothing to pull — cells already filled, or Report 6.1 is empty\");\n}\nfunction draftCQI(){\n  const c=activeCourse(); const att=computeAttainment(c); const r=c.report.cqi;\n  const add=(i,t)=>{ if(t&&!(r[i]||\"\").includes(t)) r[i]=((r[i]||\"\").trim()? r[i].trim()+\"\\n\":\"\")+t; };\n  att.clos.filter(x=>x.nWith&&!x.attained).forEach(x=>add(0,`${x.label}: attained by ${x.pctStu}% of students (target ${c.cfg.kpiTarget}%) — action: `));\n  att.clos.filter(x=>x.ind!==null&&x.ind<c.cfg.kpiTarget).forEach(x=>add(1,`${x.label}: ${x.ind}% of students rated themselves ≥ ${c.cfg.likertPass} — action: `));\n  att.plos.filter(p=>p.mapped&&!p.attained).forEach(p=>add(2,`${p.code}: contribution ${p.pctStu}% (via ${c.clos.map((co,i)=>co.plo[p.code]>0?\"CLO\"+(i+1):null).filter(Boolean).join(\", \")}) — action: `));\n  save(); renderCQI(); toast(\"Draft rows added — complete each action\");\n}\n\n/* ============ Course File (documents) ============ */\nconst DOC_KEY=[[\"outline\",\"Course Outline\"],[\"spec\",\"Course Specifications\"],[\"vet\",\"Final Exam Vetting Form\"],[\"calc\",\"Direct CLO–PLO Calculations\"],[\"survey\",\"Course Evaluation Survey\"],[\"report\",\"Course Report\"]];\nconst DOC_REC=[[\"align\",\"CLO–TLA–Assessment Alignment\"],[\"attend\",\"Attendance & Make-up Record\"],[\"fbk\",\"Feedback Record\"],[\"stmt\",\"Teacher's Statement\"],[\"index\",\"Course File Checklist\"]];\nfunction docHead(c,title,sub){ const i=inst(); return `<div class=\"doc-head\">${i.logo? `<img class=\"logo-img\" src=\"${i.logo}\" alt=\"\">`:\"\"}<div class=\"uni\"><b>${esc(i.name)}<\u002Fb>${esc([i.faculty,i.dept].filter(Boolean).join(\" · \"))}${i.addr? \"<br>\"+esc(i.addr):\"\"}<\u002Fdiv><\u002Fdiv><h1>${title}<\u002Fh1><div class=\"rpt-head\">${sub||\"\"}<\u002Fdiv>`; }\nfunction sig(names){ return `<table class=\"sig-table\"><tr>${names.map(n=>`<td><div class=\"sig-line\">${n}<\u002Fdiv><\u002Ftd>`).join(\"\")}<\u002Ftr><\u002Ftable>`; }\nfunction di(path,val,ph,style){ return `<input class=\"di\" style=\"${style||\"\"}\" value=\"${esc(val)}\" placeholder=\"${ph||\"\"}\" onchange=\"cSet('${path}',this.value)\">`; }\nfunction ploCodesOf(co){ return plos().filter(p=>co.plo[p.code]>0).map(p=>p.code).join(\", \"); }\nfunction cloBloom(co){ const k=BLOOMS.indexOf(co.bloom); return k>=0? \"C\"+(k+1)+\" \"+co.bloom : co.bloom; }\nfunction courseInfoTable(c,path,val){ return `<table class=\"tbl\"><tbody><tr><th style=\"width:240px\">1.1 Course Title<\u002Fth><td>${esc(c.title)}<\u002Ftd><\u002Ftr><tr><th>1.2 Course Code &amp; Section<\u002Fth><td>${esc(c.code)}${c.section? \" (\"+esc(c.section)+\")\":\"\"}<\u002Ftd><\u002Ftr><tr><th>1.3 Name of the Course Teacher<\u002Fth><td>${esc(c.instructor)}<\u002Ftd><\u002Ftr><tr><th>1.4 Programme<\u002Fth><td>${esc(c.program||inst().program)} (${esc(inst().degree)}, BNQF ${esc(inst().bnqf)})<\u002Ftd><\u002Ftr><tr><th>1.5 Semester Offered<\u002Fth><td>${esc(c.semester)}<\u002Ftd><\u002Ftr><tr><th>1.6 Date of Submission<\u002Fth><td>${di(path,val,\"DD/MM/YYYY\",\"width:160px\")}<\u002Ftd><\u002Ftr><\u002Ftbody><\u002Ftable>`; }\nfunction renderDocs(){\n  const el=document.getElementById(\"tab-docs\"); const c=activeCourse(); if(!c) return noCourse(el);\n  window._doc=window._doc||\"outline\"; const d=window._doc;\n  const fn={outline:docOutline,spec:docSpec,vet:docVet,calc:docCalc,survey:docSurvey,report:docReport,align:docAlign,attend:docAttend,fbk:docFbk,stmt:docStmt,index:docIndex};\n  const grp=(cap,list,note)=>`<div class=\"no-print\" style=\"margin-bottom:8px\"><div style=\"font-size:11.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px\">${cap} <span style=\"font-weight:400;color:var(--muted);text-transform:none;letter-spacing:0\">${note}<\u002Fspan><\u002Fdiv><div class=\"doc-nav\">${list.map(([k,l])=>`<button class=\"${k===d?\"on\":\"\"}\" onclick=\"window._doc='${k}';renderDocs()\">${l}<\u002Fbutton>`).join(\"\")}<\u002Fdiv><\u002Fdiv>`;\n  el.innerHTML=guide(`Fields with a dotted underline are filled in here and save automatically; everything else comes from the other Sections. <b>Print<\u002Fb> opens the browser's dialog — choose “Save as PDF” to file it electronically. The six key documents follow the OBE course-file cycle (Course Specifications before the semester, Course Report after it); the Course Outline follows the UGC Bangladesh OBE template and the Course File Checklist follows UGC's Template for Course File, extended with the evidence BAC Standards 5 and 10 ask for.`,\"docs\")+\n    grp(\"Key Documents for OBE Implementation\",DOC_KEY,\"prepared every semester as the course runs\")+grp(\"Course-file records\",DOC_REC,\"additional evidence for BAC Criteria 5.2 · 5.3 · 5.5 · 5.8\")+\n    `<div class=\"no-print btn-row\" style=\"margin:0 0 14px\"><button class=\"btn\" onclick=\"window.print()\">Print / Save as PDF<\u002Fbutton><button class=\"btn secondary\" onclick=\"exportDocWord()\">Export for Word (.doc)<\u002Fbutton><\u002Fdiv><div class=\"report-sheet\">${(fn[d]||docOutline)(c)}<\u002Fdiv>`;\n}\nfunction exportDocWord(){\n  const c=activeCourse(); const host=document.querySelector(\".report-sheet\"); if(!host) return;\n  const tmp=document.createElement(\"div\"); tmp.innerHTML=host.innerHTML;\n  tmp.querySelectorAll(\"textarea\").forEach(t=>{ const s=document.createElement(\"div\"); s.textContent=t.value||t.textContent||\"\"; s.setAttribute(\"style\",\"white-space:pre-wrap\"); t.replaceWith(s); });\n  tmp.querySelectorAll(\"input[type=checkbox]\").forEach(i=>{ const s=document.createElement(\"span\"); s.textContent=i.checked?\"☑\":\"☐\"; i.replaceWith(s); });\n  tmp.querySelectorAll(\"input\").forEach(i=>{ const s=document.createElement(\"span\"); s.textContent=i.value||\"\"; i.replaceWith(s); });\n  tmp.querySelectorAll(\".no-print\").forEach(n=>n.remove());\n  const css='@page{size:21cm 29.7cm;margin:1.5cm} body{font-family:Arial,sans-serif;font-size:11pt;color:#201e1d} table{border-collapse:collapse;width:100%} th,td{border:1px solid #999;padding:4px 6px;font-size:9.5pt;vertical-align:top;text-align:left} th{background:#eae7e7} h1{font-size:15pt;margin:6px 0} h2{font-size:12pt;margin:12px 0 4px;border-bottom:2px solid #201e1d}';\n  const html='<html xmlns:o=\"urn:schemas-microsoft-com:office:office\" xmlns:w=\"urn:schemas-microsoft-com:office:word\"><head><meta charset=\"utf-8\"><style>'+css+'<\u002Fstyle><\u002Fhead><body>'+tmp.innerHTML+'<\u002Fbody><\u002Fhtml>';\n  download((c.code||\"course\").replace(/\\s+/g,\"_\")+\"_\"+(window._doc||\"doc\")+\".doc\",\"\\ufeff\"+html,\"application/msword\"); toast(\"Saved — open in Word or LibreOffice\");\n}\n/* ---- 1. Course Outline — UGC Bangladesh prescribed format (Outcome-Based Curriculum), Parts A–D ---- */\nfunction docOutline(c){\n  const o=c.outline, i=inst(), items=allItems(c);\n  if(!Array.isArray(o.methods)) prefillMethods(c,false);\n  const mt=o.methods.reduce((s,m)=>s+(parseFloat(m.pct)||0),0);\n  const contact=c.clos.reduce((t,co)=>t+(parseFloat(co.slt.lec)||0)+(parseFloat(co.slt.tut)||0)+(parseFloat(co.slt.prac)||0),0)||c.weeks.reduce((t,w)=>t+(parseFloat(w.hrs)||0),0);\n  const marks=items.reduce((s,it)=>s+(parseFloat(it.max)||0),0);\n  const P=plos();\n  const row=(n,l,v)=>`<tr><th style=\"width:56px\">${n}<\u002Fth><th style=\"width:250px\">${l}<\u002Fth><td>${v}<\u002Ftd><\u002Ftr>`;\n  const finals=c.assessments.filter(a=>FINAL_TYPES.includes(a.type)), conts=c.assessments.filter(a=>!FINAL_TYPES.includes(a.type));\n  const sumPct=arr=>arr.reduce((s,a)=>s+(parseFloat(a.weightPct)||0),0);\n  return docHead(c,\"Course Outline\",\"Outcome-Based Curriculum · format prescribed by the University Grants Commission of Bangladesh (revised OBE template, Part A–D)\")+`\n  <h2>Part A<\u002Fh2>\n  <table class=\"tbl\"><tbody>\n    ${row(1,\"Course No. / Course Code\",esc(c.code)+(c.section? \" (Section \"+esc(c.section)+\")\":\"\"))}\n    ${row(2,\"Course Title\",esc(c.title))}\n    ${row(3,\"Course Type\",esc(c.type)+' <span style=\"font-size:11px;color:var(--muted)\">(General Education / Core / Elective / Capstone …)<\u002Fspan>')}\n    ${row(4,\"Year / Level / Semester / Term\",di('outline.level',o.level,'e.g., 2nd Year, 1st Semester (BNQF '+esc(i.bnqf)+')'))}\n    ${row(5,\"Academic Session\",esc(c.semester))}\n    ${row(6,\"Course Teacher / Instructor\",esc(c.instructor)+(c.room||c.email||c.consult? '<div style=\"font-size:11.5px;color:var(--muted)\">'+esc([c.room,c.email,c.phone,c.consult].filter(Boolean).join(\" · \"))+'<\u002Fdiv>':\"\"))}\n    ${row(7,\"Pre-requisite (if any)\",esc(c.prereq)||\"None\")}\n    ${row(8,\"Credit Value\",esc(c.credit))}\n    ${row(9,\"Contact Hours\",`<input class=\"di\" style=\"width:70px;text-align:center\" value=\"${esc(o.contactHrs)}\" placeholder=\"${contact||\"\"}\" onchange=\"cSet('outline.contactHrs',this.value,true)\"> hrs <span style=\"font-size:11px;color:var(--muted)\">(computed from the T&amp;L Plan: ${contact||\"—\"} — lecture + tutorial + practical; type a value to override)<\u002Fspan>`)}\n    ${row(10,\"Total Marks\",`<input class=\"di\" style=\"width:70px;text-align:center\" value=\"${esc(o.totalMarks)}\" placeholder=\"${marks||\"\"}\" onchange=\"cSet('outline.totalMarks',this.value,true)\"> <span style=\"font-size:11px;color:var(--muted)\">(sum of the assessment items: ${marks||\"—\"})<\u002Fspan>`)}\n    ${row(11,\"Rationale of the Course\",'<span style=\"white-space:pre-wrap\">'+(esc(c.synopsis)||'<i>set in Course Info → Course Synopsis / Rationale<\u002Fi>')+'<\u002Fspan>')}\n    ${row(12,\"Course Objectives\",'<span style=\"white-space:pre-wrap\">'+(esc(c.objectives)||'<i>set in Course Info<\u002Fi>')+'<\u002Fspan>')}\n  <\u002Ftbody><\u002Ftable>\n  <h2>13. Course Learning Outcomes (CLOs) and Mapping of CLOs with Programme Learning Outcomes (PLOs)<\u002Fh2>\n  <p style=\"font-size:12.5px\">On successful completion of the course, the students will be able to:<\u002Fp>\n  <div class=\"tbl-wrap\"><table class=\"tbl\"><thead><tr><th style=\"min-width:300px\">Course Learning Outcomes (CLO)<\u002Fth>${P.map(p=>`<th style=\"text-align:center;width:56px\" title=\"${esc(p.text)}\">${esc(p.code)}<\u002Fth>`).join(\"\")}<th style=\"width:100px\">BNQF domain<\u002Fth><th style=\"width:110px\">Bloom's level<\u002Fth><\u002Ftr><\u002Fthead><tbody>\n    ${c.clos.map((co,k)=>`<tr><td><b>CLO${k+1}<\u002Fb> ${esc(co.text)}<\u002Ftd>${P.map(p=>`<td style=\"text-align:center\">${co.plo[p.code]||\"\"}<\u002Ftd>`).join(\"\")}<td>${esc(co.domain)}<\u002Ftd><td>${cloBloom(co)}<\u002Ftd><\u002Ftr>`).join(\"\")||'<tr><td colspan=\"'+(P.length+3)+'\">Define CLOs in the CLOs &amp; Mapping Section<\u002Ftd><\u002Ftr>'}\n  <\u002Ftbody><\u002Ftable><\u002Fdiv>\n  <p style=\"font-size:11.5px;color:var(--muted)\">Mapping strength 1–3 (1 low · 2 medium · 3 high). The UGC template suggests 3–5 CLOs per course; this course has <b>${c.clos.length}<\u002Fb>.${c.clos.length&&(c.clos.length<3||c.clos.length>5)? ' <span class=\"badge amber no-print\">outside the suggested 3–5<\u002Fspan>':\"\"}<\u002Fp>\n  <p style=\"font-size:11.5px;color:var(--muted)\">PLOs: ${P.map(p=>`<b>${esc(p.code)}<\u002Fb> ${esc(p.text)}`).join(\"; \")}<\u002Fp>\n\n  <h2>Part B<\u002Fh2>\n  <h2>14. Course Plan — content, CLOs, co-curricular activities and assessment strategy mapped with CLOs<\u002Fh2>\n  <div class=\"tbl-wrap\"><table class=\"tbl\"><thead><tr><th style=\"width:50px\">Week<\u002Fth><th>Topic<\u002Fth><th style=\"width:170px\">Teaching-Learning Strategy<\u002Fth><th style=\"width:150px\">Assessment Strategy<\u002Fth><th style=\"width:140px\">Co-curricular activity (if any)<\u002Fth><th style=\"width:100px\">Corresponding CLOs<\u002Fth><\u002Ftr><\u002Fthead><tbody>\n    ${c.weeks.map((w,k)=>`<tr><td style=\"text-align:center\">${k+1}<\u002Ftd><td>${esc(w.topic)}<\u002Ftd><td>${esc(w.tla)}<\u002Ftd><td>${di('weeks.'+k+'.m',w.m,'e.g., Quiz 1')}<\u002Ftd><td>${di('weeks.'+k+'.co',w.co,'')}<\u002Ftd><td>${w.clos.map(id=>cloLabel(c,id)).join(\", \")}<\u002Ftd><\u002Ftr>`).join(\"\")}\n    <tr><td><\u002Ftd><th colspan=\"4\" style=\"text-align:right\">Total contact hours planned<\u002Fth><th style=\"text-align:center\">${c.weeks.reduce((t,w)=>t+(parseFloat(w.hrs)||0),0)||\"—\"}<\u002Fth><\u002Ftr>\n  <\u002Ftbody><\u002Ftable><\u002Fdiv>\n  <p style=\"font-size:11.5px;color:var(--muted)\">Topics, strategy, hours and CLO tags are maintained in the T&amp;L Section; the assessment and co-curricular columns are typed here.<\u002Fp>\n  ${o.coCurricular? '<p style=\"font-size:12.5px\"><b>Co-curricular activities:<\u002Fb> '+esc(o.coCurricular)+'<\u002Fp>':''}\n  <p class=\"no-print\" style=\"font-size:12px\"><b>Co-curricular note (optional, printed above):<\u002Fb> ${di('outline.coCurricular',o.coCurricular,'e.g., departmental seminar, field visit, club activity')}<\u002Fp>\n\n  <h2>Part C<\u002Fh2>\n  <h2>15. Assessment and Evaluation<\u002Fh2>\n  <p><b>15.1 Assessment Strategy<\u002Fb><\u002Fp>\n  ${dta('outline.assessStrategy',o.assessStrategy,3,\"How learning is assessed across the semester — continuous assessment of CLOs through quizzes, assignments and presentations, and summative assessment in the semester final examination; criteria and rubrics announced in advance\")}\n  ${c.rubricNote? '<p style=\"font-size:12.5px\"><b>Assessment criteria / rubrics:<\u002Fb> '+esc(c.rubricNote)+'<\u002Fp>':''}\n  <p><b>15.2 Marks Distribution<\u002Fb><\u002Fp>\n  <table class=\"tbl\" style=\"max-width:560px\"><thead><tr><th>Component<\u002Fth><th style=\"width:130px\">Percentage<\u002Fth><th class=\"no-print\" style=\"width:40px\"><\u002Fth><\u002Ftr><\u002Fthead><tbody>\n    ${o.methods.map((m,k)=>`<tr><td>${di('outline.methods.'+k+'.name',m.name,'e.g., Attendance')}<\u002Ftd><td><input class=\"di\" style=\"width:80px;text-align:center\" value=\"${esc(m.pct)}\" onchange=\"cSet('outline.methods.${k}.pct',this.value,true)\"> %<\u002Ftd><td class=\"no-print\"><button class=\"icon-btn\" onclick=\"delMethod(${k})\">✕<\u002Fbutton><\u002Ftd><\u002Ftr>`).join(\"\")}\n    <tr><th style=\"text-align:right\">Total<\u002Fth><th style=\"text-align:center${Math.abs(mt-100)>0.05?';color:var(--bad)':''}\">${mt.toFixed(1)} %<\u002Fth><td class=\"no-print\"><\u002Ftd><\u002Ftr><\u002Ftbody><\u002Ftable>\n  <div class=\"no-print btn-row\"><button class=\"btn secondary small\" onclick=\"addMethod()\">+ Component<\u002Fbutton><button class=\"btn secondary small\" onclick=\"prefillMethods(activeCourse(),true)\">Prefill from Assessments<\u002Fbutton><\u002Fdiv>\n  <table class=\"tbl\" style=\"max-width:620px;margin-top:10px\"><tbody>\n    <tr><th style=\"width:230px\">a) Continuous assessment<\u002Fth><td>${conts.length? esc(conts.map(a=>(a.name||a.type)+(a.weightPct!==\"\"? \" (\"+a.weightPct+\"%)\":\"\")).join(\", \")):\"—\"} ${conts.length? '<b>— '+sumPct(conts)+'%<\u002Fb>':''}<\u002Ftd><\u002Ftr>\n    <tr><th>b) Summative assessment<\u002Fth><td>${finals.length? esc(finals.map(a=>(a.name||a.type)+(a.weightPct!==\"\"? \" (\"+a.weightPct+\"%)\":\"\")).join(\", \")):\"—\"} ${finals.length? '<b>— '+sumPct(finals)+'%<\u002Fb>':''}<\u002Ftd><\u002Ftr><\u002Ftbody><\u002Ftable>\n  <p style=\"font-size:12.5px;margin-top:8px\"><b>Grading scale<\u002Fb><\u002Fp>${gradeTableHTML()}\n  <p><b>15.3 Make-up Procedures<\u002Fb><\u002Fp>\n  ${dta('outline.makeup',o.makeup,3,\"Eligibility and procedure for make-up quizzes, examinations and classes; application deadline and approving authority\")}\n\n  <h2>Part D<\u002Fh2>\n  <h2>16. Learning Materials<\u002Fh2>\n  <p><b>16.1 Recommended Readings<\u002Fb><br><span style=\"white-space:pre-wrap\">${esc(c.textbooks)||\"—\"}<\u002Fspan><\u002Fp>\n  <p><b>16.2 Supplementary Readings<\u002Fb><br><span style=\"white-space:pre-wrap\">${esc(c.refs)||\"—\"}<\u002Fspan>${o.supp? \"<br>\"+esc(o.supp).replace(/\\n/g,\"<br>\"):\"\"}<\u002Fp>\n  <p class=\"no-print\" style=\"font-size:12px\"><b>Additional supplementary readings (printed above):<\u002Fb> ${dta('outline.supp',o.supp,2)}<\u002Fp>\n  <p><b>16.3 Others<\u002Fb> <span style=\"font-size:11.5px;color:var(--muted)\">(as applicable for the discipline / academic programme)<\u002Fspan><\u002Fp>\n  ${dta('outline.other',o.other,3,\"LMS course site, software, laboratory manuals, datasets, journals, open courseware, facilities required — see also the facilities recorded in Course Info\")}\n  ${c.facilities? '<p style=\"font-size:12.5px\"><b>Facilities and resources required:<\u002Fb> <span style=\"white-space:pre-wrap\">'+esc(c.facilities)+'<\u002Fspan><\u002Fp>':''}\n  <table class=\"tbl\" style=\"margin-top:18px\"><tr><td style=\"width:33%\">Prepared by:<br><br>Signature: ______________<br>Name: ${di('outline.prepared',o.prepared||c.instructor)}<br>Date: ${di('outline.preparedDate',o.preparedDate,'','width:120px')}<\u002Ftd><td style=\"width:33%\">Checked by (${esc(role(\"coord\"))}):<br><br>Signature: ______________<br>Name: ${di('outline.checked',o.checked)}<br>Date: ${di('outline.checkedDate',o.checkedDate,'','width:120px')}<\u002Ftd><td>Approved by (${esc(role(\"hod\"))}):<br><br>Signature: ______________<br>Name: ${di('outline.approved',o.approved)}<br>Date: ${di('outline.approvedDate',o.approvedDate,'','width:120px')}<\u002Ftd><\u002Ftr><\u002Ftable>`;\n}\nfunction prefillMethods(c,rerender){ const tot=c.assessments.reduce((s,a)=>s+(parseFloat(a.weightPct)||0),0); c.outline.methods=c.assessments.map(a=>({name:a.name||a.type,pct:a.weightPct!==\"\"? String(a.weightPct):(tot?\"\":\"\")})); save(); if(rerender) renderDocs(); }\nfunction addMethod(){ activeCourse().outline.methods.push({name:\"\",pct:\"\"}); save(); renderDocs(); }\nfunction delMethod(k){ activeCourse().outline.methods.splice(k,1); save(); renderDocs(); }\n/* ---- 2. Course Specifications ---- */\nfunction docSpec(c){\n  const sp=c.spec, items=allItems(c), totalMax=items.reduce((s,it)=>s+(parseFloat(it.max)||0),0);\n  const S=k=>c.clos.reduce((t,co)=>t+(parseFloat(co.slt[k])||0),0);\n  const fe=parseFloat(sp.finalExamHrs)||0;\n  const planned=c.weeks.reduce((t,w)=>t+(parseFloat(w.hrs)||0),0);\n  return docHead(c,\"Course Specifications\",\"(To be submitted to the \"+esc(role(\"coord\"))+\" before the semester begins)\")+`\n  <h2>1. General Information<\u002Fh2>${courseInfoTable(c,'spec.submitDate',sp.submitDate)}\n  <h2>2. Student Learning Time (SLT)<\u002Fh2>\n  <table class=\"tbl\"><tbody><tr><th colspan=\"2\">A. Face-to-face instruction<\u002Fth><\u002Ftr><tr><td>A.1 Lecture / contact hours<\u002Ftd><td style=\"width:140px\">${S(\"lec\")} hrs<\u002Ftd><\u002Ftr><tr><td>A.2 Tutorial<\u002Ftd><td>${S(\"tut\")} hrs<\u002Ftd><\u002Ftr><tr><td>A.3 Laboratory / practical<\u002Ftd><td>${S(\"prac\")} hrs<\u002Ftd><\u002Ftr>\n    <tr><th colspan=\"2\">B. Independent learning<\u002Fth><\u002Ftr><tr><td>B.1 Reading, revision and self-study<\u002Ftd><td>${S(\"self\")} hrs<\u002Ftd><\u002Ftr><tr><td>B.2 Preparation for assessments<\u002Ftd><td>${S(\"asm\")} hrs<\u002Ftd><\u002Ftr>\n    <tr><th colspan=\"2\">C. Assessment outside instruction hours<\u002Fth><\u002Ftr><tr><td>Final examination<\u002Ftd><td>${di('spec.finalExamHrs',sp.finalExamHrs,'3','width:60px;text-align:center')} hrs<\u002Ftd><\u002Ftr>\n    <tr><th>Total SLT<\u002Fth><th>${courseSLT(c)+fe} hrs${c.credit? ` <span style=\"font-weight:400;color:var(--muted)\">(guide ≈ ${(parseFloat(c.credit)||0)*40} for ${esc(c.credit)} credits)<\u002Fspan>`:\"\"}<\u002Fth><\u002Ftr><\u002Ftbody><\u002Ftable>\n  <p style=\"font-size:11.5px;color:var(--muted)\">Hours per CLO are set in the T&amp;L Section (BAC Criterion 5.2).<\u002Fp>\n  <h2>3. Constructive Alignment<\u002Fh2><h2>3.1 Statement of CLOs<\u002Fh2>\n  <table class=\"tbl\"><thead><tr><th style=\"width:50px\">CLO<\u002Fth><th>Statement<\u002Fth><th style=\"width:90px\">PLO(s)<\u002Fth><th style=\"width:90px\">Domain<\u002Fth><th style=\"width:100px\">Bloom's<\u002Fth><th>Delivery methods and activities<\u002Fth><th>Assessment methods<\u002Fth><\u002Ftr><\u002Fthead><tbody>${c.clos.map((co,k)=>`<tr><td><b>CLO${k+1}<\u002Fb><\u002Ftd><td>${esc(co.text)}<\u002Ftd><td>${ploCodesOf(co)||\"—\"}<\u002Ftd><td>${esc(co.domain)}<\u002Ftd><td>${cloBloom(co)}<\u002Ftd><td>${esc(co.tla.concat(co.tlaOther?[co.tlaOther]:[]).join(\", \"))||\"—\"}<\u002Ftd><td>${[...new Set(c.assessments.filter(a=>a.items.some(it=>it.cloId===co.id)).map(a=>a.name||a.type))].join(\", \")||\"—\"}<\u002Ftd><\u002Ftr>`).join(\"\")||'<tr><td colspan=\"7\">Define CLOs first<\u002Ftd><\u002Ftr>'}<\u002Ftbody><\u002Ftable>\n  <p style=\"font-size:11.5px;color:var(--muted)\">Outcomes → teaching-learning activities → assessments (BAC Criterion 5.8). Delivery methods come from the T&amp;L Section; assessment methods from the Assessment Plan.<\u002Fp>\n  <h2>4. Teaching &amp; Learning Activities<\u002Fh2><h2>4.1 Planned Contact Hours for Different Topics<\u002Fh2>\n  <table class=\"tbl\"><thead><tr><th style=\"width:50px\">Sl.<\u002Fth><th>Topics<\u002Fth><th style=\"width:110px\">CLO(s)<\u002Fth><th style=\"width:180px\">Activity<\u002Fth><th style=\"width:120px\">Planned hours<\u002Fth><\u002Ftr><\u002Fthead><tbody>${c.weeks.filter(w=>w.topic).map((w,k)=>`<tr><td>${k+1}<\u002Ftd><td>${esc(w.topic)}<\u002Ftd><td>${w.clos.map(id=>cloLabel(c,id)).join(\", \")}<\u002Ftd><td>${esc(w.tla)}<\u002Ftd><td style=\"text-align:center\">${esc(w.hrs)}<\u002Ftd><\u002Ftr>`).join(\"\")||'<tr><td colspan=\"5\">Fill the weekly plan in the T&amp;L Section<\u002Ftd><\u002Ftr>'}<tr><td><\u002Ftd><th colspan=\"3\" style=\"text-align:right\">Total<\u002Fth><th style=\"text-align:center\">${planned}<\u002Fth><\u002Ftr><\u002Ftbody><\u002Ftable>\n  <h2>5. Assessments<\u002Fh2><h2>5.1 Assessment Blueprint<\u002Fh2>\n  <table class=\"tbl\"><thead><tr><th style=\"width:50px\">CLO<\u002Fth><th>Assessment item<\u002Fth><th style=\"width:110px\">% of total marks<\u002Fth><th style=\"width:120px\">Bloom's level<\u002Fth><th style=\"width:110px\">Rubric shared<\u002Fth><\u002Ftr><\u002Fthead><tbody>${c.clos.flatMap((co,k)=>items.filter(it=>it.cloId===co.id).map(it=>`<tr><td><b>CLO${k+1}<\u002Fb><\u002Ftd><td>${esc(it.aName)} — ${esc(it.label)}<\u002Ftd><td style=\"text-align:center\">${totalMax? ((parseFloat(it.max)||0)/totalMax*100).toFixed(1):\"—\"}%<\u002Ftd><td>${esc(it.level)||cloBloom(co)}<\u002Ftd><td>${c.assessments.find(a=>a.id===it.aId).rubric?\"Yes\":\"—\"}<\u002Ftd><\u002Ftr>`)).join(\"\")||'<tr><td colspan=\"5\">Define assessment items first<\u002Ftd><\u002Ftr>'}<\u002Ftbody><\u002Ftable>\n  ${c.rubricNote? `<p style=\"font-size:12.5px\"><b>Assessment criteria / rubrics:<\u002Fb> ${esc(c.rubricNote)}<\u002Fp>`:\"\"}\n  <h2>6. Continuous Quality Improvement (CQI) Measures<\u002Fh2>\n  <p><b>6.1 Recommendations from the Previous Course Report (if any)<\u002Fb> <span class=\"badge grey no-print\">⛓ linked — also editable in the CQI Section<\u002Fspan><\u002Fp>\n  <table class=\"tbl\"><thead><tr><th style=\"width:130px\">Loop<\u002Fth><th style=\"width:160px\">Assessment type<\u002Fth><th>Recommended actions for quality improvement<\u002Fth><th>Actions reflected in the current Course Specifications<\u002Fth><\u002Ftr><\u002Fthead><tbody>${CQI_LOOPS.map((L,i)=>`<tr><td>${L[0]}<\u002Ftd><td>${L[1]}<\u002Ftd><td>${dta('spec.cqiPrev.'+i+'.rec',sp.cqiPrev[i].rec,6)}<\u002Ftd><td>${dta('spec.cqiPrev.'+i+'.ref',sp.cqiPrev[i].ref,6)}<\u002Ftd><\u002Ftr>`).join(\"\")}<\u002Ftbody><\u002Ftable>\n  <p><b>6.2 Any Other Modification (if any)<\u002Fb> ${dta('spec.other',sp.other,3)}<\u002Fp>\n  ${sig([`${esc(c.instructor||\"Course Teacher\")}<br>Course Teacher`,esc(role(\"coord\"))])}`;\n}\n/* ---- 3. Final Exam Vetting Form ---- */\nfunction docVet(c){\n  const finals=c.assessments.filter(a=>FINAL_TYPES.includes(a.type)); const m=c.moderation;\n  const title=\"Final Examination Vetting Form\";\n  if(!finals.length) return docHead(c,title,\"BAC Criterion 5.6\")+`<p class=\"hint\">No assessment of type <b>Final Exam<\u002Fb> is defined yet — add one in the Assessments Section and this form fills itself.<\u002Fp>`;\n  const body=finals.map(a=>{\n    const total=a.items.reduce((s,it)=>s+(parseFloat(it.max)||0),0);\n    const cov=c.clos.map((co,i)=>({i,m:a.items.filter(it=>it.cloId===co.id).reduce((s,it)=>s+(parseFloat(it.max)||0),0)}));\n    const lv={}; a.items.forEach(it=>{ const co=c.clos.find(x=>x.id===it.cloId); const t=it.level||(co?co.bloom:\"—\"); lv[t]=(lv[t]||0)+(parseFloat(it.max)||0); });\n    const hots=a.items.filter(it=>[\"Analyze\",\"Evaluate\",\"Create\"].includes(it.level||(c.clos.find(x=>x.id===it.cloId)||{}).bloom)).reduce((s,it)=>s+(parseFloat(it.max)||0),0);\n    return `<h2>${esc(a.name||a.type)} — Question Analysis <span style=\"font-weight:400;font-size:12px;text-transform:none;letter-spacing:0\">(auto-filled from the Assessment Plan)<\u002Fspan><\u002Fh2>\n    <table class=\"tbl\"><thead><tr><th style=\"width:90px\">Question<\u002Fth><th style=\"width:70px\">CLO<\u002Fth><th style=\"width:120px\">Bloom's level<\u002Fth><th style=\"width:70px\">Marks<\u002Fth><th>CLO statement<\u002Fth><\u002Ftr><\u002Fthead><tbody>${a.items.map(it=>{const co=c.clos.find(x=>x.id===it.cloId);return `<tr><td>${esc(it.label)}<\u002Ftd><td>${cloLabel(c,it.cloId)}<\u002Ftd><td>${esc(it.level)||(co?cloBloom(co):\"—\")}<\u002Ftd><td style=\"text-align:center\">${esc(it.max)}<\u002Ftd><td style=\"font-size:12px\">${co? esc(co.text):\"—\"}<\u002Ftd><\u002Ftr>`;}).join(\"\")||'<tr><td colspan=\"5\">No questions defined<\u002Ftd><\u002Ftr>'}<\u002Ftbody><\u002Ftable>\n    <p style=\"font-size:11.5px;color:var(--muted)\">Full marks: <b>${total}<\u002Fb> · Duration: __________ · Date: ${esc(a.date)||\"__________\"}<\u002Fp>\n    <h2>Coverage Summary<\u002Fh2><table class=\"tbl\"><tbody><tr><th style=\"width:220px\">CLOs covered<\u002Fth><td>${cov.filter(x=>x.m).map(x=>`CLO${x.i+1} (${x.m} marks)`).join(\", \")||\"—\"}<\u002Ftd><\u002Ftr><tr><th>CLOs not assessed in this examination<\u002Fth><td>${cov.filter(x=>!x.m).map(x=>\"CLO\"+(x.i+1)).join(\", \")||\"None\"}<\u002Ftd><\u002Ftr><tr><th>Bloom's level distribution (marks)<\u002Fth><td>${Object.keys(lv).map(k=>`${k}: ${lv[k]}`).join(\" · \")||\"—\"}<\u002Ftd><\u002Ftr><tr><th>Higher-order thinking share<\u002Fth><td>${total? pct(hots,total)+\"%\":\"—\"} of marks at Analyze / Evaluate / Create<\u002Ftd><\u002Ftr><\u002Ftbody><\u002Ftable>`;\n  }).join(\"\");\n  const chk=[\"The questions align with the stated CLOs and their Bloom's taxonomy levels\",\"The mark distribution matches the assessment plan and is appropriate\",\"A visible share of marks requires higher-order thinking (Criterion 5.1)\",\"The language is clear and free from ambiguity, including choice instructions\",\"The difficulty and time demand are balanced across the paper\",\"Required data, figures and formulae are included with appropriate clarity\",\"The paper is consistent with the approved course plan communicated to students (Criterion 5.4)\"];\n  return docHead(c,title,\"Moderation of the semester final examination by the examination/moderation committee with an external member — BAC Criterion 5.6\")+body+`\n  <h2>Vetting Checklist (to be completed by the committee)<\u002Fh2>\n  <table class=\"tbl\"><thead><tr><th>Item<\u002Fth><th style=\"width:50px;text-align:center\">Yes<\u002Fth><th style=\"width:50px;text-align:center\">No<\u002Fth><th style=\"width:200px\">Comments<\u002Fth><\u002Ftr><\u002Fthead><tbody>${chk.map((x,i)=>`<tr><td>${i+1}. ${x}<\u002Ftd><td style=\"text-align:center\">□<\u002Ftd><td style=\"text-align:center\">□<\u002Ftd><td><\u002Ftd><\u002Ftr>`).join(\"\")}<\u002Ftbody><\u002Ftable>\n  <h2>Committee<\u002Fh2>\n  <table class=\"tbl\"><tbody><tr><th style=\"width:220px\">Date of moderation meeting<\u002Fth><td>${di('moderation.date',m.date,'DD/MM/YYYY')}<\u002Ftd><\u002Ftr><tr><th>Internal members<\u002Fth><td>${di('moderation.members',m.members,'Names and designations')}<\u002Ftd><\u002Ftr><tr><th>External member<\u002Fth><td>${di('moderation.external',m.external,'Name, designation, institution')}<\u002Ftd><\u002Ftr><tr><th>Observations / changes required<\u002Fth><td>${dta('moderation.note',m.note,3)}<\u002Ftd><\u002Ftr><\u002Ftbody><\u002Ftable>\n  <p style=\"margin-top:10px\">Signature of the Course Teacher: __________________ &nbsp; Date: __________<br>Name: ${esc(c.instructor)}<\u002Fp>\n  <table class=\"tbl\" style=\"margin-top:8px\"><tr><td style=\"width:50%\">Signature of Internal Member 1: __________________<br>Date: __________<br>Name: ${di('vet.vetter1',c.vet.vetter1,'Name')}<\u002Ftd><td>Signature of Internal Member 2: __________________<br>Date: __________<br>Name: ${di('vet.vetter2',c.vet.vetter2,'Name')}<\u002Ftd><\u002Ftr>\n  <tr><td>Signature of the External Member: __________________<br>Date: __________<br>Name: ${esc(m.external)}<\u002Ftd><td>Signature of the ${esc(role(\"moderator\"))}: __________________<br>Date: __________<\u002Ftd><\u002Ftr><\u002Ftable>`;\n}\n/* ---- 4. Direct CLO–PLO Calculations ---- */\nfunction docCalc(c){\n  const att=computeAttainment(c); const P=att.plos.filter(p=>p.mapped);\n  const row=(l,arr,k,suf)=>`<tr><th>${l}<\u002Fth>${arr.map(x=>`<td style=\"text-align:center\">${x.nWith===0? \"—\" : (typeof x[k]===\"number\"? x[k]+(suf||\"\"):x[k])}<\u002Ftd>`).join(\"\")}<\u002Ftr>`;\n  return docHead(c,\"Direct Measurement of CLOs and PLOs\",\"Computed automatically from the marks entered — course evaluation report, BAC Criterion 4.8 (iv)\")+`\n  <table class=\"tbl\" style=\"max-width:560px\"><tbody><tr><th style=\"width:190px\">Course<\u002Fth><td>${esc(c.code)} — ${esc(c.title)}<\u002Ftd><\u002Ftr><tr><th>Programme<\u002Fth><td>${esc(c.program||inst().program)}<\u002Ftd><\u002Ftr><tr><th>Semester / Section<\u002Fth><td>${esc(c.semester)} ${c.section? \"/ \"+esc(c.section):\"\"}<\u002Ftd><\u002Ftr><tr><th>No. of students<\u002Fth><td>${c.students.length}<\u002Ftd><\u002Ftr><tr><th>CLO pass mark<\u002Fth><td>${c.cfg.passMarks}% of the marks allocated to the CLO<\u002Ftd><\u002Ftr><tr><th>Target<\u002Fth><td>${c.cfg.kpiTarget}% of students attaining<\u002Ftd><\u002Ftr><\u002Ftbody><\u002Ftable>\n  <h2>Course Learning Outcomes<\u002Fh2>\n  <div class=\"tbl-wrap\"><table class=\"tbl\"><thead><tr><th style=\"min-width:240px\"><\u002Fth>${att.clos.map(x=>`<th style=\"text-align:center\">${x.label}<\u002Fth>`).join(\"\")}<\u002Ftr><\u002Fthead><tbody>\n    <tr><th>Marks allocated<\u002Fth>${att.clos.map(x=>`<td style=\"text-align:center\">${x.max}<\u002Ftd>`).join(\"\")}<\u002Ftr>\n    <tr><th>Students assessed<\u002Fth>${att.clos.map(x=>`<td style=\"text-align:center\">${x.nWith}<\u002Ftd>`).join(\"\")}<\u002Ftr>\n    ${row(\"% of students at or above the pass mark \"+c.cfg.passMarks+\"%\",att.clos,\"pctStu\",\"%\")}${row(\"Average CLO score (%)\",att.clos,\"avgPct\",\"%\")}\n    <tr><th>Status (vs target ${c.cfg.kpiTarget}%)<\u002Fth>${att.clos.map(x=>`<td style=\"text-align:center\">${x.nWith? (x.attained?\"✓ Attained\":\"✗ Not attained\"):\"—\"}<\u002Ftd>`).join(\"\")}<\u002Ftr><\u002Ftbody><\u002Ftable><\u002Fdiv>\n  ${att.clos.length? barChart(att.clos,c.cfg.kpiTarget,\"pctStu\"):\"\"}\n  <h2>Contribution to Programme Learning Outcomes<\u002Fh2>\n  ${P.length? `<div class=\"tbl-wrap\"><table class=\"tbl\"><thead><tr><th style=\"min-width:240px\"><\u002Fth>${P.map(x=>`<th style=\"text-align:center\">${esc(x.code)}<\u002Fth>`).join(\"\")}<\u002Ftr><\u002Fthead><tbody>\n    <tr><th>Mapped CLOs<\u002Fth>${P.map(p=>`<td style=\"text-align:center;font-size:11.5px\">${c.clos.map((co,i)=>co.plo[p.code]>0?\"CLO\"+(i+1):null).filter(Boolean).join(\", \")}<\u002Ftd>`).join(\"\")}<\u002Ftr>\n    <tr><th>Contribution (%)<\u002Fth>${P.map(x=>`<td style=\"text-align:center\">${x.pctStu}%<\u002Ftd>`).join(\"\")}<\u002Ftr>\n    <tr><th>Status (vs target ${c.cfg.kpiTarget}%)<\u002Fth>${P.map(x=>`<td style=\"text-align:center\">${x.attained?\"✓ Attained\":\"✗ Below target\"}<\u002Ftd>`).join(\"\")}<\u002Ftr><\u002Ftbody><\u002Ftable><\u002Fdiv>`:'<p class=\"hint\">Map CLOs to PLOs first.<\u002Fp>'}\n  <p style=\"font-size:11.5px;color:var(--muted)\">Method: a student's CLO score is the percentage of marks obtained out of the marks assessed under that CLO; the CLO is attained when the share of students at or above the pass mark reaches the target. A PLO's contribution is the mapping-weighted average of its CLOs' attainment. Thresholds are set in Course Info.<\u002Fp>\n  ${sig([`${esc(c.instructor||\"Course Teacher\")}<br>Course Teacher · Date: __________`])}`;\n}\n/* ---- 5. Course Evaluation Survey ---- */\nfunction docSurvey(c){\n  const hd=[5,4,3,2,1].map(k=>`<th style=\"width:44px;text-align:center\">${k}<\u002Fth>`).join(\"\"), box=[5,4,3,2,1].map(()=>`<td style=\"text-align:center\">□<\u002Ftd>`).join(\"\");\n  return docHead(c,\"Course Evaluation Survey\",\"Indirect measurement of CLOs — anonymous, completed at the end of the semester · BAC Criterion 10.2\")+`\n  <table class=\"tbl\" style=\"max-width:620px\"><tbody><tr><th style=\"width:180px\">Course code &amp; section<\u002Fth><td>${esc(c.code)}${c.section? \" (\"+esc(c.section)+\")\":\"\"}<\u002Ftd><\u002Ftr><tr><th>Course title<\u002Fth><td>${esc(c.title)}<\u002Ftd><\u002Ftr><tr><th>Semester<\u002Fth><td>${esc(c.semester)}<\u002Ftd><\u002Ftr><\u002Ftbody><\u002Ftable>\n  <p style=\"font-size:13px;margin-top:12px\"><b>Instructions:<\u002Fb> This survey is anonymous and does not affect your grade. Tick the response that best reflects your view.<br><b>5<\u002Fb> Strongly agree · <b>4<\u002Fb> Agree · <b>3<\u002Fb> Neutral · <b>2<\u002Fb> Disagree · <b>1<\u002Fb> Strongly disagree<\u002Fp>\n  <p style=\"font-size:13px\"><b>A. After completing this course, I am able to:<\u002Fb><\u002Fp>\n  <table class=\"tbl\"><thead><tr><th style=\"width:50px\">CLO<\u002Fth><th>Statement<\u002Fth>${hd}<\u002Ftr><\u002Fthead><tbody>${c.clos.map((co,i)=>`<tr><td><b>CLO${i+1}<\u002Fb><\u002Ftd><td style=\"font-size:12.5px\">${esc(stripLead(co.text))}<\u002Ftd>${box}<\u002Ftr>`).join(\"\")||'<tr><td colspan=\"7\">Define CLOs first<\u002Ftd><\u002Ftr>'}<\u002Ftbody><\u002Ftable>\n  <p style=\"font-size:13px;margin-top:14px\"><b>B. About the course:<\u002Fb><\u002Fp>\n  <table class=\"tbl\"><thead><tr><th>Statement<\u002Fth>${hd}<\u002Ftr><\u002Fthead><tbody>${FB_ITEMS.map(([k,q])=>`<tr><td style=\"font-size:12.5px\">${q}<\u002Ftd>${box}<\u002Ftr>`).join(\"\")}<\u002Ftbody><\u002Ftable>\n  ${c.survey.openQ.filter(q=>q.q).map(q=>`<p style=\"font-size:13px;margin-top:12px\"><b>${esc(q.q)} (optional):<\u002Fb><\u002Fp><p>…………………………………………………………………………………………………………<br>…………………………………………………………………………………………………………<\u002Fp>`).join(\"\")}\n  <p style=\"font-size:11.5px;color:var(--muted)\">Response counts are entered in Attainment → Student Survey.<\u002Fp>`;\n}\n/* ---- 6. Course Report ---- */\nfunction adoptedActs(c){ const m={}; c.clos.forEach((co,i)=>co.tla.concat(co.tlaOther?[co.tlaOther]:[]).forEach(t=>{ m[t]=m[t]||[]; m[t].push(\"CLO\"+(i+1)); })); return Object.keys(m).map(n=>({name:n,clos:m[n]})); }\nconst RES_ROWS=[[\"phy\",\"Physical resources in the classroom (board, projector, seating, AC)\"],[\"ict\",\"ICT hardware (computers, devices)\"],[\"sw\",\"Software and LMS\"],[\"net\",\"Network / internet\"],[\"med\",\"Media resources (slides, handouts, videos)\"],[\"lib\",\"Library and reading materials\"]];\nfunction docReport(c){\n  const r=c.report, att=computeAttainment(c), e=c.evalT; const P=att.plos.filter(p=>p.mapped);\n  const tp=c.weeks.reduce((t,w)=>t+(parseFloat(w.hrs)||0),0), ta=c.weeks.reduce((t,w)=>t+(parseFloat(w.actual)||0),0);\n  const fbRows=c.assessments.filter(a=>a.fbDate||a.fbMode);\n  const cell=(k,f,v,rows)=>`<textarea class=\"di\" rows=\"${rows||2}\" onchange=\"setTlaA(${JSON.stringify(k).replace(/\"/g,\"&quot;\")},'${f}',this.value)\">${esc(v||\"\")}<\u002Ftextarea>`;\n  const fbMean=k=>{const t=c.survey.fbTally[k]||[];const n=t.reduce((a,b)=>a+(parseFloat(b)||0),0);return n? (t.reduce((a,b,j)=>a+(j+1)*(parseFloat(b)||0),0)/n).toFixed(2):\"—\";};\n  return docHead(c,\"Course Rep
