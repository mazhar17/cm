  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

=\"7 September 2026\";\nconst APP_URL=\"https://mazhar17.github.io/cm\", AUTHOR_URL=\"https://mazhar17.github.io/MI\", GUIDE_URL=\"https://mazhar17.github.io/cm/CM_User_Guide.pdf\";\nconst STORE_KEY=\"course_manager_v1\";\nconst DOMAINS=[\"Fundamental\",\"Social\",\"Thinking\",\"Personal\"];\nconst DOMAIN_TIP={\n  Fundamental:\"Discipline-specific knowledge and application of skills.\",\n  Social:\"Working with people, communication, community engagement.\",\n  Thinking:\"Learning to learn, decision-making, problem solving, entrepreneurship, critical thinking.\",\n  Personal:\"Life-long learning, self-direction, integrity, citizenship, time management, teamwork.\"};\nconst BLOOMS=[\"Remember\",\"Understand\",\"Apply\",\"Analyze\",\"Evaluate\",\"Create\"];\nconst ASSESS_TYPES=[\"Class Performance\",\"Quiz\",\"Assignment\",\"Mid Term\",\"Final Exam\",\"Lab/Practical\",\"Project\",\"Presentation\",\"Viva\",\"Attendance\",\"Other\"];\nconst FINAL_TYPES=[\"Final Exam\"];\nconst TLA_POOL=[\"Lecture\",\"Interactive lecture with Q&A\",\"Tutorial / problem-solving class\",\"Laboratory / practical\",\"Case study\",\"Group discussion\",\"Flipped classroom\",\"Project-based learning\",\"Seminar / student presentation\",\"Field visit / industry exposure\",\"Demonstration\",\"Self-directed reading\",\"Online / blended session\",\"Peer teaching\",\"Role play / simulation\"];\nconst TIPS={\n  \"Lecture\":\"Break every 15 minutes with a one-minute question; close with a two-line summary.\",\n  \"Interactive lecture with Q&A\":\"Plan three questions in advance and wait at least five seconds before answering yourself.\",\n  \"Tutorial / problem-solving class\":\"Students attempt first, then compare; the teacher solves last.\",\n  \"Laboratory / practical\":\"Sign the log book each session — BAC Criterion 5.2 asks for it.\",\n  \"Case study\":\"Give the case one week ahead; grade the reasoning, not the answer.\",\n  \"Group discussion\":\"Fix groups of 4–5 and rotate the reporter every week.\",\n  \"Flipped classroom\":\"Keep pre-class videos under ten minutes; start class with a readiness quiz.\",\n  \"Project-based learning\":\"Publish the rubric on day one (Criterion 5.4) and hold a mid-way review.\",\n  \"Seminar / student presentation\":\"Use a rubric with at most five rows; peers score too.\",\n  \"Field visit / industry exposure\":\"Ask for a one-page reflection mapped to a CLO.\",\n  \"Demonstration\":\"Pause and ask students to predict the outcome before you reveal it.\",\n  \"Self-directed reading\":\"Attach two guiding questions; check with a short quiz.\",\n  \"Online / blended session\":\"Record the session and post it the same day for revision equity.\",\n  \"Peer teaching\":\"Assign topics a week ahead; the teacher adds only corrections.\",\n  \"Role play / simulation\":\"Debrief for at least a third of the session time.\"};\nconst FB_ITEMS=[[\"tla\",\"The teaching-learning activities helped me learn.\"],[\"res\",\"Learning resources (slides, books, materials) supported my learning.\"],[\"align\",\"Assessments matched what was taught and the stated CLOs.\"],[\"rubric\",\"Assessment criteria/rubrics were made known in advance.\"],[\"fbk\",\"I received timely feedback on quizzes, assignments and other continuous assessments.\"],[\"pace\",\"The class schedule was maintained and the pace was appropriate.\"]];\n\n/* ============ State & institution ============ */\nlet state={courses:[],activeCourseId:null};\nconst INST_DEFAULT={\n  name:\"Ahsanullah University of Science and Technology (AUST)\",\n  addr:\"141-142 Love Road, Tejgaon Industrial Area, Dhaka-1208, Bangladesh\",\n  logo:\"\", faculty:\"\", dept:\"\", program:\"\", degree:\"Bachelor\", bnqf:\"Level 8\",\n  roles:{hod:\"Head of the Department\",coord:\"Programme Coordinator\",moderator:\"Chair, Examination/Moderation Committee\",iqac:\"Director, IQAC\"},\n  defaults:{passMarks:40,kpiTarget:50,wDirect:80,likertPass:4},\n  plos:[\n    {code:\"PLO1\",text:\"Apply knowledge of the discipline to solve problems in professional and academic contexts.\",domain:\"Fundamental\"},\n    {code:\"PLO2\",text:\"Analyze information critically and make reasoned, evidence-based decisions.\",domain:\"Thinking\"},\n    {code:\"PLO3\",text:\"Communicate effectively in written and oral forms with diverse audiences.\",domain:\"Social\"},\n    {code:\"PLO4\",text:\"Work responsibly as an individual and as a member or leader of a team.\",domain:\"Social\"},\n    {code:\"PLO5\",text:\"Act with integrity and ethical responsibility towards society and environment.\",domain:\"Personal\"},\n    {code:\"PLO6\",text:\"Engage in independent, life-long learning and adapt to change.\",domain:\"Personal\"}],\n  gas:\"\",\n  grades:[{v:\"80% and above\",g:\"A+\",gp:\"4.00\"},{v:\"75% to less than 80%\",g:\"A\",gp:\"3.75\"},{v:\"70% to less than 75%\",g:\"A-\",gp:\"3.50\"},{v:\"65% to less than 70%\",g:\"B+\",gp:\"3.25\"},{v:\"60% to less than 65%\",g:\"B\",gp:\"3.00\"},{v:\"55% to less than 60%\",g:\"B-\",gp:\"2.75\"},{v:\"50% to less than 55%\",g:\"C+\",gp:\"2.50\"},{v:\"45% to less than 50%\",g:\"C\",gp:\"2.25\"},{v:\"40% to less than 45%\",g:\"D\",gp:\"2.00\"},{v:\"Below 40%\",g:\"F\",gp:\"0.00\"}]\n};\nfunction inst(){\n  if(!state.inst) state.inst=JSON.parse(JSON.stringify(INST_DEFAULT));\n  const i=state.inst;\n  [\"name\",\"addr\",\"logo\",\"faculty\",\"dept\",\"program\",\"degree\",\"bnqf\",\"gas\"].forEach(k=>{ if(i[k]===undefined) i[k]=INST_DEFAULT[k]; });\n  i.roles=Object.assign({},INST_DEFAULT.roles,i.roles||{});\n  i.defaults=Object.assign({},INST_DEFAULT.defaults,i.defaults||{});\n  if(!Array.isArray(i.plos)) i.plos=JSON.parse(JSON.stringify(INST_DEFAULT.plos));\n  if(!Array.isArray(i.grades)) i.grades=JSON.parse(JSON.stringify(INST_DEFAULT.grades));\n  return i;\n}\nfunction plos(){ return inst().plos; }\nfunction role(k){ return inst().roles[k]||INST_DEFAULT.roles[k]; }\nfunction defaultCfg(){ const d=inst().defaults; const wd=+d.wDirect||80; return {passMarks:+d.passMarks||40,kpiTarget:+d.kpiTarget||50,wDirect:wd,wIndirect:100-wd,likertPass:+d.likertPass||4}; }\nfunction ensure(c){\n  if(!c.cfg) c.cfg=defaultCfg();\n  const wd=Math.max(0,Math.min(100,parseFloat(c.cfg.wDirect))); c.cfg.wDirect=isNaN(wd)?80:wd; c.cfg.wIndirect=100-c.cfg.wDirect;\n  [\"code\",\"title\",\"credit\",\"semester\",\"program\",\"section\",\"instructor\",\"prereq\",\"type\",\"objectives\",\"synopsis\",\"textbooks\",\"refs\",\"facilities\",\"consult\",\"room\",\"email\",\"phone\",\"gradingNote\",\"rubricNote\",\"routineRef\",\"totalWeeks\"].forEach(k=>{ if(c[k]===undefined) c[k]=\"\"; });\n  if(!c.type) c.type=\"Core\"; if(!c.totalWeeks) c.totalWeeks=\"14\";\n  [\"clos\",\"assessments\",\"students\",\"sessions\",\"feedbackLog\"].forEach(k=>{ if(!Array.isArray(c[k])) c[k]=[]; });\n  if(!c.marks) c.marks={};\n  c.clos.forEach(co=>{ if(!co.plo) co.plo={}; if(!co.bloom) co.bloom=\"Apply\"; if(!co.domain) co.domain=\"Fundamental\"; if(!Array.isArray(co.tla)) co.tla=[]; if(!Array.isArray(co.assess)) co.assess=[]; co.slt=Object.assign({lec:\"\",tut:\"\",prac:\"\",self:\"\",asm:\"\"},co.slt||{}); });\n  c.assessments.forEach(a=>{ if(!Array.isArray(a.items)) a.items=[]; if(a.weightPct===undefined) a.weightPct=\"\"; if(a.rubric===undefined) a.rubric=false; if(a.date===undefined) a.date=\"\"; if(a.fbDate===undefined) a.fbDate=\"\"; if(a.fbMode===undefined) a.fbMode=\"\"; });\n  if(!Array.isArray(c.weeks)||c.weeks.length!==parseInt(c.totalWeeks||14)) c.weeks=Array.from({length:parseInt(c.totalWeeks)||14},(_,i)=>(c.weeks&&c.weeks[i])||{topic:\"\",clos:[],tla:\"\",hrs:\"\"});\n  c.weeks.forEach(w=>{ if(!Array.isArray(w.clos)) w.clos=[]; });\n  c.survey=c.survey||{}; c.survey.tally=c.survey.tally||{}; c.survey.fbTally=c.survey.fbTally||{};\n  if(!Array.isArray(c.survey.openQ)) c.survey.openQ=[{q:\"The best aspect of this course\",sum:\"\"},{q:\"One suggested improvement\",sum:\"\"}];\n  if(c.survey.n===undefined) c.survey.n=\"\";\n  c.moderation=Object.assign({date:\"\",members:\"\",external:\"\",note:\"\",coverage:{}},c.moderation||{});\n  c.statement=Object.assign({date:\"\",note:\"\",signed:false},c.statement||{});\n  c.evalT=Object.assign({wentWell:\"\",difficulties:\"\",attainComment:\"\",surveyComment:\"\",resComment:\"\",date:\"\"},c.evalT||{});\n  c.outline=Object.assign({level:\"\",methods:null,prepared:\"\",preparedDate:\"\",checked:\"\",checkedDate:\"\",approved:\"\",approvedDate:\"\",contactHrs:\"\",totalMarks:\"\",assessStrategy:\"\",contMarks:\"\",summMarks:\"\",makeup:\"\",supp:\"\",other:\"\",coCurricular:\"\"},c.outline||{});\n  c.spec=Object.assign({submitDate:\"\",other:\"\",finalExamHrs:\"3\"},c.spec||{});\n  if(!Array.isArray(c.spec.prevIneffective)) c.spec.prevIneffective=[];\n  if(!Array.isArray(c.spec.cqiPrev)||c.spec.cqiPrev.length!==4) c.spec.cqiPrev=Array.from({length:4},(_,i)=>(c.spec.cqiPrev&&c.spec.cqiPrev[i])||{rec:\"\",ref:\"\"});\n  c.report=Object.assign({submitDate:\"\",coComment:\"\",ploComment:\"\",feedback:\"\",surveys:\"\",hod:\"\"},c.report||{});\n  if(!Array.isArray(c.report.cqi)||c.report.cqi.length!==4) c.report.cqi=Array.from({length:4},(_,i)=>(c.report.cqi&&c.report.cqi[i])||\"\");\n  if(!c.report.tlaA||typeof c.report.tlaA!==\"object\") c.report.tlaA={};\n  if(!c.report.res||typeof c.report.res!==\"object\") c.report.res={};\n  c.vet=Object.assign({vetter1:\"\",vetter2:\"\"},c.vet||{});\n  c.clos.forEach(co=>{ [\"modStatement\",\"modPLO\",\"modBloom\",\"tlaOther\"].forEach(k=>{ if(co[k]===undefined) co[k]=\"\"; }); });\n  c.weeks.forEach(w=>{ [\"m\",\"actual\",\"reason\",\"co\"].forEach(k=>{ if(w[k]===undefined) w[k]=\"\"; }); });\n  if(Array.isArray(c.actions)&&c.actions.length){ c.report.cqi[0]=[c.report.cqi[0],...c.actions.map(x=>(x.issue?x.issue+\" — \":\"\")+x.action)].filter(Boolean).join(\"\\n\"); delete c.actions; }\n  if(Array.isArray(c.prevActions)&&c.prevActions.length){ c.spec.cqiPrev[0].rec=[c.spec.cqiPrev[0].rec,...c.prevActions.map(x=>x.action)].filter(Boolean).join(\"\\n\"); delete c.prevActions; }\n  if(!c.filechk) c.filechk={};\n  if(!c.filenote) c.filenote={};\n  if(c.peerReview===undefined) c.peerReview=\"\";\n  return c;\n}\nfunction load(){\n  try{ const raw=localStorage.getItem(STORE_KEY); if(raw) state=JSON.parse(raw); }catch(e){ console.warn(e); }\n  if(!state||!Array.isArray(state.courses)) state={courses:[],activeCourseId:null};\n  state.courses.forEach(ensure);\n}\nfunction save(){\n  try{ localStorage.setItem(STORE_KEY,JSON.stringify(state)); }catch(e){ toast(\"Warning: could not save (browser storage full?)\"); }\n  if(typeof scheduleFileSave===\"function\") scheduleFileSave();\n  if(typeof scheduleDriveSave===\"function\") scheduleDriveSave();\n}\nfunction uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }\nfunction esc(s){ return String(s??\"\").replace(/&/g,\"&amp;\").replace(/<\u002Fg,\"&lt;\").replace(/>/g,\"&gt;\").replace(/\"/g,\"&quot;\"); }\nfunction toast(msg){ const t=document.getElementById(\"toast\"); t.textContent=msg; t.classList.add(\"show\"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove(\"show\"),2000); }\nfunction autoGrowTA(t){ if(!t) return; t.style.height=\"auto\"; t.style.height=(t.scrollHeight+2)+\"px\"; }\nfunction growAll(root){ (root||document).querySelectorAll(\"textarea\").forEach(autoGrowTA); }\ndocument.addEventListener(\"input\",e=>{ if(e.target&&e.target.tagName===\"TEXTAREA\") autoGrowTA(e.target); },true);\nwindow.addEventListener(\"resize\",()=>growAll());\nfunction activeCourse(){ return state.courses.find(c=>c.id===state.activeCourseId)||null; }\nfunction cloLabel(c,id){ const i=c.clos.findIndex(x=>x.id===id); return i>=0?\"CLO\"+(i+1):\"—\"; }\nfunction todayISO(){ const t=new Date(); return t.getFullYear()+\"-\"+String(t.getMonth()+1).padStart(2,\"0\")+\"-\"+String(t.getDate()).padStart(2,\"0\"); }\nfunction pct(a,b){ return b? Math.round(a/b*1000)/10 : 0; }\n/* generic setters */\nfunction cSet(path,val,rerender){\n  const c=activeCourse(); if(!c) return;\n  const parts=path.split(\".\"); let o=c;\n  while(parts.length>1){ const k=parts.shift(); if(o[k]===undefined||o[k]===null||typeof o[k]!==\"object\") o[k]={}; o=o[k]; }\n  o[parts[0]]=(typeof val===\"string\")? val.trim(): val;\n  save(); if(rerender) renderTab(curTab()); else toast(\"Saved\");\n}\nfunction instSet(path,v){\n  const i=inst(); const p=path.split(\".\"); let o=i;\n  while(p.length>1){ const k=p.shift(); if(typeof o[k]!==\"object\"||!o[k]) o[k]={}; o=o[k]; }\n  o[p[0]]=(typeof v===\"string\")? v.trim(): v; save(); renderSetup(); renderCourseSelect();\n}\n\n/* ============ Working on a file: local (File System Access) and Google Drive ============ */\nconst FS_OK=typeof window!==\"undefined\"&&typeof window.showOpenFilePicker===\"function\";\nconst FILE_TYPES=[{description:\"Course Manager data\",accept:{\"application/json\":[\".json\"]}}];\nconst DRIVE_SCOPE=\"https://www.googleapis.com/auth/drive.file\";\nconst CID_KEY=\"cm_drive_client_id\", DRIVE_KEY=\"cm_drive_file\";\nlet fileHandle=null, filePermOk=false, fileDirty=false, fileTimer=null;\nlet drive=null;               // {id,name,syncedTime} — the linked Drive file\nlet driveDirty=false, driveTimer=null, driveConflict=false, driveToken=null, driveTokenExp=0, driveBusy=\"\";\nfunction idb(){ return new Promise((res,rej)=>{ if(typeof indexedDB===\"undefined\"){ rej(new Error(\"no idb\")); return; }\n  const r=indexedDB.open(\"cm_fs\",1); r.onupgradeneeded=()=>r.result.createObjectStore(\"h\"); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }\nasync function idbSet(k,v){ try{ const d=await idb(); await new Promise((res,rej)=>{ const t=d.transaction(\"h\",\"readwrite\"); t.objectStore(\"h\").put(v,k); t.oncomplete=res; t.onerror=()=>rej(t.error); }); }catch(e){} }\nasync function idbGet(k){ try{ const d=await idb(); return await new Promise((res,rej)=>{ const g=d.transaction(\"h\",\"readonly\").objectStore(\"h\").get(k); g.onsuccess=()=>res(g.result); g.onerror=()=>rej(g.error); }); }catch(e){ return undefined; } }\nasync function idbDel(k){ try{ const d=await idb(); await new Promise((res,rej)=>{ const t=d.transaction(\"h\",\"readwrite\"); t.objectStore(\"h\").delete(k); t.oncomplete=res; t.onerror=()=>rej(t.error); }); }catch(e){} }\nasync function verifyPerm(h,write){ const o={mode:write?\"readwrite\":\"read\"}; if(await h.queryPermission(o)===\"granted\") return true; return (await h.requestPermission(o))===\"granted\"; }\nfunction adoptState(data){\n  state=data; if(!Array.isArray(state.courses)) state.courses=[];\n  state.courses.forEach(ensure);\n  if(state.courses.length&&!state.courses.find(x=>x.id===state.activeCourseId)) state.activeCourseId=state.courses[0].id;\n}\nfunction stateJSON(){ return JSON.stringify(state,null,1); }\nfunction validData(d){ return d&&typeof d===\"object\"&&Array.isArray(d.courses); }\n\n/* ---- local file ---- */\nasync function openDataFile(){\n  try{\n    const [hd]=await window.showOpenFilePicker({types:FILE_TYPES});\n    if(!await verifyPerm(hd,true)){ toast(\"Permission not granted\"); return; }\n    const data=JSON.parse(await (await hd.getFile()).text());\n    if(!validData(data)) throw new Error(\"Not a Course Manager data file\");\n    if(state.courses.length&&!confirm('Replace the data currently in this browser with the contents of \"'+hd.name+'\"?')) return;\n    adoptState(data); fileHandle=hd; filePermOk=true; fileDirty=false;\n    await idbSet(\"main\",hd); save(); refresh(); updateFileChip(); toast(\"Now working on file: \"+hd.name);\n  }catch(e){ if(e&&e.name!==\"AbortError\") alert(\"Could not open the file: \"+e.message); }\n}\nasync function newDataFile(){\n  try{\n    if(state.courses.length&&!confirm(\"Create a new, empty data file?\\n\\nThe courses now in this browser stay here, but the app switches to the new file. Use “Save to New File…” first if you want them kept in a file.\")) return;\n    if(fileHandle&&filePermOk){ try{ clearTimeout(fileTimer); await writeFileNow(); }catch(e){} }\n    const hd=await window.showSaveFilePicker({suggestedName:\"course-manager-data.json\",types:FILE_TYPES});\n    state={courses:[],activeCourseId:null,inst:state.inst}; fileHandle=hd; filePermOk=true; fileDirty=false;\n    await idbSet(\"main\",hd); save(); await writeFileNow(); refresh(); updateFileChip(); toast(\"New data file: \"+hd.name+\" — your Setup settings were carried over\");\n  }catch(e){ if(e&&e.name!==\"AbortError\") alert(\"Could not create the file: \"+e.message); }\n}\nasync function saveAsDataFile(){\n  try{\n    const hd=await window.showSaveFilePicker({suggestedName:fileHandle? fileHandle.name.replace(/\\.json$/i,\"\")+\"_copy.json\":\"course-manager-data.json\",types:FILE_TYPES});\n    fileHandle=hd; filePermOk=true; await idbSet(\"main\",hd); await writeFileNow();\n    updateFileChip(); renderTab(curTab()); toast(\"Saved to \"+hd.name+\" — changes now auto-save there\");\n  }catch(e){ if(e&&e.name!==\"AbortError\") alert(\"Could not save the file: \"+e.message); }\n}\nasync function writeFileNow(){\n  if(!fileHandle) return;\n  const w=await fileHandle.createWritable(); await w.write(stateJSON()); await w.close();\n  fileDirty=false; updateFileChip();\n}\nasync function reconnectFile(){\n  if(!fileHandle) return;\n  if(!await verifyPerm(fileHandle,true)){ toast(\"Permission not granted\"); return; }\n  filePermOk=true;\n  try{\n    const data=JSON.parse(await (await fileHandle.getFile()).text());\n    if(validData(data)&&JSON.stringify(data)!==JSON.stringify(state)){\n      if(confirm('Load the data from \"'+fileHandle.name+'\"?\\n\\nOK = use the file\\'s data.\\nCancel = keep what is in this browser (the file is overwritten on the next change).')){ adoptState(data); save(); refresh(); }\n      else scheduleFileSave();\n    }\n  }catch(e){}\n  updateFileChip(); toast(\"Connected to \"+fileHandle.name);\n}\nasync function unlinkFile(){ fileHandle=null; filePermOk=false; fileDirty=false; await idbDel(\"main\"); updateFileChip(); renderTab(curTab()); toast(\"Stopped using the file — data remains in this browser\"); }\nfunction scheduleFileSave(){\n  if(!fileHandle||!filePermOk) return;\n  fileDirty=true; updateFileChip(); clearTimeout(fileTimer);\n  fileTimer=setTimeout(()=>writeFileNow().catch(()=>toast(\"File save failed — see Data & Backup\")),1200);\n}\n\n/* ---- Google Drive ----\n   The app holds no shared credentials: each institution registers its own OAuth client\n   (Google Cloud → Credentials → OAuth client ID, type \"Web application\", this page's origin\n   as an authorized JavaScript origin) and pastes the Client ID once. Scope drive.file means\n   the app can only ever see files it created or the user explicitly opened through it. */\nfunction driveClientId(){ try{ return localStorage.getItem(CID_KEY)||\"\"; }catch(e){ return \"\"; } }\nfunction driveConfigured(){ return !!driveClientId(); }\nfunction driveSetup(){\n  const cur=driveClientId();\n  const v=prompt(\"Google Drive setup\\n\\nPaste your Google OAuth Client ID (ends in .apps.googleusercontent.com).\\n\\nIn Google Cloud Console → APIs & Services:\\n1. Enable the Google Drive API.\\n2. Credentials → Create OAuth client ID → Web application.\\n3. Add this page's address as an Authorized JavaScript origin:\\n   \"+location.origin+\"\\n\\nLeave blank and press OK to remove the current ID.\",cur);\n  if(v===null) return;\n  const id=v.trim();\n  try{ if(id) localStorage.setItem(CID_KEY,id); else localStorage.removeItem(CID_KEY); }catch(e){}\n  driveToken=null; driveTokenExp=0; updateFileChip(); renderTab(curTab());\n  toast(id? \"Drive client ID saved\":\"Drive client ID removed\");\n}\nfunction loadGIS(){\n  return new Promise((res,rej)=>{\n    if(window.google&&window.google.accounts&&window.google.accounts.oauth2) return res();\n    const s=document.createElement(\"script\"); s.src=\"https://accounts.google.com/gsi/client\"; s.async=true;\n    s.onload=()=>res(); s.onerror=()=>rej(new Error(\"Could not load Google sign-in — check the internet connection\"));\n    document.head.appendChild(s);\n  });\n}\nasync function driveAuth(interactive){\n  if(!driveConfigured()) throw new Error(\"Google Drive is not set up yet — choose “Set up Google Drive…” first\");\n  if(driveToken&&Date.now()<driveTokenExp-60000) return driveToken;\n  await loadGIS();\n  return new Promise((res,rej)=>{\n    const tc=google.accounts.oauth2.initTokenClient({\n      client_id:driveClientId(), scope:DRIVE_SCOPE,\n      callback:r=>{ if(r&&r.access_token){ driveToken=r.access_token; driveTokenExp=Date.now()+(r.expires_in||3600)*1000; res(driveToken); }\n                    else rej(new Error(\"Google did not return access\")); }});\n    try{ tc.requestAccessToken({prompt:interactive===false?\"\":\"consent\"}); }catch(e){ rej(e); }\n  });\n}\nasync function driveFetch(url,opts){\n  const t=await driveAuth();\n  const o=Object.assign({},opts||{}); o.headers=Object.assign({Authorization:\"Bearer \"+t},(o.headers||{}));\n  const r=await fetch(url,o);\n  if(r.status===401){ driveToken=null; const t2=await driveAuth(); o.headers.Authorization=\"Bearer \"+t2; return fetch(url,o); }\n  return r;\n}\nasync function driveMeta(id){\n  const r=await driveFetch(\"https://www.googleapis.com/drive/v3/files/\"+id+\"?fields=id,name,modifiedTime\");\n  if(!r.ok) throw new Error(\"Drive: \"+r.status+\" \"+(await r.text()).slice(0,120)); return r.json();\n}\nasync function driveOpen(){\n  try{\n    driveBusy=\"listing\"; updateFileChip();\n    const r=await driveFetch(\"https://www.googleapis.com/drive/v3/files?q=\"+encodeURIComponent(\"trashed=false and mimeType='application/json'\")+\"&orderBy=modifiedTime desc&pageSize=30&fields=files(id,name,modifiedTime)\");\n    driveBusy=\"\"; if(!r.ok) throw new Error(\"Drive returned \"+r.status);\n    const files=(await r.json()).files||[];\n    if(!files.length){ alert(\"No Course Manager files found in your Drive.\\n\\nOnly files this app created or you opened through it are visible (scope drive.file). Use “Save to Google Drive as…” to create one.\"); updateFileChip(); return; }\n    const pick=prompt(\"Open from Google Drive — type the number:\\n\\n\"+files.map((f,i)=>(i+1)+\". \"+f.name+\"  (\"+new Date(f.modifiedTime).toLocaleString()+\")\").join(\"\\n\"),\"1\");\n    if(pick===null){ updateFileChip(); return; }\n    const f=files[parseInt(pick,10)-1]; if(!f){ toast(\"Nothing selected\"); updateFileChip(); return; }\n    const c=await driveFetch(\"https://www.googleapis.com/drive/v3/files/\"+f.id+\"?alt=media\");\n    const data=JSON.parse(await c.text());\n    if(!validData(data)) throw new Error('\"'+f.name+'\" is not a Course Manager data file');\n    if(state.courses.length&&!confirm('Replace the data currently in this browser with \"'+f.name+'\" from Drive?')){ updateFileChip(); return; }\n    adoptState(data); drive={id:f.id,name:f.name,syncedTime:f.modifiedTime}; driveConflict=false; driveDirty=false;\n    persistDrive(); save(); refresh(); updateFileChip(); toast(\"Working on Drive file: \"+f.name);\n  }catch(e){ driveBusy=\"\"; updateFileChip(); alert(\"Could not open from Drive: \"+e.message); }\n}\nasync function driveSaveAs(){\n  try{\n    const suggested=(drive&&drive.name)||((activeCourse()&&activeCourse().code? activeCourse().code.replace(/\\s+/g,\"_\")+\"_\":\"\")+\"course-manager-data.json\");\n    const name=prompt(\"Save to Google Drive as — file name:\",suggested); if(name===null) return;\n    const fn=name.trim().replace(/\\.json$/i,\"\")+\".json\";\n    driveBusy=\"saving\"; updateFileChip();\n    const boundary=\"cmb\"+Date.now();\n    const body=\"--\"+boundary+\"\\r\\nContent-Type: application/json; charset=UTF-8\\r\\n\\r\\n\"+JSON.stringify({name:fn,mimeType:\"application/json\"})+\n      \"\\r\\n--\"+boundary+\"\\r\\nContent-Type: application/json\\r\\n\\r\\n\"+stateJSON()+\"\\r\\n--\"+boundary+\"--\";\n    const r=await driveFetch(\"https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name,modifiedTime\",\n      {method:\"POST\",headers:{\"Content-Type\":'multipart/related; boundary=\"'+boundary+'\"'},body});\n    driveBusy=\"\"; if(!r.ok) throw new Error(\"Drive returned \"+r.status+\" \"+(await r.text()).slice(0,120));\n    const f=await r.json();\n    drive={id:f.id,name:f.name,syncedTime:f.modifiedTime}; driveConflict=false; driveDirty=false;\n    persistDrive(); updateFileChip(); renderTab(curTab()); toast(\"Saved to Drive: \"+f.name+\" — changes now sync there\");\n  }catch(e){ driveBusy=\"\"; updateFileChip(); alert(\"Could not save to Drive: \"+e.message); }\n}\nasync function driveWriteNow(){\n  if(!drive||driveConflict) return;\n  driveBusy=\"saving\"; updateFileChip();\n  try{\n    const r=await driveFetch(\"https://www.googleapis.com/upload/drive/v3/files/\"+drive.id+\"?uploadType=media&fields=id,name,modifiedTime\",\n      {method:\"PATCH\",headers:{\"Content-Type\":\"application/json\"},body:stateJSON()});\n    if(!r.ok) throw new Error(\"Drive returned \"+r.status);\n    const f=await r.json(); drive.name=f.name; drive.syncedTime=f.modifiedTime; driveDirty=false; persistDrive();\n  }catch(e){ toast(\"Drive save failed — \"+e.message); }\n  driveBusy=\"\"; updateFileChip();\n}\nfunction scheduleDriveSave(){\n  if(!drive||driveConflict) return;\n  driveDirty=true; updateFileChip(); clearTimeout(driveTimer);\n  driveTimer=setTimeout(()=>driveWriteNow(),2500);\n}\nasync function driveCheckRemote(){\n  if(!drive) return;\n  try{\n    const m=await driveMeta(drive.id); drive.name=m.name;\n    if(drive.syncedTime&&new Date(m.modifiedTime)>new Date(drive.syncedTime)){ driveConflict=true; toast(\"This Drive file changed elsewhere — choose which version to keep\"); }\n    persistDrive(); updateFileChip();\n  }catch(e){}\n}\nasync function driveKeepMine(){\n  if(!drive) return;\n  if(!confirm('Overwrite \"'+drive.name+'\" in Drive with the data in this browser?\\n\\nThe newer version now in Drive will be replaced.')) return;\n  driveConflict=false; drive.syncedTime=null; await driveWriteNow(); toast(\"Drive file overwritten with your data\");\n}\nasync function driveLoadRemote(){\n  if(!drive) return;\n  if(!confirm('Load \"'+drive.name+'\" from Drive?\\n\\nThe data currently in this browser is replaced.')) return;\n  try{\n    const c=await driveFetch(\"https://www.googleapis.com/drive/v3/files/\"+drive.id+\"?alt=media\");\n    const data=JSON.parse(await c.text()); if(!validData(data)) throw new Error(\"not a Course Manager file\");\n    const m=await driveMeta(drive.id);\n    adoptState(data); drive.syncedTime=m.modifiedTime; driveConflict=false; driveDirty=false;\n    persistDrive(); save(); refresh(); updateFileChip(); toast(\"Loaded the Drive version\");\n  }catch(e){ alert(\"Could not load from Drive: \"+e.message); }\n}\nfunction driveUnlink(){\n  if(!confirm(\"Stop using the Drive file?\\n\\nYour data stays in this browser; the file in Drive is left as it is.\")) return;\n  drive=null; driveDirty=false; driveConflict=false; clearTimeout(driveTimer);\n  try{ localStorage.removeItem(DRIVE_KEY); }catch(e){}\n  updateFileChip(); renderTab(curTab()); toast(\"Stopped using the Drive file\");\n}\nfunction persistDrive(){ try{ drive? localStorage.setItem(DRIVE_KEY,JSON.stringify(drive)) : localStorage.removeItem(DRIVE_KEY); }catch(e){} }\nfunction restoreDrive(){ try{ const r=localStorage.getItem(DRIVE_KEY); if(r){ const d=JSON.parse(r); if(d&&d.id) drive=d; } }catch(e){} }\n\n/* ---- the File control ---- */\nfunction fileStatusText(){\n  if(drive) return driveConflict? drive.name+\" · conflict\" : drive.name+\" · \"+(driveBusy===\"saving\"? \"syncing…\":(driveDirty? \"syncing…\":\"in Drive\"));\n  if(fileHandle) return fileHandle.name+\" · \"+(filePermOk? (fileDirty? \"saving…\":\"saved\") : \"reconnect\");\n  return \"in this browser\";\n}\nfunction updateFileChip(){\n  const el=document.getElementById(\"fileChip\"); if(!el) return;\n  const mi=(label,action,cls)=>`<button class=\"${cls||\"\"}\" onclick=\"window._fileMenuOpen=false;${action}\">${label}<\u002Fbutton>`;\n  const menu=items=>window._fileMenuOpen? `<div class=\"file-menu\">${items}<\u002Fdiv>`:\"\";\n  const warn=driveConflict? mi(\"⚠ Keep mine — overwrite the Drive file\",\"driveKeepMine()\",\"warn\")+mi(\"⚠ Load the Drive version instead\",\"driveLoadRemote()\",\"warn\"):\"\";\n  const driveItems=driveConfigured()\n    ? mi(\"☁ Open from Google Drive…\",\"driveOpen()\",\"sep\")+mi(\"☁ Save to Google Drive as…\",\"driveSaveAs()\")+(drive? mi(\"☁ Sync now\",\"driveWriteNow()\")+mi(\"☁ Check Drive for changes\",\"driveCheckRemote()\"):\"\")\n    : mi(\"☁ Set up Google Drive…\",\"driveSetup()\",\"sep\");\n  const localItems=FS_OK\n    ? mi(\"📁 Open Data File…\",\"openDataFile()\",\"sep\")+mi(\"💾 Save to New File…\",\"saveAsDataFile()\")+mi(\"🆕 New Data File…\",\"newDataFile()\")\n      +(fileHandle&&!filePermOk? mi(\"🔗 Reconnect to the file\",\"reconnectFile()\"):\"\")+(fileHandle&&filePermOk? mi(\"💾 Save now (Ctrl+S)\",\"saveNowShortcut()\"):\"\")\n    : mi(\"📁 File saving needs Chrome or Edge on a desktop\",\"toast('This browser keeps data in browser storage only — export a backup regularly')\",\"sep\");\n  const common=mi(\"⬇ Export ALL Courses (JSON)\",\"exportAll()\",\"sep\")+`<label class=\"mi-file\">⬆ Import JSON…<input type=\"file\" accept=\".json,application/json\" style=\"display:none\" onchange=\"window._fileMenuOpen=false;importAll(this,false)\"><\u002Flabel>`;\n  const stop=(drive? mi(\"Stop Using the Drive File\",\"driveUnlink()\",\"danger sep\"):\"\")+(fileHandle? mi(\"Stop Using the Data File\",\"unlinkFile()\",\"danger\"+(drive?\"\":\" sep\")):\"\");\n  const cls=driveConflict? \"conflict\":((driveDirty||fileDirty||driveBusy)? \"busy\":\"\");\n  el.innerHTML=`<span class=\"file-wrap\">\n    <button class=\"file-chip-btn ${cls}\" title=\"Where this data is stored — click for file and Drive options\" onclick=\"toggleFileMenu(event)\">File <span class=\"file-status\">${esc(fileStatusText())}<\u002Fspan> ▾<\u002Fbutton>\n    ${menu(warn+driveItems+localItems+common+stop)}<\u002Fspan>`;\n}\nfunction toggleFileMenu(e){ if(e&&e.stopPropagation) e.stopPropagation(); window._fileMenuOpen=!window._fileMenuOpen; updateFileChip(); }\ndocument.addEventListener(\"click\",e=>{ if(window._fileMenuOpen&&!e.target.closest(\".file-wrap\")){ window._fileMenuOpen=false; updateFileChip(); } });\nfunction saveNowShortcut(){\n  const ae=document.activeElement; if(ae&&ae.blur&&[\"INPUT\",\"TEXTAREA\",\"SELECT\"].includes(ae.tagName)) ae.blur();\n  save();\n  if(drive&&!driveConflict){ clearTimeout(driveTimer); driveWriteNow().then(()=>toast(\"Synced to Drive: \"+drive.name)); }\n  else if(FS_OK&&fileHandle&&filePermOk){ clearTimeout(fileTimer); writeFileNow().then(()=>toast(\"Saved to \"+fileHandle.name)).catch(()=>toast(\"File save failed\")); }\n  else if(FS_OK&&fileHandle){ reconnectFile(); }\n  else toast(\"Saved in this browser — use File ▸ Save to New File… or Save to Google Drive as… to keep a copy\");\n}\ndocument.addEventListener(\"keydown\",e=>{ if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()===\"s\"){ e.preventDefault(); saveNowShortcut(); } });\nwindow.addEventListener(\"beforeunload\",e=>{ if(driveDirty||fileDirty){ e.preventDefault(); e.returnValue=\"\"; } });\n\n/* ============ Navigation ============ */\nconst TABS=[[\"dashboard\",\"Dashboard\"],[\"course\",\"Course Info\"],[\"clos\",\"CLOs & Mapping\"],[\"tla\",\"T&L\"],[\"assess\",\"Assessments\"],[\"marks\",\"Students & Marks\"],[\"attend\",\"Attendance\"],[\"attain\",\"Attainment\"],[\"cqi\",\"CQI\"],[\"docs\",\"Documents\"],[\"data\",\"Data & Backup\"],[\"setup\",\"Setup\"],[\"about\",\"About\"]];\nfunction buildShell(){\n  document.getElementById(\"tabsNav\").innerHTML=TABS.map(([k,l])=>`<button class=\"tab-btn\" data-tab=\"${k}\" onclick=\"showTab('${k}')\">${l}<\u002Fbutton>`).join(\"\");\n  document.getElementById(\"main\").innerHTML=TABS.map(([k])=>`<section class=\"tab\" id=\"tab-${k}\"><\u002Fsection>`).join(\"\");\n}\nfunction curTab(){ return window._currentTab||\"dashboard\"; }\nfunction showTab(name){\n  document.querySelectorAll(\".tab\").forEach(s=>s.classList.remove(\"active\"));\n  document.querySelectorAll(\".tab-btn\").forEach(b=>b.classList.toggle(\"active\",b.dataset.tab===name));\n  document.getElementById(\"tab-\"+name).classList.add(\"active\");\n  window._currentTab=name; renderTab(name); window.scrollTo(0,0);\n}\nfunction renderTab(name){\n  const map={dashboard:renderDashboard,course:renderCourse,clos:renderCLOs,tla:renderTLA,assess:renderAssess,marks:renderMarks,attend:renderAttend,attain:renderAttain,cqi:renderCQI,docs:renderDocs,data:renderData,setup:renderSetup,about:renderAbout};\n  if(map[name]) map[name]();\n  const sec=document.getElementById(\"tab-\"+name); if(sec) requestAnimationFrame(()=>growAll(sec));\n}\nfunction refresh(){ renderCourseSelect(); renderTab(curTab()); }\nfunction renderCourseSelect(){\n  const sel=document.getElementById(\"courseSelect\");\n  if(!state.courses.length){ sel.innerHTML='<option value=\"\">— no course yet —<\u002Foption>'; return; }\n  sel.innerHTML=state.courses.map(c=>`<option value=\"${c.id}\" ${c.id===state.activeCourseId?\"selected\":\"\"}>${esc(c.code)} — ${esc(c.title)} (${esc(c.semester||\"\")})<\u002Foption>`).join(\"\");\n}\nfunction switchCourse(id){ state.activeCourseId=id; save(); refresh(); }\nconst SUBSECTS={attain:[[\"clo\",\"CLO — Direct\"],[\"plo\",\"PLO Contribution\"],[\"survey\",\"Student Survey (Indirect)\"],[\"combined\",\"Combined\"]],docs:[]};\nfunction subSect(tab){ window._sub=window._sub||{}; if(!window._sub[tab]) window._sub[tab]=SUBSECTS[tab][0][0]; return window._sub[tab]; }\nfunction setSubSect(tab,id){ window._sub=window._sub||{}; window._sub[tab]=id; renderTab(tab); }\nfunction subBar(tab){ const cur=subSect(tab); return `<div class=\"subbar no-print\">${SUBSECTS[tab].map(([id,l])=>`<button class=\"sub-btn ${id===cur?\"active\":\"\"}\" onclick=\"setSubSect('${tab}','${id}')\">${l}<\u002Fbutton>`).join(\"\")}<\u002Fdiv>`; }\nconst REFS=[\n  \"Spady, W. G. (1994). <i>Outcome-Based Education: Critical Issues and Answers.<\u002Fi> American Association of School Administrators, Arlington, VA. <a href=\\\"https://eric.ed.gov/?id=ED380910\\\" target=\\\"_blank\\\" rel=\\\"noopener\\\">ERIC ED380910<\u002Fa>.\",\n  \"Biggs, J. (1996). Enhancing teaching through constructive alignment. <i>Higher Education<\u002Fi>, 32(3), 347–364. <a href=\\\"https://doi.org/10.1007/BF00138871\\\" target=\\\"_blank\\\" rel=\\\"noopener\\\">doi:10.1007/BF00138871<\u002Fa>.\",\n  \"Biggs, J., &amp; Tang, C. (2011). <i>Teaching for Quality Learning at University<\u002Fi> (4th ed.). McGraw-Hill / Open University Press, Maidenhead. <a href=\\\"https://search.worldcat.org/title/772697952\\\" target=\\\"_blank\\\" rel=\\\"noopener\\\">WorldCat record<\u002Fa>.\",\n  \"Bloom, B. S. (Ed.) (1956). <i>Taxonomy of Educational Objectives, Handbook I: Cognitive Domain.<\u002Fi> David McKay, New York. <a href=\\\"https://search.worldcat.org/title/28003975\\\" target=\\\"_blank\\\" rel=\\\"noopener\\\">WorldCat record<\u002Fa>.\",\n  \"Anderson, L. W., &amp; Krathwohl, D. R. (Eds.) (2001). <i>A Taxonomy for Learning, Teaching, and Assessing: A Revision of Bloom’s Taxonomy of Educational Objectives.<\u002Fi> Longman, New York. <a href=\\\"https://www.loc.gov/item/00063423/\\\" target=\\\"_blank\\\" rel=\\\"noopener\\\">Library of Congress record<\u002Fa>.\",\n  \"Harden, R. M. (2002). Learning outcomes and instructional objectives: Is there a difference? <i>Medical Teacher<\u002Fi>, 24(2), 151–155. <a href=\\\"https://doi.org/10.1080/0142159022020687\\\" target=\\\"_blank\\\" rel=\\\"noopener\\\">doi:10.1080/0142159022020687<\u002Fa>.\",\n  \"Hussey, T., &amp; Smith, P. (2008). Learning outcomes: A conceptual analysis. <i>Teaching in Higher Education<\u002Fi>, 13(1), 107–115. <a href=\\\"https://doi.org/10.1080/13562510701794159\\\" target=\\\"_b y, moderation, statement, report comments and actual hours.\")) return;\n  const n=ensure(JSON.parse(JSON.stringify(c))); n.id=uid(); n.semester=\"\";\n  n.students=[]; n.marks={}; n.sessions=[]; n.feedbackLog=[];\n  n.survey={tally:{},fbTally:{},openQ:c.survey.openQ.map(q=>({q:q.q,sum:\"\"})),n:\"\"};\n  n.moderation={date:\"\",members:\"\",external:\"\",note:\"\",coverage:{}}; n.statement={date:\"\",note:\"\",signed:false};\n  n.evalT={wentWell:\"\",difficulties:\"\",attainComment:\"\",surveyComment:\"\",resComment:\"\",date:\"\"};\n  n.spec.cqiPrev=c.report.cqi.map(rec=>({rec:rec||\"\",ref:\"\"})); n.spec.submitDate=\"\";\n  n.spec.prevIneffective=Object.keys(c.report.tlaA||{}).filter(k=>[\"No\",\"Partly\"].includes((c.report.tlaA[k]||{}).eff));\n  n.report={submitDate:\"\",coComment:\"\",ploComment:\"\",feedback:\"\",surveys:\"\",hod:\"\",cqi:[\"\",\"\",\"\",\"\"],tlaA:{},res:{}}; n.vet={vetter1:\"\",vetter2:\"\"};\n  n.clos.forEach(co=>{ co.modStatement=\"\"; co.modPLO=\"\"; co.modBloom=\"\"; }); n.weeks.forEach(w=>{ w.actual=\"\"; w.reason=\"\"; }); n.filechk={};\n  n.assessments.forEach(a=>{ a.date=\"\"; a.fbDate=\"\"; a.fbMode=\"\"; });\n  state.courses.push(n); state.activeCourseId=n.id; save(); refresh(); toast(\"Copy ready — set the Semester in Course Info\");\n}\nfunction openNewCourse(){\n  const c=ensure({id:uid(),code:\"\",title:\"\",credit:\"\",semester:\"\",program:inst().program||\"\",instructor:\"\",section:\"\",clos:[],assessments:[],students:[],marks:{},cfg:defaultCfg()});\n  state.courses.push(c); state.activeCourseId=c.id; save(); renderCourseSelect(); showTab(\"course\"); toast(\"New course added — fill in the details\");\n}\nfunction deleteCourse(){\n  const c=activeCourse(); if(!c) return;\n  if(!confirm(`Delete course ${c.code||\"(untitled)\"} and ALL its data? This cannot be undone.`)) return;\n  state.courses=state.courses.filter(x=>x.id!==c.id); state.activeCourseId=state.courses.length? state.courses[0].id:null; save(); refresh(); toast(\"Course deleted\");\n}\n\n/* ============ Course Info ============ */\nfunction renderCourse(){\n  const el=document.getElementById(\"tab-course\"); const c=activeCourse(); if(!c) return noCourse(el);\n  const f=(k,l,ph,type)=>`<label class=\"fld\">${l}<input ${type?`type=\"${type}\"`:\"\"} value=\"${esc(c[k])}\" placeholder=\"${ph||\"\"}\" onchange=\"cSet('${k}',this.value)\"><\u002Flabel>`;\n  const ta=(k,l,ph)=>`<label class=\"fld\">${l}<textarea placeholder=\"${ph||\"\"}\" onchange=\"cSet('${k}',this.value)\">${esc(c[k])}<\u002Ftextarea><\u002Flabel>`;\n  el.innerHTML=`\n  ${guide(`<b>BAC Criterion 4.8<\u002Fb> — the course file must carry a course plan specifying pre-requisites, credit value, objectives, CLOs, teaching-learning and assessment methods, textbooks, reading materials and the facilities/resources needed. Everything entered here prints on the <b>Course Plan<\u002Fb> in Course File.`,\"course\")}\n  <div class=\"card\"><h2>Course Information <span class=\"crit\">Criterion 4.8<\u002Fspan><\u002Fh2><p class=\"hint\">Edits save automatically.<\u002Fp>\n    <div class=\"grid c2\">\n      ${f(\"code\",\"Course Code\",\"e.g., ENG 2101\")}${f(\"title\",\"Course Title\",\"e.g., Academic Writing\")}\n      ${f(\"credit\",\"Credit Value\",\"e.g., 3.0\")}${f(\"semester\",\"Semester / Session\",\"e.g., Spring 2026\")}\n      ${f(\"program\",\"Programme\",\"e.g., BA (Hons) in English\")}${f(\"section\",\"Section\",\"e.g., A\")}\n      ${f(\"instructor\",\"Course Teacher(s)\",\"e.g., Dr. A. Rahman\")}${f(\"prereq\",\"Pre-requisite course(s)\",\"e.g., ENG 1101 or None\")}\n      <label class=\"fld\">Course Type<select onchange=\"cSet('type',this.value)\">${[\"Core\",\"Elective\",\"General Education\",\"Foundation\",\"Capstone / Project\",\"Internship / Field work\"].map(t=>`<option ${c.type===t?\"selected\":\"\"}>${t}<\u002Foption>`).join(\"\")}<\u002Fselect><\u002Flabel>\n      <label class=\"fld\">Weeks of teaching<select onchange=\"cSet('totalWeeks',this.value,true)\">${[\"12\",\"13\",\"14\",\"15\",\"16\"].map(t=>`<option ${c.totalWeeks===t?\"selected\":\"\"}>${t}<\u002Foption>`).join(\"\")}<\u002Fselect><\u002Flabel>\n    <\u002Fdiv>\n    <div class=\"grid c2\" style=\"margin-top:12px\">\n      ${ta(\"objectives\",\"Course Objectives\",\"What the course intends to achieve (2–4 sentences)\")}\n      ${ta(\"synopsis\",\"Course Synopsis / Rationale\",\"Brief content summary and why the course is in the curriculum (Criterion 4.6 asks for a rationale)\")}\n      ${ta(\"textbooks\",\"Recommended Textbook(s)\",\"One per line\")}\n      ${ta(\"refs\",\"Reference / Reading Materials\",\"One per line\")}\n      ${ta(\"facilities\",\"Facilities & Resources Required\",\"e.g., multimedia classroom, language lab, LMS, software — resources critical to attaining the CLOs (Criterion 4.8 iii)\")}\n      ${ta(\"rubricNote\",\"Assessment criteria / rubric summary\",\"How performance is judged in assignments, presentations, projects — students must know this in advance (Criterion 5.4)\")}\n    <\u002Fdiv>\n    <h3>Contact & consultation<\u002Fh3>\n    <div class=\"grid c3\">${f(\"room\",\"Office / Room\")}${f(\"email\",\"Email\")}${f(\"consult\",\"Consultation Hours\",\"e.g., Sun & Tue 2–4 pm\")}<\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"card\"><h2>Attainment Thresholds<\u002Fh2>\n    <p class=\"hint\">A student attains a CLO when the percentage obtained on the marks allocated to that CLO reaches the <b>pass mark<\u002Fb>. The CLO is attained when the percentage of students attaining it reaches the <b>target<\u002Fb>. Defaults come from Setup.<\u002Fp>\n    <div class=\"grid c4\">\n      <label class=\"fld\">CLO pass mark (%)<input type=\"number\" min=\"0\" max=\"100\" value=\"${c.cfg.passMarks}\" onchange=\"setCfg('passMarks',this.value)\"><\u002Flabel>\n      <label class=\"fld\">Target (% of students)<input type=\"number\" min=\"0\" max=\"100\" value=\"${c.cfg.kpiTarget}\" onchange=\"setCfg('kpiTarget',this.value)\"><\u002Flabel>\n      <label class=\"fld\">Weight of direct measure (%)<input type=\"number\" min=\"0\" max=\"100\" value=\"${c.cfg.wDirect}\" onchange=\"setCfg('wDirect',this.value)\"><\u002Flabel>\n      <label class=\"fld\">Weight of survey (%) — auto<input type=\"number\" value=\"${c.cfg.wIndirect}\" disabled><\u002Flabel>\n      <label class=\"fld\">Survey rating counted as attained (1–5)<input type=\"number\" min=\"1\" max=\"5\" value=\"${c.cfg.likertPass}\" onchange=\"setCfg('likertPass',this.value)\"><\u002Flabel>\n    <\u002Fdiv>\n  <\u002Fdiv>`;\n}\nfunction setCfg(k,v){ const c=activeCourse(); if(!c) return; if(k===\"likertPass\") c.cfg[k]=Math.max(1,Math.min(5,parseInt(v)||4)); else c.cfg[k]=Math.max(0,Math.min(100,parseFloat(v)||0)); if(k===\"wDirect\"){ c.cfg.wIndirect=100-c.cfg.wDirect; renderCourse(); } save(); toast(\"Saved\"); }\n\n/* ============ CLOs & Mapping ============ */\nconst VAGUE=[[/^(know|knows)\\b|^(have|has|gain|acquire)( a| an| the)? knowledge/i,\"know\",\"identify, define, describe, explain\"],[/^(understand|comprehend|grasp)\\b/i,\"understand\",\"explain, interpret, compare, classify, apply\"],[/^(learn|learns)\\b/i,\"learn\",\"describe, apply, demonstrate\"],[/^(be|become) (aware|familiar)\\b|^appreciate\\b/i,\"be aware of / appreciate\",\"recognize, describe, evaluate\"]];\nfunction stripLead(s){ return String(s||\"\").replace(/^(after|at|by|on|upon)\\s+(the\\s+)?(successful\\s+)?(completion|end)\\s+of\\s+(this\\s+|the\\s+)?course\\s*[,:;-]?\\s*/i,\"\").replace(/^(the\\s+)?(students?|learners?)\\s+(will|should|shall|must|would)\\s+(be\\s+able\\s+to\\s+)?/i,\"\").replace(/^(be\\s+able\\s+to\\s+)/i,\"\").trim(); }\nfunction vagueWarn(text){ const t=stripLead(text); for(const [re,v,alt] of VAGUE){ if(re.test(t)) return `<p style=\"font-size:11.5px;color:var(--bad);font-weight:600;margin:4px 0 0\">⚠ “${v}” is not observable or measurable (Criterion 4.4 asks for measurable outcomes). Try: ${alt}.<\u002Fp>`; } return \"\"; }\nfunction renderCLOs(){\n  const el=document.getElementById(\"tab-clos\"); const c=activeCourse(); if(!c) return noCourse(el);\n  const P=plos();\n  el.innerHTML=`\n  ${guide(`<b>BAC Criteria 4.4, 4.6, 4.8<\u002Fb> — CLOs must be specific and measurable, aligned with the programme's PLOs, and each PLO/CLO is expected to sit within a BNQF learning-outcome domain (Fundamental · Social · Thinking · Personal). Click a matrix cell to cycle the mapping strength: blank → 1 (low) → 2 (medium) → 3 (high). The PLO list itself is managed in <b>Setup<\u002Fb>.`,\"clos\")}\n  <div class=\"card\"><h2>Course Learning Outcomes (CLOs) <span class=\"crit\">Criterion 4.4<\u002Fspan><\u002Fh2>\n    <p class=\"hint\">Start each CLO with an action verb. Choose the Bloom's level and the BNQF domain the outcome mainly develops.<\u002Fp>\n    ${c.clos.length? c.clos.map((co,i)=>`\n    <div style=\"display:grid;grid-template-columns:70px 1fr 150px 150px 36px;gap:8px;align-items:start;margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid var(--border)\">\n      <b style=\"padding-top:10px\">CLO${i+1}<\u002Fb>\n      <div><textarea class=\"in\" style=\"min-height:52px\" placeholder=\"Students will be able to …\" onchange=\"setCLO('${co.id}','text',this.value)\">${esc(co.text)}<\u002Ftextarea>${vagueWarn(co.text)}<\u002Fdiv>\n      <select class=\"in\" onchange=\"setCLO('${co.id}','bloom',this.value)\">${BLOOMS.map((b,k)=>`<option ${co.bloom===b?\"selected\":\"\"}>${b}<\u002Foption>`).join(\"\")}<\u002Fselect>\n      <select class=\"in\" title=\"${esc(DOMAIN_TIP[co.domain]||\"\")}\" onchange=\"setCLO('${co.id}','domain',this.value)\">${DOMAINS.map(d=>`<option ${co.domain===d?\"selected\":\"\"}>${d}<\u002Foption>`).join(\"\")}<\u002Fselect>\n      <button class=\"icon-btn\" title=\"Delete CLO\" onclick=\"delCLO('${co.id}')\">✕<\u002Fbutton>\n    <\u002Fdiv>`).join(\"\") : `<div class=\"empty\">No CLOs yet.<\u002Fdiv>`}\n    <div class=\"btn-row\"><button class=\"btn\" onclick=\"addCLO()\">+ Add CLO<\u002Fbutton><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"card\"><h2>CLO–PLO Mapping Matrix <span class=\"crit\">Criterion 4.6<\u002Fspan><\u002Fh2>\n    <p class=\"hint\">Hover a PLO code for its statement. 3 = the CLO contributes strongly to that PLO.<\u002Fp>\n    ${c.clos.length&&P.length? `<div class=\"tbl-wrap\"><table class=\"tbl\"><thead><tr><th>CLO<\u002Fth><th>Bloom<\u002Fth><th>Domain<\u002Fth>${P.map(p=>`<th style=\"text-align:center\" title=\"${esc(p.text)}\">${esc(p.code)}<div style=\"font-size:10px;font-weight:400;text-transform:none;letter-spacing:0\">${esc(p.domain)}<\u002Fdiv><\u002Fth>`).join(\"\")}<\u002Ftr><\u002Fthead>\n      <tbody>${c.clos.map((co,i)=>`<tr><td><b>CLO${i+1}<\u002Fb><\u002Ftd><td>${esc(co.bloom)}<\u002Ftd><td>${esc(co.domain)}<\u002Ftd>${P.map(p=>{const v=co.plo[p.code]||0;return `<td class=\"map-cell m${v}\" onclick=\"cycleMap('${co.id}','${esc(p.code)}')\">${v||\"·\"}<\u002Ftd>`;}).join(\"\")}<\u002Ftr>`).join(\"\")}\n      <tr><td colspan=\"3\"><b>PLOs addressed<\u002Fb><\u002Ftd>${P.map(p=>{const n=c.clos.filter(co=>co.plo[p.code]>0).length;return `<td style=\"text-align:center\">${n?`<span class=\"badge ink\">${n}<\u002Fspan>`:'<span class=\"badge grey\">—<\u002Fspan>'}<\u002Ftd>`;}).join(\"\")}<\u002Ftr><\u002Ftbody><\u002Ftable><\u002Fdiv>`\n      : `<div class=\"empty\">${P.length? \"Add CLOs to map them.\":\"No PLOs defined — add your programme's PLOs in Setup.\"}<\u002Fdiv>`}\n    <h3>BNQF domain coverage<\u002Fh3>\n    <div class=\"grid c4\">${DOMAINS.map(d=>{const n=c.clos.filter(co=>co.domain===d).length;return `<div style=\"border:1px solid var(--border);padding:10px\"><div style=\"font-weight:800\">${d}<\u002Fdiv><div style=\"font-size:12px;color:var(--muted)\">${DOMAIN_TIP[d]}<\u002Fdiv><div style=\"margin-top:6px\">${n?`<span class=\"badge ink\">${n} CLO${n>1?\"s\":\"\"}<\u002Fspan>`:'<span class=\"badge grey\">none<\u002Fspan>'}<\u002Fdiv><\u002Fdiv>`;}).join(\"\")}<\u002Fdiv>\n    <p class=\"hint\" style=\"margin-top:10px\">A single course need not cover all four domains; the programme as a whole must.<\u002Fp>\n  <\u002Fdiv>`;\n}\nfunction addCLO(){ const c=activeCourse(); c.clos.push({id:uid(),text:\"\",bloom:\"Apply\",domain:\"Fundamental\",plo:{},tla:[],assess:[],slt:{lec:\"\",tut:\"\",prac:\"\",self:\"\",asm:\"\"}}); save(); renderCLOs(); }\nfunction setCLO(id,k,v){ const c=activeCourse(); const co=c.clos.find(x=>x.id===id); if(!co) return; co[k]=(typeof v===\"string\")?v.trim():v; save(); if(k!==\"text\") renderCLOs(); else toast(\"Saved\"); }\nfunction delCLO(id){ const c=activeCourse(); if(!confirm(\"Delete this CLO? Assessment items tagged with it will need re-tagging.\")) return; c.clos=c.clos.filter(x=>x.id!==id); save(); renderCLOs(); }\nfunction cycleMap(id,code){ const c=activeCourse(); const co=c.clos.find(x=>x.id===id); co.plo[code]=((co.plo[code]||0)+1)%4; save(); renderCLOs(); }\n\n/* ============ Setup ============ */\nfunction renderSetup(){\n  const el=document.getElementById(\"tab-setup\"); const i=inst();\n  const f=(k,l,ph)=>`<label class=\"fld\">${l}<input value=\"${esc(i[k])}\" placeholder=\"${ph||\"\"}\" onchange=\"instSet('${k}',this.value)\"><\u002Flabel>`;\n  el.innerHTML=`\n  ${guide(`Institution-level facts used on every printed document: the POE (programme offering entity), the programme's PLOs with their BNQF domain, graduate attributes, signatory titles and the grading scale. Set these once. <b>Criterion 4.3<\u002Fb> asks that PLOs sit within the POE's mission and align with graduate attributes.`,\"setup\")}\n  <div class=\"card\"><h2>Institution & Programme Offering Entity<\u002Fh2>\n    <div class=\"grid c2\">${f(\"name\",\"Institution\",\"University name\")}${f(\"addr\",\"Address\")}${f(\"faculty\",\"Faculty / School\")}${f(\"dept\",\"Department / POE\")}${f(\"program\",\"Programme (default for new courses)\",\"e.g., BBA\")}\n      <label class=\"fld\">Degree level<select onchange=\"instSet('degree',this.value)\">${[\"Bachelor\",\"Master\",\"MPhil\",\"Doctoral\"].map(d=>`<option ${i.degree===d?\"selected\":\"\"}>${d}<\u002Foption>`).join(\"\")}<\u002Fselect><\u002Flabel>\n      <label class=\"fld\">BNQF level<select onchange=\"instSet('bnqf',this.value)\">${[\"Level 7\",\"Level 8\",\"Level 9\",\"Level 10\"].map(d=>`<option ${i.bnqf===d?\"selected\":\"\"}>${d}<\u002Foption>`).join(\"\")}<\u002Fselect><\u002Flabel>\n      <label class=\"fld\">Logo (printed on documents)<input type=\"file\" accept=\"image/*\" onchange=\"logoUpload(this)\">${i.logo? `<div style=\"margin-top:6px;display:flex;gap:10px;align-items:center\"><img src=\"${i.logo}\" style=\"height:44px;filter:grayscale(1)\"><button class=\"btn ghost small\" onclick=\"instSet('logo','')\">Remove<\u002Fbutton><\u002Fdiv>`:\"\"}<\u002Flabel>\n    <\u002Fdiv>\n    <h3>Signatory titles<\u002Fh3>\n    <div class=\"grid c4\">${Object.keys(INST_DEFAULT.roles).map(k=>`<label class=\"fld\">${k.toUpperCase()}<input value=\"${esc(i.roles[k])}\" onchange=\"instSet('roles.${k}',this.value)\"><\u002Flabel>`).join(\"\")}<\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"card\"><h2>Programme Learning Outcomes (PLOs) <span class=\"crit\">Criteria 4.3 · 4.4<\u002Fspan><\u002Fh2>\n    <p class=\"hint\">Any number of PLOs. Each carries the BNQF domain it mainly belongs to. Codes appear as matrix column headings.<\u002Fp>\n    <div class=\"tbl-wrap\"><table class=\"tbl\"><thead><tr><th style=\"width:90px\">Code<\u002Fth><th>Statement<\u002Fth><th style=\"width:150px\">BNQF domain<\u002Fth><th style=\"width:40px\"><\u002Fth><\u002Ftr><\u002Fthead><tbody>\n    ${i.plos.map((p,k)=>`<tr><td><input value=\"${esc(p.code)}\" onchange=\"ploSet(${k},'code',this.value)\"><\u002Ftd><td><textarea onchange=\"ploSet(${k},'text',this.value)\">${esc(p.text)}<\u002Ftextarea><\u002Ftd><td><select onchange=\"ploSet(${k},'domain',this.value)\">${DOMAINS.map(d=>`<option ${p.domain===d?\"selected\":\"\"}>${d}<\u002Foption>`).join(\"\")}<\u002Fselect><\u002Ftd><td><button class=\"icon-btn\" onclick=\"ploDel(${k})\">✕<\u002Fbutton><\u002Ftd><\u002Ftr>`).join(\"\")}\n    <\u002Ftbody><\u002Ftable><\u002Fdiv>\n    <div class=\"btn-row\"><button class=\"btn\" onclick=\"ploAdd()\">+ Add PLO<\u002Fbutton><button class=\"btn ghost\" onclick=\"ploReset()\">Restore sample PLOs<\u002Fbutton><\u002Fdiv>\n    <label class=\"fld\" style=\"margin-top:14px\">Graduate attributes of the programme (optional, printed on the Course Plan)<textarea placeholder=\"One per line\" onchange=\"instSet('gas',this.value)\">${esc(i.gas)}<\u002Ftextarea><\u002Flabel>\n  <\u002Fdiv>\n  <div class=\"card\"><h2>Default thresholds for new courses<\u002Fh2>\n    <div class=\"grid c4\">\n      <label class=\"fld\">CLO pass mark (%)<input type=\"number\" value=\"${i.defaults.passMarks}\" onchange=\"instSet('defaults.passMarks',+this.value)\"><\u002Flabel>\n      <label class=\"fld\">Target (% students)<input type=\"number\" value=\"${i.defaults.kpiTarget}\" onchange=\"instSet('defaults.kpiTarget',+this.value)\"><\u002Flabel>\n      <label class=\"fld\">Direct weight (%)<input type=\"number\" value=\"${i.defaults.wDirect}\" onchange=\"instSet('defaults.wDirect',+this.value)\"><\u002Flabel>\n      <label class=\"fld\">Survey rating counted (1–5)<input type=\"number\" min=\"1\" max=\"5\" value=\"${i.defaults.likertPass}\" onchange=\"instSet('defaults.likertPass',+this.value)\"><\u002Flabel>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"card\"><h2>Letter-grade scale<\u002Fh2>\n    <div class=\"tbl-wrap\"><table class=\"tbl\" style=\"max-width:560px\"><thead><tr><th>Numerical value<\u002Fth><th style=\"width:110px\">Letter grade<\u002Fth><th style=\"width:110px\">Grade point<\u002Fth><th style=\"width:40px\"><\u002Fth><\u002Ftr><\u002Fthead><tbody>\n    ${i.grades.map((g,k)=>`<tr><td><input value=\"${esc(g.v)}\" onchange=\"gradeSet(${k},'v',this.value)\"><\u002Ftd><td><input value=\"${esc(g.g)}\" onchange=\"gradeSet(${k},'g',this.value)\"><\u002Ftd><td><input value=\"${esc(g.gp)}\" onchange=\"gradeSet(${k},'gp',this.value)\"><\u002Ftd><td><button class=\"icon-btn\" onclick=\"gradeDel(${k})\">✕<\u002Fbutton><\u002Ftd><\u002Ftr>`).join(\"\")}<\u002Ftbody><\u002Ftable><\u002Fdiv>\n    <div class=\"btn-row\"><button class=\"btn secondary small\" onclick=\"gradeAdd()\">+ Row<\u002Fbutton><button class=\"btn ghost small\" onclick=\"gradeReset()\">Restore standard scale<\u002Fbutton><\u002Fdiv>\n  <\u002Fdiv>`;\n}\nfunction ploSet(k,f,v){ plos()[k][f]=String(v).trim(); save(); if(f!==\"text\") renderSetup(); }\nfunction ploAdd(){ plos().push({code:\"PLO\"+(plos().length+1),text:\"\",domain:\"Fundamental\"}); save(); renderSetup(); }\nfunction ploDel(k){ if(!confirm(\"Remove this PLO? Existing CLO mappings to its code are kept but hidden until a PLO with the same code exists.\")) return; plos().splice(k,1); save(); renderSetup(); }\nfunction ploReset(){ if(!confirm(\"Replace the PLO list with the sample list?\")) return; inst().plos=JSON.parse(JSON.stringify(INST_DEFAULT.plos)); save(); renderSetup(); }\nfunction gradeSet(k,f,v){ inst().grades[k][f]=String(v).trim(); save(); }\nfunction gradeAdd(){ inst().grades.push({v:\"\",g:\"\",gp:\"\"}); save(); renderSetup(); }\nfunction gradeDel(k){ inst().grades.splice(k,1); save(); renderSetup(); }\nfunction gradeReset(){ inst().grades=JSON.parse(JSON.stringify(INST_DEFAULT.grades)); save(); renderSetup(); }\nfunction gradeTableHTML(){ const rows=inst().grades.filter(r=>r.g||r.v); return rows.length? `<table class=\"tbl\" style=\"max-width:520px\"><thead><tr><th>Numerical value<\u002Fth><th>Letter grade<\u002Fth><th>Grade point<\u002Fth><\u002Ftr><\u002Fthead><tbody>${rows.map(r=>`<tr><td>${esc(r.v)}<\u002Ftd><td>${esc(r.g)}<\u002Ftd><td>${esc(r.gp)}<\u002Ftd><\u002Ftr>`).join(\"\")}<\u002Ftbody><\u002Ftable>`:\"\"; }\nfunction logoUpload(input){\n  const f=input.files&&input.files[0]; if(!f) return; if(!/^image\\//.test(f.type)){ alert(\"Choose an image file.\"); return; }\n  const rd=new FileReader(); rd.onload=e=>{ const src=String(e.target.result); const img=new Image();\n    img.onload=()=>{ const sc=Math.min(1,240/img.width); const cv=document.createElement(\"canvas\"); cv.width=Math.round(img.width*sc); cv.height=Math.round(img.height*sc); cv.getContext(\"2d\").drawImage(img,0,0,cv.width,cv.height); inst().logo=cv.toDataURL(\"image/png\"); save(); renderSetup(); toast(\"Logo saved\"); };\n    img.onerror=()=>{ inst().logo=src; save(); renderSetup(); }; img.src=src; };\n  rd.readAsDataURL(f); input.value=\"\";\n}\n\n\n/* ============ CQI inputs from the previous offering (shared with Course Specifications 6.1) ============ */\nfunction specRecList(c){ return (c.spec.cqiPrev||[]).map((x,i)=>({label:CQI_LOOPS[i][0].replace(/^[AB]\\. CQI Loop for /,\"\")+\" — \"+CQI_LOOPS[i][1],rec:(x.rec||\"\").trim(),ref:(x.ref||\"\").trim(),i})).filter(x=>x.rec); }\nfunction cqiOpen(tab){ window._cqiOpen=window._cqiOpen||{}; return !!window._cqiOpen[tab]; }\nfunction toggleCqiCard(tab){ window._cqiOpen=window._cqiOpen||{}; window._cqiOpen[tab]=!window._cqiOpen[tab]; renderTab(tab); }\nfunction cqiInputsCard(c,tab){\n  const recs=specRecList(c), open=cqiOpen(tab), isTla=tab===\"tla\";\n  const bad=isTla? (c.spec.prevIneffective||[]) : [];\n  const unref=recs.filter(r=>!r.ref).length;\n  const sum=recs.length\n    ? `${recs.length} recommendation${recs.length>1?\"s\":\"\"} from the previous Course Report · ${unref? `<span class=\"badge red\">${unref} not yet reflected here<\u002Fspan>`:'<span class=\"badge green\">all reflected<\u002Fspan>'}${bad.length? ` · ${bad.length} activit${bad.length>1?\"ies\":\"y\"} judged ineffective last time`:\"\"}`\n    : \"None recorded — first offering, or the previous Course Report 6.1 was empty.\";\n  return `<div class=\"card no-print\" style=\"border-top-color:var(--accent)\">\n    <h2 style=\"display:flex;align-items:center;gap:10px;flex-wrap:wrap;cursor:pointer\" onclick=\"toggleCqiCard('${tab}')\"><span style=\"font-size:12px\">${open?\"▾\":\"▸\"}<\u002Fspan> CQI Inputs from the Previous Offering <span class=\"crit\">Criterion 10.3<\u002Fspan><\u002Fh2>\n    <p class=\"hint\" style=\"margin:0\">${sum}<\u002Fp>\n    ${open? `<p class=\"hint\" style=\"margin:10px 0 0\">These are the <b>Course Specifications 6.1<\u002Fb> cells — one shared dataset with the CQI Section and the printed document, so an edit here shows up everywhere. Record in the right column what this offering's ${isTla? \"plan and activities\":\"assessment plan\"} actually does about each one; the next Course Report reviews whether it worked.<\u002Fp>\n    ${recs.length? `<div class=\"tbl-wrap\" style=\"margin-top:8px\"><table class=\"tbl\"><thead><tr><th style=\"width:210px\">Loop<\u002Fth><th>Recommended action (previous Course Report)<\u002Fth><th>Reflected in this offering<\u002Fth><\u002Ftr><\u002Fthead><tbody>${recs.map(r=>`<tr><td style=\"font-size:12px\">${r.label}<\u002Ftd><td style=\"white-space:pre-wrap;font-size:12.5px\">${esc(r.rec)}<\u002Ftd><td><textarea onchange=\"cSet('spec.cqiPrev.${r.i}.ref',this.value,true)\" placeholder=\"What was changed ${isTla? \"in the plan or activities\":\"in the assessment plan\"}\">${esc(r.ref)}<\u002Ftextarea><\u002Ftd><\u002Ftr>`).join(\"\")}<\u002Ftbody><\u002Ftable><\u002Fdiv>`\n      : `<p class=\"hint\" style=\"margin-top:8px\">Nothing to act on. Recommendations arrive automatically when a course is created with <b>Duplicate for next offering<\u002Fb>; you can also type them in the CQI Section or pull this offering's own Report 6.1 there.<\u002Fp>`}\n    ${bad.length? `<p style=\"margin-top:10px;font-size:13px\"><b>Judged ineffective or only partly effective last time:<\u002Fb> ${bad.map(b=>`<span class=\"badge red\" style=\"margin:2px\">${esc(b)}<\u002Fspan>`).join(\" \")} — reconsider or replace these.<\u002Fp>`:\"\"}\n    <div class=\"btn-row\"><button class=\"btn secondary small\" onclick=\"showTab('cqi')\">Open the CQI Section<\u002Fbutton><button class=\"btn secondary small\" onclick=\"window._doc='spec';showTab('docs')\">Open Course Specifications<\u002Fbutton><\u002Fdiv>`:\"\"}\n  <\u002Fdiv>`;\n}\n\n/* ============ T&L Plan ============ */\nfunction sltOf(co){ const s=co.slt; return [\"lec\",\"tut\",\"prac\",\"self\",\"asm\"].reduce((t,k)=>t+(parseFloat(s[k])||0),0); }\nfunction courseSLT(c){ return c.clos.reduce((t,co)=>t+sltOf(co),0); }\nfunction renderTLA(){\n  const el=document.getElementById(\"tab-tla\"); const c=activeCourse(); if(!c) return noCourse(el);\n  const credit=parseFloat(c.credit)||0, notional=credit*40;\n  const tot=courseSLT(c);\n  el.innerHTML=`\n  ${cqiInputsCard(c,\"tla\")}\n  ${guide(`<b>BAC Criterion 5.2<\u002Fb> — student learning time (SLT), teaching-learning and assessment activities must match the credit value and cover every CLO; the course plan should show the distribution of notional hours and number of classes. <b>Criterion 5.8<\u002Fb> — CLOs, activities and assessment methods must be aligned. A common working rule is about <b>40 notional hours per credit<\u002Fb> (1 credit ≈ 14 contact hours + independent learning); use your institution's own figure if it differs.`,\"tla\")}\n  <div class=\"card\"><h2>Teaching-Learning Activities per CLO <span class=\"crit\">Criterion 5.8<\u002Fspan><\u002Fh2>\n    <p class=\"hint\">Tick the activities that will develop each CLO. The alignment table in the Course File is built from these ticks and the CLO tags on your assessment items.<\u002Fp>\n    ${c.clos.length? c.clos.map((co,i)=>`<div style=\"border-bottom:1px solid var(--border);padding:10px 0\"><div style=\"display:flex;gap:10px;align-items:baseline;flex-wrap:wrap\"><b>CLO${i+1}<\u002Fb><span style=\"font-size:13px;color:var(--muted);flex:1\">${esc(co.text)||\"<i>no statement yet<\u002Fi>\"}<\u002Fspan><span class=\"badge grey\">${esc(co.bloom)} · ${esc(co.domain)}<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:6px\">${TLA_POOL.map(t=>`<label class=\"chk\" title=\"${esc(TIPS[t]||\"\")}\"><input type=\
