ort\",\"(To be submitted to the \"+esc(role(\"coord\"))+\" at the end of the semester)\")+`\n  <h2>1. General Information<\u002Fh2>${courseInfoTable(c,'report.submitDate',r.submitDate)}\n  <h2>2. Learning Outcomes<\u002Fh2><h2>2.1 Analysis of existing CLOs, PLOs and Bloom's levels<\u002Fh2>\n  <table class=\"tbl\"><thead><tr><th rowspan=\"2\" style=\"width:50px\">CLO<\u002Fth><th colspan=\"3\">Existing<\u002Fth><th colspan=\"3\">Modification (if needed for constructive alignment)<\u002Fth><\u002Ftr><tr><th>Statement<\u002Fth><th style=\"width:80px\">PLO<\u002Fth><th style=\"width:100px\">Bloom's<\u002Fth><th>Statement<\u002Fth><th style=\"width:70px\">PLO<\u002Fth><th style=\"width:80px\">Bloom's<\u002Fth><\u002Ftr><\u002Fthead><tbody>${c.clos.map((co,i)=>`<tr><td><b>CLO${i+1}<\u002Fb><\u002Ftd><td>${esc(co.text)}<\u002Ftd><td>${ploCodesOf(co)||\"—\"}<\u002Ftd><td>${cloBloom(co)}<\u002Ftd><td>${di('clos.'+i+'.modStatement',co.modStatement,'(if modification needed)')}<\u002Ftd><td>${di('clos.'+i+'.modPLO',co.modPLO,'PLO')}<\u002Ftd><td>${di('clos.'+i+'.modBloom',co.modBloom,'C1–C6')}<\u002Ftd><\u002Ftr>`).join(\"\")||'<tr><td colspan=\"7\">—<\u002Ftd><\u002Ftr>'}<\u002Ftbody><\u002Ftable>\n  <h2>3. Teaching &amp; Learning Activities<\u002Fh2><h2>3.1 Analysis of Contact Hours<\u002Fh2>\n  <table class=\"tbl\"><thead><tr><th style=\"width:50px\">Week<\u002Fth><th>Topics<\u002Fth><th style=\"width:80px\">Planned<\u002Fth><th style=\"width:80px\">Actual<\u002Fth><th style=\"width:90px\">Variation<\u002Fth><th>Reason for variation above 25%<\u002Fth><\u002Ftr><\u002Fthead><tbody>${c.weeks.filter(w=>w.topic).map((w,k)=>{const p=parseFloat(w.hrs)||0,has=String(w.actual||\"\").trim()!==\"\",a=parseFloat(w.actual)||0,v=(p&&has)?(a-p)/p*100:null,over=v!==null&&Math.abs(v)>25;return `<tr><td>${c.weeks.indexOf(w)+1}<\u002Ftd><td>${esc(w.topic)}<\u002Ftd><td style=\"text-align:center\">${esc(w.hrs)}<\u002Ftd><td><input class=\"di\" style=\"width:60px;text-align:center\" value=\"${esc(w.actual||\"\")}\" onchange=\"cSet('weeks.${c.weeks.indexOf(w)}.actual',this.value,true)\"><\u002Ftd><td style=\"text-align:center\">${v===null?\"—\":v.toFixed(1)+\"%\"}<\u002Ftd><td>${over? di('weeks.'+c.weeks.indexOf(w)+'.reason',w.reason||'','Reason'):\"\"}<\u002Ftd><\u002Ftr>`;}).join(\"\")||'<tr><td colspan=\"6\">Fill the weekly plan first<\u002Ftd><\u002Ftr>'}<tr><td><\u002Ftd><th style=\"text-align:right\">Total<\u002Fth><th style=\"text-align:center\">${tp}<\u002Fth><th style=\"text-align:center\">${ta||\"—\"}<\u002Fth><td colspan=\"2\"><\u002Ftd><\u002Ftr><\u002Ftbody><\u002Ftable>\n  <h2>3.2 Analysis of Teaching &amp; Learning Activities<\u002Fh2>\n  <table class=\"tbl\"><thead><tr><th style=\"width:220px\">Activity<\u002Fth><th style=\"width:100px;text-align:center\">Effective?<\u002Fth><th>Difficulties (if any) and suggestions for improvement<\u002Fth><\u002Ftr><\u002Fthead><tbody>${adoptedActs(c).map(a=>{const v=r.tlaA[a.name]||{};return `<tr><td>${esc(a.name)}<div style=\"font-size:11px;color:var(--muted)\">${a.clos.join(\", \")}<\u002Fdiv><\u002Ftd><td><select class=\"di\" onchange=\"setTlaA(${JSON.stringify(a.name).replace(/\"/g,\"&quot;\")},'eff',this.value)\"><option value=\"\"><\u002Foption><option ${v.eff===\"Yes\"?\"selected\":\"\"}>Yes<\u002Foption><option ${v.eff===\"Partly\"?\"selected\":\"\"}>Partly<\u002Foption><option ${v.eff===\"No\"?\"selected\":\"\"}>No<\u002Foption><\u002Fselect><\u002Ftd><td>${cell(a.name,'diff',v.diff)}<\u002Ftd><\u002Ftr>`;}).join(\"\")||'<tr><td colspan=\"3\">Tick activities per CLO in the T&amp;L Section<\u002Ftd><\u002Ftr>'}<\u002Ftbody><\u002Ftable>\n  <h2>3.3 Analysis of the Resources<\u002Fh2>\n  <table class=\"tbl\"><thead><tr><th>Resource<\u002Fth><th style=\"width:100px;text-align:center\">Adequate?<\u002Fth><th>Remarks<\u002Fth><\u002Ftr><\u002Fthead><tbody>${RES_ROWS.map(([k,l])=>{const v=r.res[k]||{};return `<tr><td>${l}<\u002Ftd><td><select class=\"di\" onchange=\"setRes('${k}','ok',this.value)\"><option value=\"\"><\u002Foption><option ${v.ok===\"Yes\"?\"selected\":\"\"}>Yes<\u002Foption><option ${v.ok===\"No\"?\"selected\":\"\"}>No<\u002Foption><\u002Fselect><\u002Ftd><td>${di('report.res.'+k+'.rm',v.rm||'','')}<\u002Ftd><\u002Ftr>`;}).join(\"\")}<\u002Ftbody><\u002Ftable>\n  <h2>3.4 Teacher's Overall Evaluation of the Offering <span style=\"font-weight:400;font-size:11px;text-transform:none;letter-spacing:0\">(BAC Criterion 10.2)<\u002Fspan><\u002Fh2>\n  <p><b>What went well<\u002Fb> ${dta('evalT.wentWell',e.wentWell,2)}<\u002Fp><p><b>Difficulties faced<\u002Fb> ${dta('evalT.difficulties',e.difficulties,2)}<\u002Fp>\n  <h2>4. Direct Assessments<\u002Fh2><p><b>4.1 Grade Distribution<\u002Fb> <span style=\"font-size:11.5px;color:var(--muted)\">(computed from total marks against the institutional scale)<\u002Fspan><\u002Fp>\n  <table class=\"tbl\"><thead><tr><th>Grade<\u002Fth>${inst().grades.map(g=>`<th style=\"text-align:center\">${esc(g.g)}<\u002Fth>`).join(\"\")}<th>Total<\u002Fth><\u002Ftr><\u002Fthead><tbody><tr><th>No. of students<\u002Fth>${inst().grades.map(g=>`<td style=\"text-align:center\">${gradeCount(c,g)}<\u002Ftd>`).join(\"\")}<td style=\"text-align:center\">${c.students.length}<\u002Ftd><\u002Ftr><tr><th>% of students<\u002Fth>${inst().grades.map(g=>{const n=gradeCount(c,g);return `<td style=\"text-align:center\">${(typeof n===\"number\"&&c.students.length)? (n/c.students.length*100).toFixed(1):\"—\"}<\u002Ftd>`;}).join(\"\")}<td><\u002Ftd><\u002Ftr><\u002Ftbody><\u002Ftable>\n  <h2>4.2 Analysis of Course Learning Outcomes<\u002Fh2><p style=\"font-size:12.5px\">Target: ${c.cfg.kpiTarget}% of students at or above the pass mark ${c.cfg.passMarks}%<\u002Fp>\n  <table class=\"tbl\"><thead><tr><th><\u002Fth>${att.clos.map(x=>`<th style=\"text-align:center\">${x.label}<\u002Fth>`).join(\"\")}<\u002Ftr><\u002Fthead><tbody><tr><th>% of students at or above the pass mark<\u002Fth>${att.clos.map(x=>`<td style=\"text-align:center\">${x.nWith? x.pctStu:\"—\"}<\u002Ftd>`).join(\"\")}<\u002Ftr><tr><th>Attained?<\u002Fth>${att.clos.map(x=>`<td style=\"text-align:center\">${x.nWith? (x.attained?\"Yes\":\"No\"):\"—\"}<\u002Ftd>`).join(\"\")}<\u002Ftr><\u002Ftbody><\u002Ftable>\n  ${att.clos.some(x=>x.nWith)? `<div style=\"margin:10px 0\">${barChart(att.clos,c.cfg.kpiTarget,\"pctStu\")}<\u002Fdiv>`:\"\"}\n  <p><b>Comments on CLO attainment<\u002Fb> ${dta('report.coComment',r.coComment,3,\"Name every CLO below target and the likely cause — teaching, assessment design or student preparation\")}<\u002Fp>\n  <h2>4.3 Analysis of the Contribution to Programme Learning Outcomes<\u002Fh2>\n  ${P.length? `<table class=\"tbl\"><thead><tr><th><\u002Fth>${P.map(x=>`<th style=\"text-align:center\">${esc(x.code)}<\u002Fth>`).join(\"\")}<\u002Ftr><\u002Fthead><tbody><tr><th>Contribution (%)<\u002Fth>${P.map(x=>`<td style=\"text-align:center\">${x.pctStu}<\u002Ftd>`).join(\"\")}<\u002Ftr><tr><th>Attained?<\u002Fth>${P.map(x=>`<td style=\"text-align:center\">${x.attained?\"Yes\":\"No\"}<\u002Ftd>`).join(\"\")}<\u002Ftr><\u002Ftbody><\u002Ftable>`:'<p class=\"hint\">Map CLOs to PLOs first.<\u002Fp>'}\n  <p><b>Comments on PLO contribution<\u002Fb> ${dta('report.ploComment',r.ploComment,2)}<\u002Fp>\n  ${fbRows.length? `<h2>4.4 Feedback Returned to Students <span style=\"font-weight:400;font-size:11px;text-transform:none;letter-spacing:0\">(BAC Criterion 5.5)<\u002Fspan><\u002Fh2><table class=\"tbl\"><thead><tr><th>Assessment<\u002Fth><th style=\"width:110px\">Held<\u002Fth><th style=\"width:130px\">Results returned<\u002Fth><th>How feedback was given<\u002Fth><\u002Ftr><\u002Fthead><tbody>${fbRows.map(a=>`<tr><td>${esc(a.name||a.type)}<\u002Ftd><td>${esc(a.date)||\"—\"}<\u002Ftd><td>${esc(a.fbDate)||\"—\"}<\u002Ftd><td>${esc(a.fbMode)||\"—\"}<\u002Ftd><\u002Ftr>`).join(\"\")}<\u002Ftbody><\u002Ftable>`:\"\"}\n  <h2>5. Indirect Assessments<\u002Fh2><p><b>5.1 Analysis of Student Feedback — Course Evaluation Survey${c.survey.n? \" (n = \"+esc(c.survey.n)+\")\":\"\"}<\u002Fb><\u002Fp>\n  ${att.clos.some(x=>x.ind!==null)? `<table class=\"tbl\"><thead><tr><th><\u002Fth>${att.clos.map(x=>`<th style=\"text-align:center\">${x.label}<\u002Fth>`).join(\"\")}<\u002Ftr><\u002Fthead><tbody><tr><th>Responses (n)<\u002Fth>${att.clos.map(x=>`<td style=\"text-align:center\">${x.nS||\"—\"}<\u002Ftd>`).join(\"\")}<\u002Ftr><tr><th>% rated ≥ ${c.cfg.likertPass}<\u002Fth>${att.clos.map(x=>`<td style=\"text-align:center\">${x.ind===null?\"—\":x.ind}<\u002Ftd>`).join(\"\")}<\u002Ftr><tr><th>Attained (vs target ${c.cfg.kpiTarget}%)?<\u002Fth>${att.clos.map(x=>`<td style=\"text-align:center\">${x.ind===null?\"—\":(x.ind>=c.cfg.kpiTarget?\"Yes\":\"No\")}<\u002Ftd>`).join(\"\")}<\u002Ftr><\u002Ftbody><\u002Ftable>\n  <table class=\"tbl\" style=\"max-width:640px;margin-top:8px\"><thead><tr><th>Course feedback item<\u002Fth><th style=\"width:90px\">Mean (1–5)<\u002Fth><\u002Ftr><\u002Fthead><tbody>${FB_ITEMS.map(([k,q])=>`<tr><td style=\"font-size:12.5px\">${q}<\u002Ftd><td style=\"text-align:center\">${fbMean(k)}<\u002Ftd><\u002Ftr>`).join(\"\")}<\u002Ftbody><\u002Ftable>\n  ${c.survey.openQ.filter(q=>q.sum).map(q=>`<p style=\"font-size:12.5px\"><b>${esc(q.q)}:<\u002Fb> ${esc(q.sum)}<\u002Fp>`).join(\"\")}`:`<p style=\"font-size:12.5px;color:var(--muted)\">No survey data recorded — enter the response counts in Attainment → Student Survey.<\u002Fp>`}\n  <p><b>Comments on the student feedback<\u002Fb> ${dta('report.feedback',r.feedback,2)}<\u002Fp>\n  <p><b>5.2 Analysis of other surveys / meeting minutes / reports related to the course (if any)<\u002Fb> ${dta('report.surveys',r.surveys,2)}<\u002Fp>\n  <p><b>5.3 Combined Attainment (Direct ${c.cfg.wDirect}% + Indirect ${c.cfg.wIndirect}%) vs target ${c.cfg.kpiTarget}%<\u002Fb><\u002Fp>\n  ${att.clos.some(x=>x.nWith)? `<table class=\"tbl\"><thead><tr><th><\u002Fth>${att.clos.map(x=>`<th style=\"text-align:center\">${x.label}<\u002Fth>`).join(\"\")}<\u002Ftr><\u002Fthead><tbody><tr><th>Combined attainment (%)<\u002Fth>${att.clos.map(x=>`<td style=\"text-align:center\">${x.nWith? x.comb:\"—\"}<\u002Ftd>`).join(\"\")}<\u002Ftr><tr><th>Attained?<\u002Fth>${att.clos.map(x=>`<td style=\"text-align:center\">${x.nWith? (x.combAtt?\"Yes\":\"No\"):\"—\"}<\u002Ftd>`).join(\"\")}<\u002Ftr><\u002Ftbody><\u002Ftable>\n  ${P.length? `<table class=\"tbl\" style=\"margin-top:8px\"><thead><tr><th><\u002Fth>${P.map(x=>`<th style=\"text-align:center\">${esc(x.code)}<\u002Fth>`).join(\"\")}<\u002Ftr><\u002Fthead><tbody><tr><th>Combined contribution (%)<\u002Fth>${P.map(x=>`<td style=\"text-align:center\">${x.comb}<\u002Ftd>`).join(\"\")}<\u002Ftr><tr><th>Attained?<\u002Fth>${P.map(x=>`<td style=\"text-align:center\">${x.comb>=c.cfg.kpiTarget?\"Yes\":\"No\"}<\u002Ftd>`).join(\"\")}<\u002Ftr><\u002Ftbody><\u002Ftable>`:\"\"}`:`<p style=\"font-size:12.5px;color:var(--muted)\">Available once marks are entered.<\u002Fp>`}\n  <h2>6. Continuous Quality Improvement (CQI) Loops — 6.1 Suggested Action Plans <span class=\"badge grey no-print\">⛓ linked — also editable in the CQI Section<\u002Fspan><\u002Fh2>\n  <table class=\"tbl\"><thead><tr><th style=\"width:140px\">Loop<\u002Fth><th style=\"width:180px\">Assessment type<\u002Fth><th>Recommended actions for quality improvement<\u002Fth><\u002Ftr><\u002Fthead><tbody>${CQI_LOOPS.map((L,i)=>`<tr><td>${L[0]}<\u002Ftd><td>${L[1]}<\u002Ftd><td>${dta('report.cqi.'+i,r.cqi[i],6)}<\u002Ftd><\u002Ftr>`).join(\"\")}<\u002Ftbody><\u002Ftable>\n  <p style=\"margin-top:16px\">Signature of the Course Teacher: __________________ &nbsp; Date: __________<br>Name: ${esc(c.instructor)}<\u002Fp>\n  <h2>7. Approval from the ${esc(role(\"hod\"))}<\u002Fh2><p><b>7.1 Comments from the ${esc(role(\"hod\"))}<\u002Fb> ${dta('report.hod',r.hod,2)}<\u002Fp>\n  <p><br>Signature of the ${esc(role(\"hod\"))}: __________________ &nbsp; Date: __________<br>Name: ______________________________<\u002Fp>`;\n}\nfunction setTlaA(name,f,v){ const r=activeCourse().report; r.tlaA[name]=r.tlaA[name]||{}; r.tlaA[name][f]=String(v).trim(); save(); toast(\"Saved\"); }\nfunction setRes(k,f,v){ const r=activeCourse().report; r.res[k]=r.res[k]||{}; r.res[k][f]=String(v).trim(); save(); toast(\"Saved\"); }\n/* ---- Course-file records ---- */\nfunction docAlign(c){\n  const items=allItems(c), P=plos(), tName=c.instructor||\"Course Teacher\";\n  return docHead(c,\"Alignment of CLOs, Teaching-Learning Activities and Assessment\",\"BAC Criterion 5.8\")+`\n  <table class=\"tbl\"><thead><tr><th style=\"width:60px\">CLO<\u002Fth><th>Statement<\u002Fth><th>Bloom level · Domain<\u002Fth><th>Teaching-learning activities<\u002Fth><th>Assessment items (marks)<\u002Fth><th>PLO(s)<\u002Fth><\u002Ftr><\u002Fthead><tbody>${c.clos.map((co,i)=>{const its=items.filter(it=>it.cloId===co.id);return `<tr><td><b>CLO${i+1}<\u002Fb><\u002Ftd><td>${esc(co.text)}<\u002Ftd><td>${esc(co.bloom)} · ${esc(co.domain)}<\u002Ftd><td>${esc(co.tla.concat(co.tlaOther?[co.tlaOther]:[]).join(\", \"))||'<span class=\"badge red\">none<\u002Fspan>'}<\u002Ftd><td>${its.map(it=>`${esc(it.aName)} ${esc(it.label)} (${esc(it.max)})`).join(\"; \")||'<span class=\"badge red\">none<\u002Fspan>'}<\u002Ftd><td>${P.filter(p=>co.plo[p.code]>0).map(p=>esc(p.code)).join(\", \")||\"—\"}<\u002Ftd><\u002Ftr>`;}).join(\"\")}<\u002Ftbody><\u002Ftable>\n  <p style=\"margin-top:10px;font-size:12.5px\">Every CLO is taught through at least one activity and measured by at least one assessment item; assessment levels do not exceed the CLO's Bloom level.<\u002Fp>\n  ${sig([`${esc(tName)}<br>Course Teacher`,esc(role(\"hod\"))])}`;\n}\nfunction docAttend(c){\n  const held=c.sessions.filter(s=>!s.cancelled), tName=c.instructor||\"Course Teacher\";\n  return docHead(c,\"Class Schedule, Attendance and Make-up Class Record\",\"BAC Criterion 5.3\")+`\n  <p><b>Approved routine:<\u002Fb> ${esc(c.routineRef)||\"—\"} &nbsp; <b>Enrolled students:<\u002Fb> ${c.students.length}<\u002Fp>\n  <table class=\"tbl\"><thead><tr><th>#<\u002Fth><th>Date<\u002Fth><th>Kind<\u002Fth><th>Topic / CLO(s)<\u002Fth><th>Present<\u002Fth><th>%<\u002Fth><th>Status<\u002Fth><th>Note<\u002Fth><\u002Ftr><\u002Fthead><tbody>${c.sessions.map((s,i)=>`<tr><td>${i+1}<\u002Ftd><td>${esc(s.date)}<\u002Ftd><td>${esc(s.kind)}<\u002Ftd><td>${esc(s.topic)}<\u002Ftd><td>${s.cancelled?\"—\":esc(s.present)}<\u002Ftd><td>${s.cancelled||!c.students.length?\"—\":Math.round((parseFloat(s.present)||0)/c.students.length*100)+\"%\"}<\u002Ftd><td>${s.cancelled?\"Cancelled\":(s.makeup?\"Make-up class\":\"Held\")}<\u002Ftd><td>${esc(s.note)}<\u002Ftd><\u002Ftr>`).join(\"\")}<\u002Ftbody>\n  <tfoot><tr><td colspan=\"8\"><b>Sessions held ${held.length} · cancelled ${c.sessions.length-held.length} · make-up ${c.sessions.filter(s=>s.makeup).length}<\u002Fb><\u002Ftd><\u002Ftr><\u002Ftfoot><\u002Ftable>\n  <p style=\"font-size:12.5px;margin-top:8px\">Signed attendance sheets for each session and copies of make-up class notices are filed behind this record.<\u002Fp>\n  ${sig([`${esc(tName)}<br>Course Teacher`,esc(role(\"hod\"))])}`;\n}\nfunction docFbk(c){\n  return docHead(c,\"Record of Timely Feedback on Continuous Assessments\",\"BAC Criterion 5.5\")+`\n  <table class=\"tbl\"><thead><tr><th>Assessment<\u002Fth><th>Type<\u002Fth><th>CLO(s)<\u002Fth><th>Date held<\u002Fth><th>Feedback given on<\u002Fth><th>Days<\u002Fth><th>Mode of feedback<\u002Fth><\u002Ftr><\u002Fthead><tbody>${c.assessments.map(a=>`<tr><td>${esc(a.name||a.type)}<\u002Ftd><td>${esc(a.type)}<\u002Ftd><td>${[...new Set(a.items.map(it=>cloLabel(c,it.cloId)))].join(\", \")}<\u002Ftd><td>${esc(a.date)}<\u002Ftd><td>${esc(a.fbDate)}<\u002Ftd><td>${a.date&&a.fbDate? fbDays(a):\"\"}<\u002Ftd><td>${esc(a.fbMode)}<\u002Ftd><\u002Ftr>`).join(\"\")}<\u002Ftbody><\u002Ftable>\n  ${sig([`${esc(c.instructor||\"Course Teacher\")}<br>Course Teacher`])}`;\n}\nfunction docStmt(c){\n  const s=c.statement, items=allItems(c), tName=c.instructor||\"Course Teacher\"; const noTla= bric)||!!c.rubricNote,\n    eval:!!(c.evalT.wentWell||c.evalT.difficulties||c.report.coComment),\n    fbk:!!(c.survey.n||Object.keys(c.survey.tally).length),\n    clo:att.clos.some(r=>r.nWith),\n    plan:c.report.cqi.some(x=>x)};\n  const UGC=[\n    [\"outline\",\"Course outline\",\"Documents → Course Outline (UGC format, Parts A–D)\",auto.outline],\n    [\"lecture\",\"Lecture materials / notes\",\"filed separately — slides, handouts, notes per week\",null],\n    [\"attend\",\"Attendance sheet\",\"Documents → Attendance &amp; Make-up Record; signed sheets filed behind it\",auto.attend],\n    [\"assign\",\"Assignments — copies of best, mediocre and poor\",\"filed separately\",null],\n    [\"tests\",\"Class tests / quizzes / mid-term etc. — copies of best, mediocre and poor\",\"filed separately\",null],\n    [\"qp\",\"Copies of question papers / assessment tools\",\"Assessments Section records the plan; papers filed separately. Final paper: Documents → Final Exam Vetting Form\",auto.qp],\n    [\"rubric\",\"Rubrics for assessment\",\"Assessments Section (rubric shared) and Course Info → assessment criteria\",auto.rubric],\n    [\"eval\",\"Course evaluation by the course teacher considering feedback from the students\",\"Documents → Course Report §3.4, §4.2, §5.1\",auto.eval],\n    [\"fbk\",\"Feedback from the students on the course\",\"Documents → Course Evaluation Survey; responses in Attainment → Student Survey\",auto.fbk],\n    [\"peer\",\"Peer review\",\"Done / Not done — recorded here\",null],\n    [\"clo\",\"Evaluation of attainment of CLOs\",\"Documents → Direct CLO–PLO Calculations; Course Report §4.2, §5.3\",auto.clo],\n    [\"plan\",\"Improvement plan for better attainment of CLOs\",\"Documents → Course Report §6.1 (CQI action plans)\",auto.plan]];\n  const BAC=[\n    [\"spec\",\"Course Specifications submitted before the semester\",\"4.8, 5.2, 5.8\"],\n    [\"align\",\"CLO–TLA–assessment alignment record\",\"5.8\"],\n    [\"routine\",\"Approved class routine Item<\u002Fth><th style=\"width:250px\">Where it is produced in CM<\u002Fth><th style=\"width:70px\">In file<\u002Fth><th style=\"width:150px\">Remarks<\u002Fth><\u002Ftr><\u002Fthead><tbody>\n    ${UGC.map(([k,l,src,rdy],idx)=>k===\"peer\"\n      ? `<tr><td>${idx+1}<\u002Ftd><td>${l}<\u002Ftd><td style=\"font-size:11.5px;color:var(--muted)\">${src}<\u002Ftd><td style=\"text-align:center\"><select class=\"di\" onchange=\"cSet('peerReview',this.value,true)\"><option value=\"\"><\u002Foption><option ${c.peerReview===\"Done\"?\"selected\":\"\"}>Done<\u002Foption><option ${c.peerReview===\"Not done\"?\"selected\":\"\"}>Not done<\u002Foption><\u002Fselect><\u002Ftd><td>${di('filenote.'+k,c.filenote[k]||'','Reviewer, date')}<\u002Ftd><\u002Ftr>`\n      : `<tr><td>${idx+1}<\u002Ftd><td>${l}<\u002Ftd><td style=\"font-size:11.5px;color:var(--muted)\">${src}<\u002Ftd>${tick(k,rdy)}<td>${di('filenote.'+k,c.filenote[k]||'','')}<\u002Ftd><\u002Ftr>`).join(\"\")}\n  <\u002Ftbody><\u002Ftable><\u002Fdiv>\n  <p style=\"font-size:11.5px;color:var(--muted)\">“ready” marks an item whose content is already complete inside CM and only needs printing into the file.<\u002Fp>\n  <h2>B. Additional evidence for BAC accreditation — ${doneB}/${BAC.length} present<\u002Fh2>\n  <div class=\"tbl-wrap\"><table class=\"tbl\"><thead><tr><th style=\"width:36px\">#<\u002Fth><th>Document<\u002Fth><th style=\"width:110px\">Criterion<\u002Fth><th style=\"width:70px\">In file<\u002Fth><th style=\"width:150px\">Remarks<\u002Fth><\u002Ftr><\u002Fthead><tbody>\n    ${BAC.map(([k,l,cr],idx)=>`<tr><td>${idx+1}<\u002Ftd><td>${esc(l)}<\u002Ftd><td>${cr}<\u002Ftd>${tick(k)}<td>${di('filenote.'+k,c.filenote[k]||'','')}<\u002Ftd><\u002Ftr>`).join(\"\")}\n  <\u002Ftbody><\u002Ftable><\u002Fdiv>\n  ${sig([`${esc(tName)}<br>Course Teacher`,esc(role(\"coord\")),esc(role(\"hod\"))])}`;\n}\nfunction gradeCount(c,g){\n  const items=allItems(c); const max=items.reduce((s,it)=>s+(parseFloat(it.max)||0),0); if(!max) return \"—\";\n  const bounds=parseBounds(g.v); if(!bounds) return \"—\";\n  return c.students.filter(s=>{ const m=c.marks[s.id]||{}; const p=items.reduce((t,it)=>t+(parseFloat(m[it.id])||0),0)/max*100; return p>=bounds[0]&&p<bounds[1]; }).length;\n}\nfunction parseBounds(v){ v=String(v); const nums=v.match(/\\d+(\\.\\d+)?/g); if(!nums) return null; if(/below|less than/i.test(v)&&nums.length===1) return [-1,parseFloat(nums[0])]; if(/above|and above|or more/i.test(v)&&nums.length===1) return [parseFloat(nums[0]),1000]; if(nums.length>=2) return [parseFloat(nums[0]),parseFloat(nums[1])]; return null; }\n\n/* ============ Data & Backup ============ */\nfunction renderData(){\n  const el=document.getElementById(\"tab-data\");\n  el.innerHTML=`\n  ${guide(`Unless you link a file or a Drive file, everything you enter lives in this browser's storage alone — and clearing browser data removes anything never exported. Link a data file or Google Drive from the <b>File<\u002Fb> menu so every change is written somewhere durable, and still export the JSON at the end of each semester: that export is what a department needs if course data is consolidated for accreditation reporting.`,\"data\")}\n  <div class=\"card\"><h2>Where this data lives<\u002Fh2>\n    <p class=\"hint\">Three options, all available from the <b>File<\u002Fb> menu in the header. Browser storage is always kept as a working copy; a file or Drive gives you the durable record.<\u002Fp>\n    <table class=\"tbl\"><tbody>\n      <tr><th style=\"width:210px\">This browser<\u002Fth><td>Always on. Survives a reload, but is lost if browser data is cleared. <span class=\"badge ${(drive||fileHandle)?\"grey\":\"green\"}\">${(drive||fileHandle)? \"working copy\":\"in use\"}<\u002Fspan><\u002Ftd><\u002Ftr>\n      <tr><th>A file on this computer<\u002Fth><td>${FS_OK? (fileHandle? `Linked to <b>${esc(fileHandle.name)}<\u002Fb> ${filePermOk? '<span class=\"badge green\">auto-saving<\u002Fspan>':'<span class=\"badge amber\">reconnect needed<\u002Fspan>'}`:\"Work directly on a .json file, the way Word works on a .docx — every change auto-saves to it.\") : \"Needs Chrome or Edge on a desktop; this browser does not support direct file access.\"}<\u002Ftd><\u002Ftr>\n      <tr><th>Google Drive<\u002Fth><td>${drive? `Linked to <b>${esc(drive.name)}<\u002Fb> ${driveConflict? '<span class=\"badge red\">changed elsewhere — choose a version in the File menu<\u002Fspan>':'<span class=\"badge green\">syncing<\u002Fspan>'}`:(driveConfigured()? \"Set up. Use <b>File ▸ Open from Google Drive…<\u002Fb> or <b>Save to Google Drive as…<\u002Fb>\":\"Not set up. Needs your institution's own Google OAuth Client ID — no credentials are bundled with the app.\")}<\u002Ftd><\u002Ftr>\n    <\u002Ftbody><\u002Ftable>\n    <div class=\"btn-row\">\n      ${FS_OK? `<button class=\"btn secondary\" onclick=\"openDataFile()\">📁 Open Data File…<\u002Fbutton><button class=\"btn secondary\" onclick=\"saveAsDataFile()\">💾 Save to New File…<\u002Fbutton>${fileHandle&&!filePermOk? '<button class=\"btn secondary\" onclick=\"reconnectFile()\">🔗 Reconnect<\u002Fbutton>':\"\"}${fileHandle? '<button class=\"btn danger\" onclick=\"unlinkFile()\">Stop Using the Data File<\u002Fbutton>':\"\"}`:\"\"}\n      ${driveConfigured()? `<button class=\"btn secondary\" onclick=\"driveOpen()\">☁ Open from Google Drive…<\u002Fbutton><button class=\"btn secondary\" onclick=\"driveSaveAs()\">☁ Save to Google Drive as…<\u002Fbutton>${drive? '<button class=\"btn danger\" onclick=\"driveUnlink()\">Stop Using the Drive File<\u002Fbutton>':\"\"}`:`<button class=\"btn\" onclick=\"driveSetup()\">☁ Set up Google Drive…<\u002Fbutton>`}\n      <button class=\"btn ghost\" onclick=\"driveSetup()\">Drive client ID…<\u002Fbutton>\n    <\u002Fdiv>\n    <p class=\"hint\" style=\"margin-top:10px\">Drive setup, once per institution: Google Cloud Console → enable the <b>Google Drive API<\u002Fb> → Credentials → <b>OAuth client ID<\u002Fb> (Web application) → add this page's address (<code>${esc(location.origin)}<\u002Fcode>) as an authorized JavaScript origin → paste the Client ID here. CM requests only the <code>drive.file<\u002Fcode> scope, so it can see nothing in your Drive except the files it created or you opened through it.<\u002Fp>\n  <\u002Fdiv>\n  <div class=\"card\"><h2>Backup & Restore<\u002Fh2><p class=\"hint\">Everything lives in this browser's storage. Export a JSON backup regularly and after every marks session; import it on another device to continue.<\u002Fp>\n    <div class=\"btn-row\"><button class=\"btn\" onclick=\"exportAll()\">Export all data (JSON)<\u002Fbutton><label class=\"btn secondary\" style=\"cursor:pointer\">Import backup<input type=\"file\" accept=\".json,application/json\" style=\"display:none\" onchange=\"importAll(this,false)\"><\u002Flabel><label class=\"btn secondary\" style=\"cursor:pointer\">Merge courses from a backup<input type=\"file\" accept=\".json,application/json\" style=\"display:none\" onchange=\"importAll(this,true)\"><\u002Flabel><\u002Fdiv>\n    <p class=\"hint\" style=\"margin-top:10px\">${state.courses.length} course(s) stored · ${Math.round((localStorage.getItem(STORE_KEY)||\"\").length/1024)} KB in this browser. Ctrl+S (⌘S) flushes everything to the linked file or Drive at once.<\u002Fp>\n  <\u002Fdiv>\n  <div class=\"card\"><h2>Demonstration<\u002Fh2><div class=\"btn-row\" style=\"margin:0\"><button class=\"btn secondary\" onclick=\"loadDemo()\">Load demonstration course<\u002Fbutton><\u002Fdiv><\u002Fdiv>\n  <div class=\"card\"><h2>Danger zone<\u002Fh2><div class=\"btn-row\" style=\"margin:0\"><button class=\"btn danger\" onclick=\"wipeAll()\">Erase everything in this browser<\u002Fbutton><\u002Fdiv><\u002Fdiv>`;\n}\nfunction exportAll(){ download(\"course-manager-backup-\"+todayISO()+\".json\",JSON.stringify(state,null,1),\"application/json\"); toast(\"Backup downloaded\"); }\nfunction importAll(input,merge){\n  const f=input.files&&input.files[0]; if(!f) return; const rd=new FileReader();\n  rd.onload=e=>{ try{ const d=JSON.parse(String(e.target.result)); if(!d||!Array.isArray(d.courses)) throw 0;\n      if(merge){ let n=0; d.courses.forEach(c=>{ if(!state.courses.some(x=>x.id===c.id)){ state.courses.push(ensure(c)); n++; } }); toast(n+\" course(s) merged\"); }\n      else { if(!confirm(\"Replace ALL current data with this backup?\")) return; state=d; state.courses.forEach(ensure); toast(\"Backup restored\"); }\n      if(!state.activeCourseId&&state.courses.length) state.activeCourseId=state.courses[0].id; save(); refresh(); }\n    catch(err){ alert(\"That file is not a valid backup.\"); } };\n  rd.readAsText(f); input.value=\"\";\n}\nfunction wipeAll(){ if(!confirm(\"Erase ALL courses, marks and settings from this browser? Export a backup first.\")) return; if(!confirm(\"Really erase everything?\")) return; localStorage.removeItem(STORE_KEY); state={courses:[],activeCourseId:null}; refresh(); toast(\"Erased\"); }\nfunction loadDemo(){\n  const P=plos(); const id=()=>uid();\n  const clos=[{text:\"Explain the core concepts, theories and terminology of the subject in their disciplinary context.\",bloom:\"Understand\",domain:\"Fundamental\",plo:{[P[0]?.code]:3},tla:[\"Interactive lecture with Q&A\",\"Self-directed reading\"],slt:{lec:\"14\",tut:\"4\",prac:\"\",self:\"16\",asm:\"6\"}},\n    {text:\"Apply appropriate methods and tools to analyse a real-life problem and justify the chosen solution.\",bloom:\"Analyze\",domain:\"Thinking\",plo:{[P[0]?.code]:2,[P[1]?.code]:3},tla:[\"Tutorial / problem-solving class\",\"Case study\"],slt:{lec:\"14\",tut:\"6\",prac:\"\",self:\"16\",asm:\"8\"}},\n    {text:\"Communicate findings in a well-structured written report and an oral presentation.\",bloom:\"Create\",domain:\"Social\",plo:{[P[2]?.code]:3},tla:[\"Seminar / student presentation\",\"Project-based learning\"],slt:{lec:\"6\",tut:\"2\",prac:\"\",self:\"12\",asm:\"8\"}},\n    {text:\"Work effectively in a team, reflecting on ethical and societal implications of the work.\",bloom:\"Evaluate\",domain:\"Personal\",plo:{[P[3]?.code]:2,[P[4]?.code]:2},tla:[\"Group discussion\",\"Project-based learning\"],slt:{lec:\"4\",tut:\"\",prac:\"\",self:\"8\",asm:\"4\"}}].map(x=>Object.assign({id:id(),assess:[]},x));\n  const A=(type,name,w,date,fb,items)=>({id:id(),type,name,weightPct:w,date,fbDate:fb,fbMode:\"Scripts returned in class\",rubric:type!==\"Quiz\",items:items.map(([l,k,lv,m])=>({id:id(),label:l,cloId:clos[k].id,level:lv,max:m}))});\n  const c=ensure({id:id(),code:\"GED 2103\",title:\"Introduction to Research and Communication\",credit:\"3\",semester:\"Spring 2026\",program:inst().program||\"BA (Hons)\",section:\"A\",instructor:\"Dr. Farhana Karim\",prereq:\"None\",type:\"General Education\",\n    objectives:\"To equip students with basic research literacy and the ability to communicate evidence-based arguments in academic and professional settings.\",\n    synopsis:\"Sources of knowledge, research questions, evidence and argument, basic data analysis, academic writing and presentation. A general-education course supporting PLOs in communication and critical thinking (Criterion 4.7).\",\n    textbooks:\"Booth, W. C. et al. (2016). The Craft of Research, 4th ed. University of Chicago Press.\",refs:\"Graff, G. & Birkenstein, C. (2018). They Say / I Say, 4th ed.\\nUniversity library databases; LMS course site.\",\n    facilities:\"Multimedia classroom; LMS; library e-resources; presentation equipment.\",rubricNote:\"Report and presentation are assessed with analytic rubrics (structure, evidence, clarity, delivery) shared in week 1.\",\n    routineRef:\"Spring 2026 routine, Room 302, Sun & Tue 11:00–12:30\",clos,students:[],marks:{},cfg:defaultCfg(),\n    assessments:[A(\"Quiz\",\"Quiz 1\",\"10\",\"2026-02-10\",\"2026-02-17\",[[\"Q1\",0,\"Understand\",5],[\"Q2\",0,\"Understand\",5]]),A(\"Assignment\",\"Case analysis\",\"15\",\"2026-03-05\",\"2026-03-15\",[[\"Task\",1,\"Analyze\",15]]),A(\"Mid Term\",\"Mid-term examination\",\"20\",\"2026-03-20\",\"2026-04-01\",[[\"Q1\",0,\"Understand\",10],[\"Q2\",1,\"Analyze\",10]]),A(\"Project\",\"Group report & presentation\",\"25\",\"2026-04-25\",\"2026-05-05\",[[\"Report\",2,\"Create\",15],[\"Presentation\",2,\"Create\",5],[\"Teamwork & reflection\",3,\"Evaluate\",5]]),A(\"Final Exam\",\"Final examination\",\"30\",\"2026-05-20\",\"\",[[\"Q1\",0,\"Understand\",10],[\"Q2\",1,\"Analyze\",12],[\"Q3\",1,\"Apply\",8]])]});\n  const topics=[\"Course introduction; what is research\",\"Sources of knowledge and evidence\",\"Framing a research question\",\"Finding and evaluating sources\",\"Argument and counter-argument\",\"Basic data: tables and charts\",\"Mid-term review\",\"Mid-term examination\",\"Academic writing: structure\",\"Citation and academic integrity\",\"Oral presentation skills\",\"Teamwork and ethics in research\",\"Project presentations\",\"Course review and feedback\"];\n  c.weeks.forEach((w,i)=>{ w.topic=topics[i]||\"\"; w.hrs=\"3\"; w.tla=i<6?\"Interactive lecture with Q&A\":(i<9?\"Tutorial / problem-solving class\":\"Seminar / student presentation\"); w.clos=[clos[i<4?0:(i<8?1:(i<12?2:3))].id]; });\n  const names=[\"Ayesha Siddiqua\",\"Tanvir Ahmed\",\"Nusrat Jahan\",\"Rakib Hasan\",\"Sadia Islam\",\"Mehedi Hasan\",\"Farzana Akter\",\"Sabbir Rahman\",\"Tasnim Chowdhury\",\"Arif Hossain\",\"Sumaiya Khan\",\"Imran Kabir\",\"Rafia Sultana\",\"Nayeem Uddin\",\"Jannatul Ferdous\",\"Shakil Mahmud\",\"Mim Akter\",\"Fahim Faisal\",\"Lamia Haque\",\"Zubair Alam\"];\n  const items=allItems(c);\n  names.forEach((nm,i)=>{ const s={id:id(),sid:\"2024-1-30-\"+String(i+1).padStart(3,\"0\"),name:nm}; c.students.push(s); c.marks[s.id]={}; const abil=0.35+((i*37)%100)/100*0.6; items.forEach((it,k)=>{ const f=Math.max(0,Math.min(1,abil+(((i*13+k*7)%21)-10)/40-(it.cloId===clos[1].id?0.3:0))); c.marks[s.id][it.id]=Math.round(parseFloat(it.max)*f*2)/2; }); });\n  c.sessions=c.weeks.flatMap((w,i)=>[{date:`2026-0${i<4?2:(i<8?3:(i<13?4:5))}-${String(((i*7)%26)+1).padStart(2,\"0\")}`,kind:\"Lecture\",topic:w.topic,present:String(15+((i*3)%6)),cancelled:i===6,makeup:false,note:i===6?\"Public holiday — make-up held 2026-03-19\":\"\"},...(i===6?[{date:\"2026-03-19\",kind:\"Lecture\",topic:w.topic,present:\"18\",cancelled:false,makeup:true,note:\"Make-up class; notice issued 2026-03-15\"}]:[])]);\n  c.sessions.push({date:\"2026-03-02\",kind:\"Tutorial\",topic:\"Problem-solving: research questions\",present:\"17\",cancelled:false,makeup:false,note:\"\"});\n  c.survey.n=\"18\"; clos.forEach((co,i)=>{ c.survey.tally[co.id]=[0,1,i===1?5:2,8,i===1?4:7].map(String); }); FB_ITEMS.forEach(([k],i)=>{ c.survey.fbTally[k]=[0,i===4?3:1,i===4?5:2,8,i===4?2:7].map(String); });\n  c.survey.openQ[0].sum=\"Case discussions and the group project were most valued.\"; c.survey.openQ[1].sum=\"Return quiz and assignment scripts sooner; more practice on data analysis.\";\n  c.evalT={wentWell:\"Case discussions produced strong participation; the project rubric made grading transparent.\",difficulties:\"Students struggled with analytical tasks (CLO2); feedback on the assignment took ten days.\",attainComment:\"CLO2 fell below target in both direct and survey measures — the analytical items in the mid-term were harder than the practice set.\",surveyComment:\"Feedback timeliness rated lowest; students want more worked examples.\",resComment:\"Adequate; a second projector for group presentations would help.\",date:\"2026-06-02\"};\n  c.report.cqi=[\"CLO2 attained by fewer students than the target — add two tutorial sessions with worked analytical examples before the mid-term; include one practice case in Quiz 1.\",\"CLO2 rated lowest in the survey — share model answers for the case analysis; return scripts within seven days and post marks on the LMS.\",\"PLO2 contribution below target through CLO2 — same actions as above; coordinate with the programme committee on analytical skills across courses.\",\"\"];\n  c.report.coComment=\"CLO2 fell below target in both direct and survey measures — the analytical items in the mid-term were harder than the practice set (assessment design), and students had little guided practice (teaching).\";\n  c.report.feedback=\"Feedback timeliness rated lowest; students want more worked examples.\";\n  c.spec.cqiPrev[0]={rec:\"CLO3 attained by only 46% of students — presentations were rushed into a single week; allot two weeks and share the rubric at the start.\",ref:\"Weeks 13–14 now reserved for project presentations; the analytic rubric is shared in week 1.\"};\n  c.spec.cqiPrev[1]={rec:\"Students rated the timeliness of feedback lowest (2.9/5) — return scripts sooner.\",ref:\"Feedback dates fixed in the assessment plan: within 7 days for quizzes, 10 for the case analysis.\"};\n  c.spec.cqiPrev[2]={rec:\"PLO3 (communication) contribution was below target — strengthen the written report component.\",ref:\"\"};\n  c.spec.prevIneffective=[\"Self-directed reading\"];\n  c.weeks.forEach((w,i)=>{ w.m=i===1?\"Quiz 1\":(i===4?\"Case analysis\":(i===7?\"Mid-term\":(i===12?\"Project presentation\":\"\"))); w.actual=i===6?\"0\":(i===7?\"4\":\"3\"); });\n  c.report.tlaA={\"Case study\":{eff:\"Yes\",diff:\"Cases need shorter texts for the time available.\"},\"Interactive lecture with Q&A\":{eff:\"Yes\",diff:\"\"},\"Tutorial / problem-solving class\":{eff:\"Partly\",diff:\"Only one tutorial was held; students asked for more.\"}};\n  c.moderation={date:\"2026-05-10\",members:\"Dr. F. Karim; Mr. S. Alam (Course Coordinator)\",external:\"Prof. R. Hossain, Dept. of English, University of Dhaka\",note:\"Q2 wording simplified; CLO coverage confirmed; marks distribution approved.\",coverage:{[clos[0].id]:true,[clos[1].id]:true}};\n  state.courses.push(c); state.activeCourseId=c.id; save(); refresh(); showTab(\"dashboard\"); toast(\"Demonstration course loaded\");\n}\n\n/* ============ About ============ */\nconst ABOUT_BASIS=[\n [\"Outcome-based design\",\"The whole app follows the outcome-based logic: outcomes are declared first, then delivery and assessment are chosen to serve them, and attainment evidence feeds the next cycle.\",[1,2,3,9]],\n [\"Course Info thresholds\",\"A pass mark and a cohort target turn marks into an attainment judgement. Both are conventions, not measurements — hence they are editable, declared on every report, and set before marking begins.\",[10,12,33]],\n [\"Writing CLOs\",\"Outcomes must name an observable, assessable performance; “know”, “understand” and “be aware of” cannot be measured, which is why CM flags them. Bloom's revised taxonomy supplies the levels; SOLO offers the progression view.\",[4,5,6,7,8,11]],\n [\"CLO–PLO mapping and BNQF domains\",\"Course outcomes contribute to programme outcomes only where the mapping is honest; inflated mapping dilutes the programme picture. Alignment depth, not tick coverage, is what matters.\",[2,9,10,12]],\n [\"Teaching-learning activities\",\"Active and inductive methods outperform transmission on the same outcomes, which is why the pool is activity-based and each CLO must carry at least one.\",[13,14,15,16]],\n [\"Notional hours / student learning time\",\"Credit expresses expected learning time. Perceived overload — not hours alone — drives surface learning, so the SLT table is compared against the credit guide rather than treated as a target.\",[17,18]],\n [\"Assessment design\",\"Assessment determines what students actually learn. Items are tagged to one CLO, levels are declared, and the higher-order share is reported, because tasks pitched below the outcome cannot evidence it.\",[2,4,9,10,19,22]],\n [\"Rubrics and criteria in advance\",\"Explicit criteria raise marking reliability and student performance; rubrics shared before the task are formative rather than merely administrative.\",[23,24,25,26]],\n [\"Timely feedback\",\"Feedback changes attainment only while the work is still live; CM records the return date and flags anything beyond two weeks.\",[19,20,21]],\n [\"Attendance and class records\",\"Attendance correlates with achievement more strongly than most study predictors, which makes the session log evidence about learning, not only compliance.\",[27,17]],\n [\"Attainment computation\",\"Direct measurement from marks is the primary evidence; the student survey is a perception measure and is weighted, never averaged in blindly.\",[12,20,28,29]],\n [\"Student course evaluation survey\",\"Student ratings are informative about experience and workload but are weak proxies for learning, so CM keeps them as the indirect measure with an explicit weight.\",[28,29]],\n [\"CQI as one loop\",\"The improvement cycle is a plan–do–check–act loop: Course Specifications 6.1 states what this offering does about the last report's recommendations, Course Report 6.1 states what the next one should do. A recommendation that is never acted on is not a loop.\",[30,31,32,33]],\n [\"Documents and the course file\",\"Formats follow the UGC OBE template and the BAC manual; CM only assembles them from data entered once, so the file and the practice cannot drift apart.\",[33,34]],\n [\"What CM does not attempt\",\"Programme-level aggregation of PLOs, curriculum review, faculty and facility standards and institutional QA belong to the Self-Assessment Report and the IQAC, not to a course file.\",[33,35]]];\nfunction renderAbout(){\n  document.getElementById(\"tab-about\").innerHTML=`\n  <div class=\"card\"><h2>Course Manager <span class=\"badge grey\">${APP_VERSION} · ${APP_RELEASE}<\u002Fspan><\u002Fh2>\n    <p class=\"hint\" style=\"margin-bottom:6px\"><a href=\"${APP_URL}\" target=\"_blank\" rel=\"noopener\">${APP_URL}<\u002Fa><\u002Fp>\n    <p class=\"hint\">A course-level companion for programmes preparing for accreditation by the Bangladesh Accreditation Council (BAC) under the Accreditation Manual, 2nd edition (2024), the UGC outcome-based curriculum template and the Bangladesh National Qualifications Framework (BNQF).<\u002Fp>\n    <p style=\"margin:10px 0 0\"><a href=\"${GUIDE_URL}\" target=\"_blank\" rel=\"noopener\" style=\"font-weight:800\">📖 Open the User Guide<\u002Fa> <span class=\"hint\" style=\"display:inline\">— the full walkthrough: setup, storage options, each section, the CQI loop, the attainment arithmetic worked through, troubleshooting and a criterion map. Printable.<\u002Fspan><\u002Fp>\n    <h3>What it covers<\u002Fh3>\n    <table class=\"tbl\"><thead><tr><th>Section<\u002Fth><th>BAC standard / criterion<\u002Fth><\u002Ftr><\u002Fthead><tbody>\n      <tr><td>Course Info, CLOs & Mapping<\u002Ftd><td>Standard 4 — Curriculum: 4.4 measurable outcomes, 4.6 CLO–PLO alignment, 4.8 course file & course plan; BNQF learning-outcome domains<\u002Ftd><\u002Ftr>\n      <tr><td>T&L<\u002Ftd><td>5.2 student learning time and notional hours; 5.4 course plan available to students; 5.8 alignment of CLOs, activities and assessment<\u002Ftd><\u002Ftr>\n      <tr><td>Assessments, Attendance<\u002Ftd><td>5.1 HOTS and evidence; 5.3 schedule, attendance, make-up classes; 5.5 timely feedback; 5.6 moderation; 5.9 tutorials<\u002Ftd><\u002Ftr>\n      <tr><td>Attainment<\u002Ftd><td>4.8 (iv) course evaluation report — attainment of CLOs and contribution to PLOs<\u002Ftd><\u002Ftr>\n      <tr><td>CQI<\u002Ftd><td>Standard 10 — 10.2 teacher and student course evaluation; 10.3 using feedback for continual improvement, through the linked Course Specifications 6.1 ⇄ Course Report 6.1 tables<\u002Ftd><\u002Ftr>\n      <tr><td>Documents<\u002Ftd><td>Course Outline in the UGC Bangladesh OBE format (Parts A–D) and a Course File Checklist on UGC's Template for Course File; key documents for OBE implementation prepared every semester — plus BAC course-file records<\u002Ftd><\u002Ftr><\u002Ftbody><\u002Ftable>\n    <h3>What it deliberately leaves out<\u002Fh3>\n    <p class=\"hint\">Engineering-specific constructs of BAETE / Washington Accord accreditation — the fixed twelve Programme Outcomes, WK/WP/EA attributes, PO indicators, complex engineering problems and activities (CEP/CEA), SDG mapping and the PEO loop. BAC's criteria are general across disciplines, and programme-level matters (curriculum committee, admission, faculty, facilities, research, IQAC, UIC) belong in the Self-Assessment Report, not in a course file.<\u002Fp>\n  <\u002Fdiv>\n  <div class=\"card\"><h2>Methodological and Evidence Basis<\u002Fh2>\n    <p class=\"hint\">Every Section rests on curriculum, assessment and quality-assurance literature. The bracketed numbers cite the References below, and the same citations appear in the guidance strip at the top of each Section — click any number to jump to it.<\u002Fp>\n    <table class=\"tbl\"><tbody>${ABOUT_BASIS.map(([n,txt,ns])=>`<tr><th style=\"width:210px;vertical-align:top\">${n}<\u002Fth><td style=\"font-size:12.5px\">${txt} ${refCite(ns)}<\u002Ftd><\u002Ftr>`).join(\"\")}<\u002Ftbody><\u002Ftable>\n  <\u002Fdiv>\n  <div class=\"card\"><h2>References<\u002Fh2>\n    <ol style=\"font-size:12.5px;line-height:1.6;padding-left:24px;margin:6px 0\">${REFS.map((r,i)=>`<li id=\"ref-${i+1}\" style=\"margin:6px 0;padding:2px 6px;transition:background .4s\">${r}<\u002Fli>`).join(\"\")}<\u002Fol>\n    <p class=\"hint\" style=\"margin-top:6px\">Standards, criteria and document formats are reproduced from the BAC manual [33] and the UGC template [34]; those are regulatory sources rather than research findings, and where the literature and a regulation differ, the regulation governs what must be filed.<\u002Fp>\n  <\u002Fdiv>\n  <div class=\"card\"><h2>Data, privacy and credits<\u002Fh2>\n    <p class=\"hint\">All data stays in this browser; nothing is transmitted. Export backups from Data & Backup.<\u002Fp>\n    <p class=\"hint\">Adapted from <i>OBE Course Manager<\u002Fi> by Prof. Mazharul Islam (<a href=\"${AUTHOR_URL}\" target=\"_blank\" rel=\"noopener\">${AUTHOR_URL}<\u002Fa>) (CC BY 4.0). This adaptation is likewise distributed under the Creative Commons Attribution 4.0 International License.<\u002Fp>\n  <\u002Fdiv>`;\n}\n\n/* ============ Init ============ */\nbuildShell(); load(); renderCourseSelect();\nif(state.courses.length&&!state.activeCourseId) state.activeCourseId=state.courses[0].id;\n[\"verChip\",\"verFoot\"].forEach(id=>{ const e=document.getElementById(id); if(e) e.textContent=APP_VERSION; });\nshowTab(\"dashboard\");\ngrowAll();\nrestoreDrive(); updateFileChip();\nif(drive) driveCheckRemote();\nif(FS_OK) idbGet(\"main\").then(hd=>{ if(hd){ fileHandle=hd; filePermOk=false; } updateFileChip(); }).catch(()=>{});\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
